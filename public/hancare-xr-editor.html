<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XR실습 편집기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 색·폰트 토큰·공통 스타일은 단어장 편집기(hancare-vocab-editor.html)와 같다. */
  :root{
    --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EAF0EC; --surface-3:#DEE8E2;
    --ink:#16211E; --ink-muted:#5C6B66; --ink-faint:#8B9B95;
    --border:#D7E2DD; --border-strong:#B9CBC3;
    --accent:#276F5F; --accent-strong:#1D5648; --accent-ink:#FFFFFF; --accent-soft:#E1EEE8;
    --coral:#C85B36; --coral-soft:#F7E4DA; --danger:#B23B24; --danger-soft:#F6DFD9; --success:#2E8B5C;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,32,28,0.06); --shadow-md:0 8px 24px rgba(20,32,28,0.10);
    --font-display:'Gowun Batang', ui-serif, Georgia, serif;
    --font-body:'Noto Sans KR', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815; --surface:#17211D; --surface-2:#1D2924; --surface-3:#28342E;
      --ink:#E7EFEC; --ink-muted:#9DB0A9; --ink-faint:#6E8079;
      --border:#2B3A34; --border-strong:#3A4C44;
      --accent:#55B999; --accent-strong:#7BD1B3; --accent-ink:#0B1613; --accent-soft:#1E3931;
      --coral:#E88A61; --coral-soft:#3A2A20; --danger:#E58165; --danger-soft:#3E2620; --success:#59BE8B;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815; --surface:#17211D; --surface-2:#1D2924; --surface-3:#28342E;
    --ink:#E7EFEC; --ink-muted:#9DB0A9; --ink-faint:#6E8079;
    --border:#2B3A34; --border-strong:#3A4C44;
    --accent:#55B999; --accent-strong:#7BD1B3; --accent-ink:#0B1613; --accent-soft:#1E3931;
    --coral:#E88A61; --coral-soft:#3A2A20; --danger:#E58165; --danger-soft:#3E2620; --success:#59BE8B;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; padding-inline:16px;}
  h1,h2,h3{font-family:var(--font-display); margin:0;}
  input,textarea,select,button{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  #app{max-width:1400px; margin:0 auto; padding-block:18px 40px;}

  header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .brand h1{font-size:22px; font-weight:700;}
  .brand .sub{color:var(--ink-muted); font-size:12.5px;}
  .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .stat{display:flex; flex-direction:column;}
  .stat b{font-size:15px; color:var(--accent-strong); font-weight:700; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; color:var(--ink-faint);}
  .status-line{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .status-line.saving .status-dot{background:var(--coral); animation:pulse 1s infinite;}
  .status-line.saved .status-dot{background:var(--success);}
  .status-line.offline .status-dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .toolbar-group{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:5px; box-shadow:var(--shadow-sm);}
  .btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius-sm); padding:7px 11px; font-size:12.5px; font-weight:500; white-space:nowrap;}
  .btn:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger);}
  .btn.small{padding:4px 8px; font-size:11.5px; border-radius:6px;}

  .banner{display:flex; gap:10px; align-items:flex-start; background:var(--coral-soft); border:1px solid var(--coral); border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; margin-bottom:14px;}
  .banner b{color:var(--coral);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .filters input, .filters select{border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; outline:none;}
  .filters input{min-width:220px;}
  .filters input:focus, .filters select:focus{border-color:var(--accent);}
  .filters label{font-size:12.5px; color:var(--ink-muted); display:flex; gap:6px; align-items:center;}

  .layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start;}
  @media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr);} }
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:14px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:13.5px; font-weight:700;}
  .panel-head .hint{font-size:11.5px; color:var(--ink-faint);}
  .panel-body{padding:10px 12px; overflow-x:auto;}
  .empty{padding:18px; text-align:center; color:var(--ink-faint); font-size:12.5px;}

  table.grid{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.grid th{text-align:left; font-size:11px; font-weight:600; color:var(--ink-faint); padding:0 6px 6px; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.grid td{padding:4px; vertical-align:middle; border-bottom:1px solid var(--border);}
  table.grid tr:last-child td{border-bottom:none;}
  table.grid tr.is-hidden td{opacity:.5;}
  table.grid input[type=text]{width:100%; min-width:70px; border:1px solid transparent; border-radius:6px; padding:6px 7px; background:var(--surface-2); outline:none;}
  table.grid input[type=text]:focus{background:var(--surface); border-color:var(--accent);}
  table.grid input.mono{font-family:var(--font-mono); font-size:11px;}
  table.grid input.dupe{border-color:var(--danger); background:var(--danger-soft);}
  table.grid .ro{padding:6px 7px; color:var(--ink); white-space:nowrap;}
  table.grid .ro.mono{font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);}
  table.grid .src{font-size:11px; color:var(--ink-muted); white-space:nowrap;}
  table.grid .tight{width:1%; white-space:nowrap;}
  .cell-flex{display:flex; gap:4px; align-items:center;}
  .pill{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong);}

  .preview{padding:14px;}
  .vcard{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--surface);}
  .vcard .h{font-size:18px; font-weight:700; color:var(--accent-strong);}
  .vcard .r{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); margin-top:3px;}
  .vcard .n{font-size:11.5px; color:var(--ink-muted); margin-top:8px;}
  .vcard .f{display:flex; justify-content:space-between; margin-top:12px; font-size:11px; color:var(--ink-faint);}
  .vcard .f a{color:var(--accent); text-decoration:none;}
  .help{font-size:12px; color:var(--ink-muted); line-height:1.6; padding:0 14px 14px;}
  .help b{color:var(--ink);}

  .overlay{position:fixed; inset:0; background:rgba(10,16,14,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); max-width:560px; width:100%; padding:18px; max-height:85vh; overflow:auto;}
  .modal h3{font-size:15px; margin-bottom:8px;}
  .modal p{font-size:12.5px; color:var(--ink-muted); margin:0 0 10px;}
  .modal textarea{width:100%; min-height:160px; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:999px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  /* XR실습 편집기 전용 */
  .xr-layout{display:grid; grid-template-columns:240px minmax(0,1fr) 300px; gap:14px; align-items:start;}
  @media (max-width:1150px){ .xr-layout{grid-template-columns:220px minmax(0,1fr);} .xr-layout aside.right{grid-column:1 / -1;} }
  @media (max-width:760px){ .xr-layout{grid-template-columns:minmax(0,1fr);} }
  .mod-list{list-style:none; margin:0; padding:8px;}
  .mod-item{display:flex; align-items:center; gap:6px; padding:8px; border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px;}
  .mod-item:hover{background:var(--surface-2);}
  .mod-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
  .mod-item .num{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); width:18px; flex:none;}
  .mod-item .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mod-item .h{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}
  .icon-btn{border:none; background:transparent; color:var(--ink-faint); border-radius:5px; padding:2px 5px; font-size:11px; line-height:1;}
  .icon-btn:hover{background:var(--surface-3); color:var(--ink);}
  .icon-btn:disabled{opacity:.3; cursor:default;}
  .side-foot{padding:8px; border-top:1px solid var(--border);}
  .side-foot .btn{width:100%; justify-content:center;}
  .side-sum{padding:0 14px 12px; font-size:11.5px; color:var(--ink-muted);}

  .form{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; padding:14px;}
  .form .full{grid-column:1 / -1;}
  .field label{display:block; font-size:11px; font-weight:600; color:var(--ink-faint); margin-bottom:4px;}
  .field input, .field textarea{width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px; background:var(--surface); outline:none;}
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field input.mono{font-family:var(--font-mono); font-size:12px;}
  .field input.dupe{border-color:var(--danger); background:var(--danger-soft);}
  .field .note{font-size:11px; color:var(--coral); margin-top:3px;}
  table.grid textarea{width:100%; min-width:120px; border:1px solid transparent; border-radius:6px; padding:6px 7px; background:var(--surface-2); outline:none; resize:vertical; min-height:50px; font-size:12.5px; line-height:1.4;}
  table.grid textarea:focus{background:var(--surface); border-color:var(--accent);}
  table.grid td.tight{white-space:nowrap;}

  .xcard{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--surface);}
  .xcard .top{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-faint);}
  .xcard .badge{background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:1px 8px; font-weight:700;}
  .xcard .ttl{font-size:16px; font-weight:700; margin-top:8px; color:var(--ink);}
  .xcard .sub{font-size:11.5px; color:var(--ink-muted);}
  .xcard .quote{margin-top:10px; background:var(--surface-2); border-radius:10px; padding:9px 11px; font-size:12px;}
  .xcard .quote small{display:block; color:var(--ink-faint); font-size:10.5px; margin-bottom:2px;}
  .xcard .chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}
  .xcard .chip{font-size:11px; border:1px solid var(--border); border-radius:999px; padding:2px 8px; background:var(--surface);}
  .xcard .tech{margin-top:10px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>XR실습 편집기</h1>
      <div class="sub">한글케어 XR실습(HnaCare XR) — 모듈 · 환자 상황 · 인터랙션 편집</div>
      <div class="stats" id="stats"></div>
      <div class="status-line" id="statusLine"><span class="status-dot"></span><span id="statusText">불러오는 중…</span></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn" id="btnImportExcel" type="button">엑셀 불러오기</button>
        <button class="btn" id="btnImportJson" type="button">JSON 불러오기</button>
      </div>
      <div class="toolbar-group">
        <button class="btn" id="btnExportExcel" type="button">엑셀로 내보내기</button>
        <button class="btn" id="btnExportJson" type="button">JSON 내보내기</button>
      </div>
      <div class="toolbar-group">
        <button class="btn primary" id="btnAddModule" type="button">+ 새 모듈</button>
      </div>
    </div>
  </header>

  <div id="banners"></div>

  <div class="xr-layout">
    <aside>
      <section class="panel">
        <div class="panel-head"><h2>모듈 목록</h2><span class="hint">▲▼로 순서 변경</span></div>
        <ul class="mod-list" id="modList"></ul>
        <div class="side-sum" id="sideSum"></div>
        <div class="side-foot"><button class="btn small" id="btnAddModule2" type="button">+ 모듈 추가</button></div>
      </section>
    </aside>
    <main id="editor"></main>
    <aside class="right">
      <section class="panel">
        <div class="panel-head"><h2>학습자 화면 미리보기</h2></div>
        <div class="preview" id="preview"></div>
        <div class="help">
          <b>적용 방식</b><br>
          저장하면 학습자 <b>XR실습</b> 목록·실습 화면과 커리큘럼의 XR실습 항목에 바로 반영됩니다.<br>
          <b>인터랙션</b>은 실습 화면의 조작 버튼이 되고, 누르면 <b>결과 문구</b>가 로그에 표시됩니다.<br>
          모듈 id <code>xr-vital-signs</code>는 3D 실습 화면과 연결되어 있으니 바꾸지 마세요.
        </div>
      </section>
    </aside>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" class="visually-hidden">
<input type="file" id="fileExcel" accept=".xlsx,.xls" class="visually-hidden">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ==================================================================
   XR실습 편집기 — 한글케어 XR실습 모듈(content/xr-modules.json) 편집
   스키마: docs/XR_MODULE_DESIGN.md §6 (XrModule / XrInteraction)
   연결 방식 (실습내용·단어장 편집기와 같다)
   - ?host=hangulcare: 단일 파일판 hangulcare.html 안(iframe). 부모와 postMessage로 get/put.
   - 서버에서 열림: Next.js의 GET/PUT /api/xr-modules 에 자동 저장
   - file:// 로 따로 열림: 로컬 전용 모드 (JSON/엑셀 내보내기로 보관)
   ================================================================== */
(function(){
  "use strict";

  /* ---------- 백엔드 어댑터 ---------- */
  function restBackend(url){
    return {
      get: function(){ return fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); },
      put: function(data){
        return fetch(url, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data) })
          .then(function(r){ if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(b){ throw new Error(b.error || ("HTTP " + r.status)); }); });
      }
    };
  }
  function parentBackend(){
    var seq = 0, pending = {};
    window.addEventListener("message", function(e){
      var d = e.data;
      if(e.source !== window.parent || !d || d.hcXr !== "res" || !pending[d.id]) return;
      var p = pending[d.id]; delete pending[d.id];
      if(d.ok) p.resolve(d.data); else p.reject(new Error(d.error || "저장 실패"));
    });
    function call(op, payload){
      return new Promise(function(resolve, reject){
        var id = ++seq; pending[id] = { resolve:resolve, reject:reject };
        window.parent.postMessage({ hcXr:"req", id:id, op:op, payload:payload }, "*");
      });
    }
    return { get: function(){ return call("get"); }, put: function(data){ return call("put", data); } };
  }
  var backend = null;
  if(/[?&]host=hangulcare\b/.test(location.search) && window.parent !== window) backend = parentBackend();
  else if(location.protocol !== "file:") backend = restBackend("/api/xr-modules");

  /* ---------- 상태 ---------- */
  var modules = [];
  var current = null;   // 선택한 모듈 객체 (id를 편집 중이어도 선택이 유지되도록 객체로 들고 있는다)
  var saveTimer = null;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function active(){ return modules.indexOf(current) !== -1 ? current : null; }
  function uniqueId(base, used){ var id = base, i = 2; while(used.has(id)){ id = base + "-" + i++; } return id; }
  function normalize(arr){
    return (Array.isArray(arr) ? arr : []).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); }).map(function(m){
      return {
        id: String(m.id || ""), titleKo: m.titleKo || "", titleEn: m.titleEn || "",
        legalHours: typeof m.legalHours === "number" ? m.legalHours : Number(m.legalHours) || 0,
        patientNameKo: m.patientNameKo || "", situationKo: m.situationKo || "", situationEn: m.situationEn || "",
        techNoteKo: m.techNoteKo || "",
        interactions: (m.interactions || []).map(function(it){
          return { id: String(it.id || ""), labelKo: it.labelKo || "", labelEn: it.labelEn || "", resultKo: it.resultKo || "", resultEn: it.resultEn || "" };
        })
      };
    });
  }
  function exportArray(){
    return modules.map(function(m, i){
      return { id:m.id, order:i + 1, titleKo:m.titleKo, titleEn:m.titleEn, legalHours:m.legalHours, patientNameKo:m.patientNameKo,
        situationKo:m.situationKo, situationEn:m.situationEn, techNoteKo:m.techNoteKo,
        interactions: m.interactions.map(function(it){ return { id:it.id, labelKo:it.labelKo, labelEn:it.labelEn, resultKo:it.resultKo, resultEn:it.resultEn }; }) };
    });
  }
  function problems(){
    var list = [], seen = {};
    modules.forEach(function(m, i){
      if(!m.id.trim()) list.push((i+1) + "번째 모듈 id가 비어 있어요");
      else if(seen[m.id]) list.push("모듈 id 중복: " + m.id);
      seen[m.id] = true;
      var s2 = {};
      m.interactions.forEach(function(it){
        if(!it.id.trim()) list.push(m.titleKo + ": 인터랙션 id가 비어 있어요");
        else if(s2[it.id]) list.push(m.titleKo + ": 인터랙션 id 중복 " + it.id);
        s2[it.id] = true;
      });
    });
    return list;
  }

  /* ---------- 저장 ---------- */
  function setStatus(mode, text){
    document.getElementById("statusLine").className = "status-line " + mode;
    document.getElementById("statusText").textContent = text;
  }
  function scheduleSave(){
    renderStats();
    if(!backend){ setStatus("offline", "로컬 전용 모드 — 내보내기로 저장하세요"); return; }
    clearTimeout(saveTimer);
    var bad = problems();
    if(bad.length){ setStatus("offline", "저장 보류 — " + bad[0]); return; }
    setStatus("saving", "저장 대기…");
    saveTimer = setTimeout(function(){
      setStatus("saving", "저장 중…");
      backend.put(exportArray()).then(function(){
        var t = new Date();
        setStatus("saved", "저장됨 · " + pad2(t.getHours()) + ":" + pad2(t.getMinutes()) + " · XR실습 화면에 반영됨");
      }).catch(function(err){ setStatus("offline", "저장 실패 — " + err.message); });
    }, 600);
  }

  /* ---------- 렌더 ---------- */
  function renderStats(){
    var hours = modules.reduce(function(s, m){ return s + (Number(m.legalHours) || 0); }, 0);
    var its = modules.reduce(function(s, m){ return s + m.interactions.length; }, 0);
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + modules.length + '</b><span>모듈</span></div>' +
      '<div class="stat"><b>' + its + '</b><span>인터랙션</span></div>' +
      '<div class="stat"><b>' + hours + '</b><span>법정 실습시간 합계(h)</span></div>';
    document.getElementById("sideSum").textContent = "법정 실습시간 합계 " + hours + "시간";
  }
  function renderList(){
    var el = document.getElementById("modList");
    if(!modules.length){ el.innerHTML = '<li class="empty">모듈이 없습니다</li>'; return; }
    el.innerHTML = modules.map(function(m, i){
      return '<li class="mod-item' + (m === current ? " active" : "") + '" data-mid="' + esc(m.id) + '" data-idx="' + i + '">' +
        '<span class="num">' + (i + 1) + '</span><span class="t">' + esc(m.titleKo || "(제목 없음)") + '</span>' +
        '<span class="h">' + esc(m.legalHours) + 'h</span>' +
        '<button class="icon-btn" data-move="-1" type="button" title="위로"' + (i === 0 ? " disabled" : "") + '>▲</button>' +
        '<button class="icon-btn" data-move="1" type="button" title="아래로"' + (i === modules.length - 1 ? " disabled" : "") + '>▼</button>' +
      '</li>';
    }).join("");
  }
  function field(label, key, value, opts){
    opts = opts || {};
    var input = opts.textarea
      ? '<textarea data-mf="' + key + '" rows="2">' + esc(value) + '</textarea>'
      : '<input data-mf="' + key + '" type="' + (opts.number ? "number" : "text") + '"' + (opts.number ? ' min="0" step="1"' : "") + ' value="' + esc(value) + '"' + (opts.cls ? ' class="' + opts.cls + '"' : "") + '>';
    return '<div class="field' + (opts.full ? " full" : "") + '"><label>' + label + '</label>' + input + (opts.note ? '<div class="note">' + opts.note + '</div>' : "") + '</div>';
  }
  function renderEditor(){
    var el = document.getElementById("editor"), m = active();
    if(!m){ el.innerHTML = '<section class="panel"><div class="empty">왼쪽에서 모듈을 선택하거나 새 모듈을 추가하세요.</div></section>'; return; }
    var dupId = modules.filter(function(x){ return x.id === m.id; }).length > 1;
    el.innerHTML =
      '<section class="panel"><div class="panel-head"><h2>모듈 정보</h2><button class="btn small danger" id="btnDelModule" type="button">이 모듈 삭제</button></div>' +
      '<div class="form">' +
        field("모듈 ID", "id", m.id, { cls: "mono" + (dupId || !m.id.trim() ? " dupe" : ""), note: m.id === "xr-vital-signs" ? "3D 실습 화면과 연결된 id입니다 — 바꾸면 3D 화면이 열리지 않아요" : "" }) +
        field("법정 실습시간 (시간)", "legalHours", m.legalHours, { number: true }) +
        field("모듈명 (한글)", "titleKo", m.titleKo) +
        field("모듈명 (영문)", "titleEn", m.titleEn) +
        field("환자 이름", "patientNameKo", m.patientNameKo) +
        field("적용 기술 (표시용)", "techNoteKo", m.techNoteKo) +
        field("환자 첫 마디 / 상황 (한글)", "situationKo", m.situationKo, { textarea: true, full: true }) +
        field("환자 첫 마디 / 상황 (영문)", "situationEn", m.situationEn, { textarea: true, full: true }) +
      '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>인터랙션 (' + m.interactions.length + ')</h2><span class="hint">실습 화면의 조작 버튼 · 누르면 결과 문구가 로그에 표시</span></div>' +
      '<div class="panel-body">' + renderInteractions(m) + '</div>' +
      '<div class="side-foot"><button class="btn small" id="btnAddInteraction" type="button">+ 인터랙션 추가</button></div></section>';
  }
  function renderInteractions(m){
    if(!m.interactions.length) return '<div class="empty">인터랙션이 없습니다.</div>';
    var seen = {}, dup = {};
    m.interactions.forEach(function(it){ if(seen[it.id]) dup[it.id] = true; seen[it.id] = true; });
    return '<table class="grid"><thead><tr><th></th><th>버튼 이름 (한글)</th><th>버튼 이름 (영문)</th><th>결과 문구 (한글)</th><th>결과 문구 (영문)</th><th>ID</th><th></th></tr></thead><tbody>' +
      m.interactions.map(function(it, i){
        return '<tr data-iidx="' + i + '">' +
          '<td class="tight"><button class="icon-btn" data-imove="-1" type="button"' + (i === 0 ? " disabled" : "") + '>▲</button><button class="icon-btn" data-imove="1" type="button"' + (i === m.interactions.length - 1 ? " disabled" : "") + '>▼</button></td>' +
          '<td><input type="text" data-if="labelKo" value="' + esc(it.labelKo) + '"></td>' +
          '<td><input type="text" data-if="labelEn" value="' + esc(it.labelEn) + '"></td>' +
          '<td><textarea data-if="resultKo" rows="2">' + esc(it.resultKo) + '</textarea></td>' +
          '<td><textarea data-if="resultEn" rows="2">' + esc(it.resultEn) + '</textarea></td>' +
          '<td><input type="text" data-if="id" class="mono' + (dup[it.id] || !it.id.trim() ? " dupe" : "") + '" value="' + esc(it.id) + '"></td>' +
          '<td class="tight"><button class="btn small danger" data-idel="1" type="button">삭제</button></td>' +
        '</tr>';
      }).join("") + '</tbody></table>';
  }
  function renderPreview(){
    var el = document.getElementById("preview"), m = active();
    if(!m){ el.innerHTML = '<div class="empty">모듈을 선택하세요</div>'; return; }
    var idx = modules.indexOf(m);
    el.innerHTML = '<div class="xcard">' +
      '<div class="top"><span class="badge">' + (idx + 1) + '</span><span>법정 ' + esc(m.legalHours) + '시간</span>' + (m.id === "xr-vital-signs" ? '<span>· 3D 실습 가능</span>' : "") + '</div>' +
      '<div class="ttl">' + esc(m.titleKo || "(모듈명)") + '</div><div class="sub">' + esc(m.titleEn) + '</div>' +
      '<div class="quote"><small>환자 ' + esc(m.patientNameKo || "—") + '</small>“' + esc(m.situationKo) + '”</div>' +
      '<div class="chips">' + m.interactions.map(function(it){ return '<span class="chip">' + esc(it.labelKo || it.id) + '</span>'; }).join("") + '</div>' +
      (m.techNoteKo ? '<div class="tech">' + esc(m.techNoteKo) + '</div>' : "") +
    '</div>';
  }
  function renderBanners(){
    document.getElementById("banners").innerHTML = backend ? "" :
      '<div class="banner"><div><b>로컬 전용 모드.</b> 한글케어 서버/앱 밖에서 파일만 열어 자동 저장이 꺼져 있어요. ' +
      '관리자 메뉴 "XR실습 편집"에서 열면 학습자 XR실습 화면에 바로 반영됩니다. 여기서 편집한 내용은 JSON/엑셀로 내보내 보관하세요.</div></div>';
  }
  function renderAll(){ renderStats(); renderList(); renderEditor(); renderPreview(); renderBanners(); }

  /* ---------- 편집 이벤트 ---------- */
  document.addEventListener("input", function(ev){
    var t = ev.target, m = active(); if(!m) return;
    var mf = t.getAttribute && t.getAttribute("data-mf");
    var inf = t.getAttribute && t.getAttribute("data-if");
    if(mf){
      if(mf === "legalHours") m.legalHours = Math.max(0, Number(t.value) || 0);
      else if(mf === "id"){
        m.id = t.value.trim();
        var dup = !m.id || modules.filter(function(x){ return x.id === m.id; }).length > 1;
        t.classList.toggle("dupe", dup);
      } else m[mf] = t.value;
      renderList(); renderPreview(); scheduleSave();
    } else if(inf){
      var tr = t.closest("tr[data-iidx]"); if(!tr) return;
      var it = m.interactions[Number(tr.getAttribute("data-iidx"))];
      it[inf] = inf === "id" ? t.value.trim() : t.value;
      if(inf === "id"){
        var ids = m.interactions.map(function(x){ return x.id; });
        document.querySelectorAll('#editor tr[data-iidx] input[data-if="id"]').forEach(function(inp, i){
          inp.classList.toggle("dupe", !ids[i] || ids.indexOf(ids[i]) !== i);
        });
      }
      renderPreview(); scheduleSave();
    }
  });
  document.addEventListener("click", function(ev){
    var t = ev.target;
    var li = t.closest && t.closest(".mod-item");
    if(li){
      var idx = Number(li.getAttribute("data-idx"));
      var mv = t.closest("[data-move]");
      if(mv){
        if(mv.disabled) return;
        var j = idx + Number(mv.getAttribute("data-move"));
        var tmp = modules[idx]; modules[idx] = modules[j]; modules[j] = tmp;
        current = tmp;
        renderAll(); scheduleSave(); return;
      }
      current = modules[idx]; renderAll(); return;
    }
    var m = active(); if(!m) return;
    var tr = t.closest && t.closest("tr[data-iidx]");
    if(tr){
      var i = Number(tr.getAttribute("data-iidx"));
      var im = t.closest("[data-imove]");
      if(im && !im.disabled){
        var k = i + Number(im.getAttribute("data-imove"));
        var x = m.interactions[i]; m.interactions[i] = m.interactions[k]; m.interactions[k] = x;
        renderEditor(); renderPreview(); scheduleSave(); return;
      }
      if(t.closest("[data-idel]")){
        m.interactions.splice(i, 1);
        renderEditor(); renderPreview(); scheduleSave(); toast("인터랙션을 삭제했어요"); return;
      }
    }
    if(t.id === "btnAddInteraction"){
      var used = new Set(m.interactions.map(function(x){ return x.id; }));
      m.interactions.push({ id: uniqueId("action-" + (m.interactions.length + 1), used), labelKo:"", labelEn:"", resultKo:"", resultEn:"" });
      renderEditor(); renderPreview(); scheduleSave();
      var rows = document.querySelectorAll('#editor tr[data-iidx] input[data-if="labelKo"]');
      if(rows.length) rows[rows.length - 1].focus();
    }
    if(t.id === "btnDelModule") confirmModal("모듈 삭제", "“" + (m.titleKo || m.id) + "” 모듈과 인터랙션 " + m.interactions.length + "개를 삭제할까요?", "삭제", function(){
      var idx2 = modules.indexOf(m);
      modules.splice(idx2, 1);
      current = modules[Math.min(idx2, modules.length - 1)] || null;
      renderAll(); scheduleSave(); toast("모듈을 삭제했어요");
    });
  });
  function addModule(){
    var used = new Set(modules.map(function(x){ return x.id; }));
    var m = { id: uniqueId("xr-module-" + (modules.length + 1), used), titleKo:"새 XR 모듈", titleEn:"New XR module", legalHours:0,
      patientNameKo:"", situationKo:"", situationEn:"", techNoteKo:"", interactions:[] };
    modules.push(m); current = m;
    renderAll(); scheduleSave();
    var inp = document.querySelector('#editor input[data-mf="titleKo"]'); if(inp){ inp.focus(); inp.select(); }
  }
  document.getElementById("btnAddModule").addEventListener("click", addModule);
  document.getElementById("btnAddModule2").addEventListener("click", addModule);

  /* ---------- 모달 / 토스트 ---------- */
  var toastTimer;
  function toast(msg){
    var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }
  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
  function openModal(html){
    document.getElementById("modalRoot").innerHTML = '<div class="overlay" id="overlayEl">' + html + '</div>';
    document.getElementById("overlayEl").onclick = function(e){ if(e.target.id === "overlayEl") closeModal(); };
  }
  function confirmModal(title, msg, okLabel, onOk){
    openModal('<div class="modal"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="modal-actions">' +
      '<button class="btn" id="mCancel" type="button">취소</button><button class="btn danger" id="mOk" type="button">' + esc(okLabel) + '</button></div></div>');
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mOk").onclick = function(){ closeModal(); onOk(); };
  }
  function download(name, blob){
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- 불러오기 / 내보내기 ---------- */
  function replaceAll(arr, label){
    var next = normalize(arr);
    if(!next.length) throw new Error("모듈이 하나도 없어요");
    modules = next; current = modules[0];
    renderAll(); scheduleSave(); toast(label + " 불러오기를 완료했어요");
  }
  document.getElementById("btnExportJson").addEventListener("click", function(){
    download("xr-modules.json", new Blob([JSON.stringify(exportArray(), null, 2) + "\n"], { type:"application/json" }));
  });
  document.getElementById("btnImportJson").addEventListener("click", function(){
    openModal('<div class="modal"><h3>JSON 불러오기</h3><p>xr-modules.json 형식(모듈 배열)을 붙여넣거나 파일을 선택하세요. 지금 모듈 전체를 <b>교체</b>합니다.</p>' +
      '<textarea id="jsonIn"></textarea><div class="modal-actions">' +
      '<button class="btn" id="mCancel" type="button">취소</button><button class="btn" id="mFile" type="button">파일 선택…</button>' +
      '<button class="btn primary" id="mApply" type="button">교체하기</button></div></div>');
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mFile").onclick = function(){ document.getElementById("fileJson").click(); };
    document.getElementById("mApply").onclick = function(){
      try { var d = JSON.parse(document.getElementById("jsonIn").value); if(!Array.isArray(d)) throw new Error("루트가 배열이 아니에요"); replaceAll(d, "JSON"); closeModal(); }
      catch(err){ toast("불러오기 실패 — " + err.message); }
    };
  });
  document.getElementById("fileJson").addEventListener("change", function(ev){
    var f = ev.target.files[0]; if(!f) return;
    f.text().then(function(text){
      try { var d = JSON.parse(text); if(!Array.isArray(d)) throw new Error("루트가 배열이 아니에요"); replaceAll(d, "JSON"); closeModal(); }
      catch(err){ toast("불러오기 실패 — " + err.message); }
    });
    ev.target.value = "";
  });
  document.getElementById("btnExportExcel").addEventListener("click", function(){
    if(!window.XLSX){ toast("엑셀 라이브러리를 불러오지 못했어요 (네트워크 확인)"); return; }
    var wb = XLSX.utils.book_new(), mods = [], its = [];
    exportArray().forEach(function(m){
      mods.push({ moduleId:m.id, order:m.order, titleKo:m.titleKo, titleEn:m.titleEn, legalHours:m.legalHours, patientNameKo:m.patientNameKo, situationKo:m.situationKo, situationEn:m.situationEn, techNoteKo:m.techNoteKo });
      m.interactions.forEach(function(it){ its.push({ moduleId:m.id, interactionId:it.id, labelKo:it.labelKo, labelEn:it.labelEn, resultKo:it.resultKo, resultEn:it.resultEn }); });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mods), "Modules");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(its.length ? its : [{ moduleId:"", interactionId:"", labelKo:"", labelEn:"", resultKo:"", resultEn:"" }]), "Interactions");
    download("hancare-xr-modules.xlsx", new Blob([XLSX.write(wb, { bookType:"xlsx", type:"array" })], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  });
  document.getElementById("btnImportExcel").addEventListener("click", function(){ document.getElementById("fileExcel").click(); });
  document.getElementById("fileExcel").addEventListener("change", function(ev){
    var f = ev.target.files[0]; if(!f) return;
    if(!window.XLSX){ toast("엑셀 라이브러리를 불러오지 못했어요 (네트워크 확인)"); return; }
    f.arrayBuffer().then(function(buf){
      try{
        var wb = XLSX.read(buf, { type:"array" });
        if(!wb.Sheets.Modules) throw new Error("Modules 시트가 없어요 (엑셀로 내보내기 형식을 쓰세요)");
        var map = {}, arr = [];
        XLSX.utils.sheet_to_json(wb.Sheets.Modules, { defval:"" }).forEach(function(r){
          var id = String(r.moduleId || "").trim(); if(!id || map[id]) return;
          map[id] = { id:id, order:Number(r.order) || arr.length + 1, titleKo:String(r.titleKo), titleEn:String(r.titleEn), legalHours:Number(r.legalHours) || 0,
            patientNameKo:String(r.patientNameKo), situationKo:String(r.situationKo), situationEn:String(r.situationEn), techNoteKo:String(r.techNoteKo), interactions:[] };
          arr.push(map[id]);
        });
        if(wb.Sheets.Interactions) XLSX.utils.sheet_to_json(wb.Sheets.Interactions, { defval:"" }).forEach(function(r){
          var m = map[String(r.moduleId || "").trim()]; if(!m || !String(r.interactionId || "").trim()) return;
          m.interactions.push({ id:String(r.interactionId).trim(), labelKo:String(r.labelKo), labelEn:String(r.labelEn), resultKo:String(r.resultKo), resultEn:String(r.resultEn) });
        });
        openModal('<div class="modal"><h3>엑셀 불러오기</h3><p>모듈 ' + arr.length + '개로 지금 모듈 전체를 교체합니다. 계속할까요?</p><div class="modal-actions">' +
          '<button class="btn" id="mCancel" type="button">취소</button><button class="btn primary" id="mOk" type="button">교체하기</button></div></div>');
        document.getElementById("mCancel").onclick = closeModal;
        document.getElementById("mOk").onclick = function(){ closeModal(); try { replaceAll(arr, "엑셀"); } catch(err){ toast("불러오기 실패 — " + err.message); } };
      } catch(err){ toast("엑셀 불러오기 실패 — " + err.message); }
    });
    ev.target.value = "";
  });

  /* ---------- 시작 ---------- */
  function start(){
    if(!backend){ renderAll(); setStatus("offline", "로컬 전용 모드 — JSON을 불러와 편집하고 내보내기로 저장하세요"); return; }
    backend.get().then(function(data){
      modules = normalize(data);
      current = modules[0] || null;
      renderAll();
      setStatus("saved", "연결됨 · 자동 저장 켜짐");
    }).catch(function(err){
      backend = null; renderAll();
      setStatus("offline", "서버 연결 실패 — 로컬 전용 모드 (" + err.message + ")");
    });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</body>
</html>
