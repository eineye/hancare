<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실습 한국어 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3F6F4;
    --surface:#FFFFFF;
    --surface-2:#EAF0EC;
    --surface-3:#DEE8E2;
    --ink:#16211E;
    --ink-muted:#5C6B66;
    --ink-faint:#8B9B95;
    --border:#D7E2DD;
    --border-strong:#B9CBC3;
    --accent:#276F5F;
    --accent-strong:#1D5648;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1EEE8;
    --coral:#C85B36;
    --coral-soft:#F7E4DA;
    --danger:#B23B24;
    --danger-soft:#F6DFD9;
    --success:#2E8B5C;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,32,28,0.06);
    --shadow-md:0 8px 24px rgba(20,32,28,0.10);
    --font-display:'Gowun Batang', ui-serif, Georgia, serif;
    --font-body:'Noto Sans KR', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815;
      --surface:#17211D;
      --surface-2:#1D2924;
      --surface-3:#28342E;
      --ink:#E7EFEC;
      --ink-muted:#9DB0A9;
      --ink-faint:#6E8079;
      --border:#2B3A34;
      --border-strong:#3A4C44;
      --accent:#55B999;
      --accent-strong:#7BD1B3;
      --accent-ink:#0B1613;
      --accent-soft:#1E3931;
      --coral:#E88A61;
      --coral-soft:#3A2A20;
      --danger:#E58165;
      --danger-soft:#3E2620;
      --success:#59BE8B;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815;
    --surface:#17211D;
    --surface-2:#1D2924;
    --surface-3:#28342E;
    --ink:#E7EFEC;
    --ink-muted:#9DB0A9;
    --ink-faint:#6E8079;
    --border:#2B3A34;
    --border-strong:#3A4C44;
    --accent:#55B999;
    --accent-strong:#7BD1B3;
    --accent-ink:#0B1613;
    --accent-soft:#1E3931;
    --coral:#E88A61;
    --coral-soft:#3A2A20;
    --danger:#E58165;
    --danger-soft:#3E2620;
    --success:#59BE8B;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    padding-inline:16px;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}
  input,textarea,select,button{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- layout shell ---------- */
  #app{max-width:1400px; margin:0 auto; padding-block:18px 40px;}

  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .brand h1{font-size:22px; font-weight:700; color:var(--ink);}
  .brand .sub{color:var(--ink-muted); font-size:12.5px;}
  .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .stat{display:flex; flex-direction:column; gap:0;}
  .stat b{font-size:15px; color:var(--accent-strong); font-weight:700;}
  .stat span{font-size:11px; color:var(--ink-faint); letter-spacing:.02em;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .toolbar-group{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:5px; box-shadow:var(--shadow-sm);}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:var(--radius-sm); padding:7px 11px; font-size:12.5px; font-weight:500;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger);}
  .btn.small{padding:4px 8px; font-size:11.5px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--surface); border-color:var(--border);}

  .status-line{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .status-line.saving .status-dot{background:var(--coral); animation:pulse 1s infinite;}
  .status-line.saved .status-dot{background:var(--success);}
  .status-line.offline .status-dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--coral-soft); border:1px solid var(--coral); color:var(--ink);
    border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; margin-bottom:14px;
  }
  .banner b{color:var(--coral);}
  .banner .btn{flex:none;}

  .grid{
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 320px;
    gap:14px;
    align-items:start;
  }
  @media (max-width:1100px){
    .grid{grid-template-columns:220px minmax(0,1fr);}
    #preview{grid-column:1 / -1;}
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
    #sidebar{order:1;}
    #editor{order:2;}
    #preview{grid-column:auto; order:3;}
    #sidebar .tree{max-height:none; overflow:visible; display:flex; flex-direction:column; gap:8px;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:.01em;}
  .panel-body{padding:12px;}

  /* ---------- sidebar tree ---------- */
  #sidebar{position:sticky; top:12px;}
  .tree{max-height:74vh; overflow-y:auto; padding:8px;}
  .unit-block{margin-bottom:6px; border-radius:var(--radius-md); overflow:hidden;}
  .unit-row{
    display:flex; align-items:center; gap:6px; padding:8px 8px; border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .unit-row:hover{background:var(--surface-2);}
  .unit-row.active{background:var(--accent-soft);}
  .unit-row .chevron{font-size:10px; color:var(--ink-faint); width:10px; flex:none;}
  .unit-row .label{flex:1; min-width:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .unit-row .count{font-size:10.5px; color:var(--ink-faint); flex:none;}
  .row-actions{display:none; gap:2px; flex:none;}
  .unit-row:hover .row-actions, .situation-row:hover .row-actions{display:flex;}
  .icon-btn{border:none; background:transparent; color:var(--ink-faint); border-radius:5px; padding:2px 4px; font-size:11px; line-height:1;}
  .icon-btn:hover{background:var(--surface-3); color:var(--ink);}

  .situation-list{padding-left:16px; display:flex; flex-direction:column; gap:1px;}
  .situation-row{
    display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:var(--radius-sm);
    cursor:pointer; font-size:12.5px;
  }
  .situation-row:hover{background:var(--surface-2);}
  .situation-row.active{background:var(--accent); color:var(--accent-ink);}
  .situation-row.active .icon-btn{color:var(--accent-ink);}
  .situation-row .label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .situation-row .dupe{color:var(--danger); font-weight:700;}

  .sidebar-foot{padding:8px; border-top:1px solid var(--border);}

  /* ---------- editor ---------- */
  #editor .panel-body{display:flex; flex-direction:column; gap:16px;}
  .empty-state{padding:48px 20px; text-align:center; color:var(--ink-muted);}
  .empty-state .big{font-size:34px; margin-bottom:6px;}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .field-grid.full{grid-template-columns:1fr;}
  @media (max-width:560px){.field-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field label{font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between; gap:6px;}
  .field label .tag{font-weight:400; color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;}
  .field input, .field textarea{
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px;
    background:var(--surface); color:var(--ink); width:100%; resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field input.mono, .field.mono input{font-family:var(--font-mono); font-size:12px;}
  .field input.dupe{border-color:var(--danger); background:var(--danger-soft);}

  .section-title{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px;}
  .section-title h3{font-size:13px; font-weight:700; color:var(--ink);}
  .section-title .count{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}

  .grid-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .grid-table th{
    text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em;
    padding:0 8px 6px; border-bottom:1px solid var(--border);
  }
  .grid-table td{padding:4px; vertical-align:top; border-bottom:1px solid var(--border);}
  .grid-table tr:last-child td{border-bottom:none;}
  .grid-table input{
    width:100%; border:1px solid transparent; border-radius:6px; padding:6px 7px;
    background:var(--surface-2); color:var(--ink);
  }
  .grid-table input:focus{background:var(--surface); border-color:var(--accent);}
  .grid-table input.mono{font-family:var(--font-mono); font-size:11px;}
  .grid-table input.dupe{border-color:var(--danger); background:var(--danger-soft);}
  .grid-table .col-actions{white-space:nowrap; width:1%;}
  .table-scroll{overflow-x:auto; border-radius:var(--radius-md);}
  .row-add{margin-top:8px;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:4px 10px; font-size:11.5px; color:var(--ink-muted);
  }

  /* ---------- preview ---------- */
  #preview{position:sticky; top:12px;}
  .preview-card{padding:16px; display:flex; flex-direction:column; gap:12px;}
  .preview-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag-pill{background:var(--accent-soft); color:var(--accent-strong); border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:600;}
  .tag-pill.coral{background:var(--coral-soft); color:var(--coral);}
  .preview-title{font-family:var(--font-display); font-size:18px; line-height:1.4; color:var(--ink);}
  .preview-title .en{display:block; font-family:var(--font-body); font-size:12px; color:var(--ink-muted); font-style:italic; margin-top:2px;}
  .preview-desc{font-size:12.5px; color:var(--ink-muted); background:var(--surface-2); border-radius:var(--radius-sm); padding:10px;}
  .preview-sub{font-size:11px; font-weight:700; color:var(--ink-faint); letter-spacing:.03em; margin-bottom:6px;}
  .preview-terms{display:flex; flex-wrap:wrap; gap:6px;}
  .term-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:11.5px;}
  .term-chip .h{font-weight:700; color:var(--ink);}
  .term-chip .r{color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;}
  .term-chip .g{color:var(--ink-muted); display:block; margin-top:1px;}
  .sentence-item{border-top:1px solid var(--border); padding-top:8px; margin-top:2px;}
  .sentence-item:first-child{border-top:none; padding-top:0; margin-top:0;}
  .sentence-item .ko{font-weight:600; color:var(--ink); font-size:13.5px;}
  .sentence-item .rm{color:var(--ink-faint); font-family:var(--font-mono); font-size:10.5px; margin-top:1px;}
  .sentence-item .en{color:var(--ink-muted); font-size:12px; margin-top:2px;}

  /* ---------- modal / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(10,16,14,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); max-width:560px; width:100%; padding:18px; max-height:85vh; overflow:auto;}
  .modal h3{font-size:15px; margin-bottom:8px;}
  .modal p{font-size:12.5px; color:var(--ink-muted); margin:0 0 10px;}
  .modal p b{color:var(--ink);}
  .modal textarea{width:100%; min-height:160px; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2); color:var(--ink);}
  .modal pre{white-space:pre; overflow-x:auto; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11px; line-height:1.6; margin:0 0 12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
    font-size:12.5px; box-shadow:var(--shadow-md); z-index:60; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  [hidden]{display:none !important;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

  /* ---------- read-only mode ---------- */
  body.ro #editorBody input, body.ro #editorBody textarea{pointer-events:none; background:var(--surface-2);}
  body.ro .row-actions{display:none !important;}
  body.ro .sidebar-foot{display:none;}
  body.ro #btnAddUnit, body.ro #btnAddUnit2, body.ro #btnImportJson, body.ro #btnImportExcel,
  body.ro [data-add-term], body.ro [data-add-sentence], body.ro #editorHeadActions{display:none !important;}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <h1>실습 한국어 스튜디오</h1>
      <div class="sub">간호조무 실습 한국어 라이브러리 편집 · 엑셀/JSON 자동 변환</div>
      <div class="stats" id="statsRow"></div>
      <div class="status-line" id="statusLine"><span class="status-dot"></span><span id="statusText">불러오는 중…</span></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn" id="btnImportJson" type="button">JSON 불러오기</button>
        <button class="btn" id="btnImportExcel" type="button">엑셀 불러오기</button>
      </div>
      <div class="toolbar-group">
        <button class="btn" id="btnExportJson" type="button">JSON 내보내기</button>
        <button class="btn" id="btnExportExcel" type="button">엑셀로 내보내기</button>
        <button class="btn" id="btnTemplate" type="button">엑셀 템플릿</button>
      </div>
      <div class="toolbar-group">
        <button class="btn" id="btnCopyJson" type="button">JSON 복사</button>
        <button class="btn" id="btnIntegrationGuide" type="button">연결 안내</button>
      </div>
      <div class="toolbar-group">
        <button class="btn primary" id="btnAddUnit" type="button">+ 새 유닛</button>
      </div>
    </div>
  </header>

  <div id="banners"></div>

  <div class="grid">
    <div class="panel" id="sidebar">
      <div class="panel-head"><h2>유닛 · 상황</h2></div>
      <div class="tree" id="tree"></div>
      <div class="sidebar-foot">
        <button class="btn small" id="btnAddUnit2" type="button" style="width:100%;justify-content:center;">+ 새 유닛 추가</button>
      </div>
    </div>

    <div class="panel" id="editor">
      <div class="panel-head">
        <h2 id="editorTitle">편집</h2>
        <div id="editorHeadActions" style="display:flex;gap:6px;"></div>
      </div>
      <div class="panel-body" id="editorBody"></div>
    </div>

    <div class="panel" id="preview">
      <div class="panel-head"><h2>미리보기</h2></div>
      <div class="panel-body" id="previewBody"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" class="visually-hidden">
<input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" class="visually-hidden">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // 한글케어 연결
  // - ?host=hangulcare: 단일 파일판 hangulcare.html 안(iframe)에서 열린 경우. 부모 창과
  //   postMessage로 유닛을 주고받고, 부모가 브라우저 저장소에 보관해 학습 화면에 반영한다.
  //   (file://로 열어도 동작하도록 부모 창 객체에 직접 접근하지 않는다.)
  // - 그 밖에 서버에서 열린 경우: Next.js 서버(/api/hangul-library → content/*.json)에 자동 저장.
  // - 파일만 따로 열었을 때(file://)는 서버가 없으므로 로컬 전용 모드로 동작한다.
  (function () {
    if (window.HANCARE_STUDIO_CONFIG) return;
    if (/[?&]host=hangulcare\b/.test(location.search) && window.parent !== window) {
      var seq = 0, pending = {};
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (e.source !== window.parent || !d || d.hcLib !== "res" || !pending[d.id]) return;
        var p = pending[d.id]; delete pending[d.id];
        if (d.ok) p.resolve(d.data); else p.reject(new Error(d.error || "저장 실패"));
      });
      var call = function (op, payload) {
        return new Promise(function (resolve, reject) {
          var id = ++seq;
          pending[id] = { resolve: resolve, reject: reject };
          window.parent.postMessage({ hcLib: "req", id: id, op: op, payload: payload }, "*");
        });
      };
      window.HANCARE_STUDIO_CONFIG = {
        api: {
          adapter: {
            listUnits: function () { return call("list"); },
            saveUnit: function (unit) { return call("save", unit); },
            deleteUnit: function (id) { return call("delete", id); }
          }
        },
        readOnly: false
      };
    } else if (location.protocol !== "file:") {
      window.HANCARE_STUDIO_CONFIG = { api: { baseUrl: "/api/hangul-library" }, readOnly: false };
    }
  })();
</script>
<script>
/* ==================================================================
   실습 한국어 스튜디오 — 한글 학습 라이브러리 편집기
   (간호조무 실습 한국어 앱의 practice-hangul.json 데이터 전용 편집기)

   그대로 열면 "로컬 전용 모드"로 즉시 동작합니다 (자동 저장 없이
   JSON/엑셀 내보내기로 보관). 관리자 페이지 백엔드에 연결하려면
   이 편집기의 script 태그가 실행되기 전에, 별도의 script 블록에서
   아래처럼 설정하세요:

  var CHO = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];

  function romanizeSyllable(ch){
    var code = ch.codePointAt(0);
    if(code < 0xAC00 || code > 0xD7A3) return null;
    var sIndex = code - 0xAC00;
    var cho = Math.floor(sIndex / (21*28));

      var pieces = [];
      Array.from(word).forEach(function(ch){
        var r = romanizeSyllable(ch);
        if(r !== null) pieces.push(r);
        else if(/[a-z0-9]/i.test(ch)) pieces.push(ch.toLowerCase());
      });
      return pieces.join("-");
    }).filter(Boolean);
    return out.join(" ");

  function buildApi(cfg){
    // 한글케어 단일 파일판(hangulcare.html)처럼 REST 서버 없이 붙이는 경우,
    // listUnits/saveUnit/deleteUnit(Promise 반환)을 가진 어댑터를 그대로 쓴다.
    if(cfg.adapter) return cfg.adapter;
    var baseUrl = String(cfg.baseUrl || "").replace(/\/+$/,"");
    function withHeaders(init){
      init = init || {};
      var p = cfg.headers ? Promise.resolve(cfg.headers()) : Promise.resolve({});
      return p.then(function(h){
        init.headers = Object.assign({ "Content-Type":"application/json" }, h || {}, init.headers || {});
        return init;
      });
    }
    return {
      listUnits: function(){
        return withHeaders({ method:"GET" }).then(function(init){ return fetch(baseUrl + "/units", init); })
          .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
      },
      saveUnit: function(unit){
        return withHeaders({ method:"PUT", body: JSON.stringify(unit) }).then(function(init){ return fetch(baseUrl + "/units/" + encodeURIComponent(unit.id), init); })
          .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); });
      },
      deleteUnit: function(id){
        return withHeaders({ method:"DELETE" }).then(function(init){ return fetch(baseUrl + "/units/" + encodeURIComponent(id), init); })
          .then(function(r){ if(!r.ok && r.status !== 404) throw new Error("HTTP " + r.status); });
      }
    };
  }

  function fieldHtml(opts){
    var tagAttr = opts.dupe ? " dupe" : "";
    var common = 'data-field="'+esc(opts.key)+'" data-scope="'+opts.scope+'"' + (opts.mono?' class="mono'+tagAttr+'"':(tagAttr?' class="'+tagAttr.trim()+'"':""));
    var input = opts.textarea
      ? '<textarea rows="'+(opts.rows||2)+'" '+common+'>'+esc(opts.value)+'</textarea>'
      : '<input type="text" value="'+esc(opts.value)+'" '+common+(opts.list?' list="'+opts.list+'"':'')+'>';
    return '<div class="field"><label>'+esc(opts.label)+(opts.tag?'<span class="tag">'+esc(opts.tag)+'</span>':'')+'</label>'+input+'</div>';
  }
  function collectDistinctValues(field){
    var set = new Set();
    units.forEach(function(u){ u.situations.forEach(function(s){ if(s[field]) set.add(s[field]); }); });
    return Array.from(set);
  }

  /* ============================================================
     6. Mutations (all guarded against read-only mode)
     ============================================================ */
  function addUnit(){
    if(readOnly) return;
    var id = uniqueId("unit-" + (units.length+1), allIds("unit"));
    var order = units.reduce(function(m,u){ return Math.max(m,u.order); }, -1) + 1;
    var u = { id:id, order:order, category:"practice", titleKo:"새 유닛", titleEn:"New unit", situations:[] };
    units.push(u);
    activeUnitId = id; activeSituationId = null; expanded[id] = true;
    persistUnit(id);
    renderAll();
    toast("새 유닛을 추가했어요");
  }
  function deleteUnit(id){
    if(readOnly) return;
    units = units.filter(function(u){ return u.id !== id; });
    if(activeUnitId === id){ activeUnitId = units[0] ? units[0].id : null; activeSituationId = null; }
    persistDeleteUnit(id);
    renderAll();
    toast("유닛을 삭제했어요");
  }
  function addSituation(unitId){
    if(readOnly) return;
    var u = getUnit(unitId); if(!u) return;
    var n = allIds("situation").size + 1;
    var id = uniqueId("situation-" + n, allIds("situation"));
    var s = { id:id, menuLabelKo:"새 상황", menuLabelEn:"New situation", titleKo:"", titleEn:"", descriptionKo:"", descriptionEn:"", placeTag:"", formalityTag:"", difficultyTag:"", terms:[], sentences:[] };
    u.situations.push(s);
    activeUnitId = unitId; activeSituationId = id; expanded[unitId] = true;
    persistUnit(unitId);
    renderAll();
    toast("새 상황을 추가했어요");
  }
  function deleteSituation(unitId, situationId){
    if(readOnly) return;
    var u = getUnit(unitId); if(!u) return;
    u.situations = u.situations.filter(function(s){ return s.id !== situationId; });
    if(activeSituationId === situationId) activeSituationId = null;
    persistUnit(unitId);
    renderAll();
    toast("상황을 삭제했어요");
  }
  function moveSituation(unitId, situationId, dir){
    if(readOnly) return;
    var u = getUnit(unitId); if(!u) return;
    var i = u.situations.findIndex(function(s){ return s.id === situationId; });
    var j = dir === "up" ? i-1 : i+1;
    if(j<0 || j>=u.situations.length) return;
    var tmp = u.situations[i]; u.situations[i]=u.situations[j]; u.situations[j]=tmp;
    persistUnit(unitId); renderAll();
  }
  function addTerm(situationId){
    if(readOnly) return;
    var ctx = findSituation(situationId); if(!ctx) return;
    var id = uniqueId("term-" + (allIds("term").size+1), allIds("term"));
    ctx.situation.terms = ctx.situation.terms || [];
    ctx.situation.terms.push({ id:id, hangul:"", romanization:"", glossEn:"" });
    persistUnit(ctx.unit.id); renderAll();
  }
  function addSentence(situationId){
    if(readOnly) return;
    var ctx = findSituation(situationId); if(!ctx) return;
    var num = (ctx.situation.id.match(/(\d+)$/) || [null, String(ctx.unit.situations.indexOf(ctx.situation)+1)])[1];
    ctx.situation.sentences = ctx.situation.sentences || [];
    var id = uniqueId("sentence-" + num + "-" + (ctx.situation.sentences.length+1), allIds("sentence"));
    ctx.situation.sentences.push({ id:id, textKo:"", textEn:"", romanization:"", syllables:[] });
    persistUnit(ctx.unit.id); renderAll();
  }
  function deleteRow(situationId, kind, rowId){
    if(readOnly) return;
    var ctx = findSituation(situationId); if(!ctx) return;
    var key = kind === "term" ? "terms" : "sentences";
    ctx.situation[key] = (ctx.situation[key]||[]).filter(function(r){ return r.id !== rowId; });
    persistUnit(ctx.unit.id); renderAll();
  }
  function moveRow(situationId, kind, rowId, dir){
    if(readOnly) return;
    var ctx = findSituation(situationId); if(!ctx) return;
    var key = kind === "term" ? "terms" : "sentences";
    var list = ctx.situation[key] || [];
    var i = list.findIndex(function(r){ return r.id === rowId; });
    var j = dir === "up" ? i-1 : i+1;
    if(j<0 || j>=list.length) return;
    var tmp = list[i]; list[i]=list[j]; list[j]=tmp;
    persistUnit(ctx.unit.id); renderAll();
  }

  /* ============================================================
     7. Event delegation
     ============================================================ */
  document.addEventListener("click", function(e){
    var t = e.target;
    var sel;

    if((sel = t.closest("[data-select-unit]")) && !t.closest("[data-toggle-unit]")){
      activeUnitId = sel.getAttribute("data-select-unit"); activeSituationId = null; renderAll(); return;
    }
    if((sel = t.closest("[data-toggle-unit]"))){
      var uid = sel.getAttribute("data-toggle-unit"); expanded[uid] = !expanded[uid]; renderTree(); return;
    }
    if((sel = t.closest("[data-select-situation]"))){
      activeUnitId = sel.getAttribute("data-parent-unit"); activeSituationId = sel.getAttribute("data-select-situation"); renderAll(); return;
    }
    if((sel = t.closest("[data-add-situation]"))){ addSituation(sel.getAttribute("data-add-situation")); return; }
    if((sel = t.closest("[data-del-unit]"))){
      var duid = sel.getAttribute("data-del-unit");
      confirmModal("유닛 삭제", "이 유닛과 그 안의 모든 상황·어휘·문장이 삭제됩니다. 계속할까요?", "삭제", function(){ deleteUnit(duid); });
      return;
    }
    if((sel = t.closest("[data-del-situation]"))){
      var dsUnit = sel.getAttribute("data-unit-id"), dsSit = sel.getAttribute("data-situation-id");
      confirmModal("상황 삭제", "이 상황의 어휘·문장이 모두 삭제됩니다. 계속할까요?", "삭제", function(){ deleteSituation(dsUnit, dsSit); });
      return;
    }
    if((sel = t.closest("[data-move-situation]"))){
      moveSituation(sel.getAttribute("data-unit-id"), sel.getAttribute("data-situation-id"), sel.getAttribute("data-move-situation"));
      return;
    }
    if(t.id === "btnAddUnit" || t.id === "btnAddUnit2"){ addUnit(); return; }
    if(t.closest("[data-add-term]")){ if(activeSituationId) addTerm(activeSituationId); return; }
    if(t.closest("[data-add-sentence]")){ if(activeSituationId) addSentence(activeSituationId); return; }

    if((sel = t.closest("[data-del-row]"))){
      var rowEl = sel.closest("[data-row]");
      confirmModal("행 삭제", "이 항목을 삭제할까요?", "삭제", function(){
        deleteRow(activeSituationId, rowEl.getAttribute("data-row"), rowEl.getAttribute("data-row-id"));
      });
      return;
    }
    if((sel = t.closest("[data-move-row]"))){
      var rowEl2 = sel.closest("[data-row]");
      moveRow(activeSituationId, rowEl2.getAttribute("data-row"), rowEl2.getAttribute("data-row-id"), sel.getAttribute("data-move-row"));
      return;
    }
    if((sel = t.closest("[data-auto-term-roman]"))){
      if(readOnly) return;
      var rowEl3 = sel.closest("[data-row]");
      var ctx3 = findSituation(activeSituationId);
      var term = (ctx3.situation.terms||[]).find(function(x){ return x.id === rowEl3.getAttribute("data-row-id"); });
      term.romanization = romanizeText(term.hangul);
      persistUnit(ctx3.unit.id); renderEditor(); renderPreview();
      return;
    }
    if((sel = t.closest("[data-auto-sentence]"))){
      if(readOnly) return;
      var rowEl4 = sel.closest("[data-row]");
      var ctx4 = findSituation(activeSituationId);
      var sen = (ctx4.situation.sentences||[]).find(function(x){ return x.id === rowEl4.getAttribute("data-row-id"); });
      sen.romanization = romanizeText(sen.textKo);
      sen.syllables = extractSyllables(sen.textKo);
      persistUnit(ctx4.unit.id); renderEditor(); renderPreview();
      return;
    }
  });

  document.addEventListener("input", function(e){
    if(readOnly) return;
    var t = e.target;
    var scope = t.getAttribute && t.getAttribute("data-scope");
    if(!scope) return;
    var key = t.getAttribute("data-field");
    var value = t.value;

    if(scope === "unit"){
      var u = getUnit(activeUnitId); if(!u) return;
      if(key === "id"){ u.__pendingId = value; return; }
      u[key] = value;
      persistUnit(u.id);
      if(key === "titleKo"){ renderTree(); renderPreview(); }
    } else if(scope === "situation"){
      var ctx = findSituation(activeSituationId); if(!ctx) return;
      if(key === "id"){ ctx.situation.__pendingId = value; return; }
      ctx.situation[key] = value;
      persistUnit(ctx.unit.id);
      if(key === "menuLabelKo" || key==="titleKo") renderTree();
      renderPreview();
    } else if(scope === "term" || scope === "sentence"){
      var rowEl = t.closest("[data-row]");
      var ctx2 = findSituation(activeSituationId); if(!ctx2) return;
      var listKey = scope === "term" ? "terms" : "sentences";
      var row = (ctx2.situation[listKey]||[]).find(function(r){ return r.id === rowEl.getAttribute("data-row-id"); });
      if(!row) return;
      if(key === "syllables"){
        row.syllables = value.split(",").map(function(v){ return v.trim(); }).filter(Boolean);
      } else if(key === "id"){
        row.__pendingId = value;
      } else {
        row[key] = value;
      }
      persistUnit(ctx2.unit.id);
      renderPreview();
    }
  });

  document.addEventListener("blur", function(e){
    if(readOnly) return;
    var t = e.target;
    var key = t.getAttribute && t.getAttribute("data-field");
    if(key !== "id") return;
    var scope = t.getAttribute("data-scope");
    if(scope === "unit"){
      var u = getUnit(activeUnitId); if(!u || u.__pendingId === undefined) return;
      var newId = u.__pendingId.trim() || u.id;
      if(newId !== u.id && !allIds("unit").has(newId)){ persistDeleteUnit(u.id); u.id = newId; activeUnitId = newId; }
      delete u.__pendingId;
      persistUnit(u.id); renderAll();
    } else if(scope === "situation"){
      var ctx = findSituation(activeSituationId); if(!ctx || ctx.situation.__pendingId === undefined) return;
      var s = ctx.situation;
      var newId2 = s.__pendingId.trim() || s.id;
      if(newId2 !== s.id && !allIds("situation").has(newId2)){ s.id = newId2; activeSituationId = newId2; }
      delete s.__pendingId;
      persistUnit(ctx.unit.id); renderAll();
    } else if(scope === "term" || scope === "sentence"){
      var rowEl = t.closest("[data-row]");
      var ctx2 = findSituation(activeSituationId); if(!ctx2) return;
      var listKey = scope === "term" ? "terms" : "sentences";
      var actualRow = (ctx2.situation[listKey]||[]).find(function(r){ return r.id === rowEl.getAttribute("data-row-id"); });
      if(actualRow && actualRow.__pendingId !== undefined){
        var newId3 = actualRow.__pendingId.trim() || actualRow.id;
        var poolKind = scope === "term" ? "term" : "sentence";
        if(newId3 !== actualRow.id && !allIds(poolKind).has(newId3)) actualRow.id = newId3;
        delete actualRow.__pendingId;
        persistUnit(ctx2.unit.id); renderAll();
      }
    }
  }, true);

  /* ============================================================
     8. Import / Export
     ============================================================ */
  function orderedUnitOut(u){
    return {
      id: u.id, category: u.category, titleKo: u.titleKo, titleEn: u.titleEn,
      situations: u.situations.map(function(s){
        return {
          id: s.id, menuLabelKo: s.menuLabelKo, menuLabelEn: s.menuLabelEn,
          titleKo: s.titleKo, titleEn: s.titleEn,
          descriptionKo: s.descriptionKo, descriptionEn: s.descriptionEn,
          placeTag: s.placeTag, formalityTag: s.formalityTag, difficultyTag: s.difficultyTag,
          terms: (s.terms||[]).map(function(t){ return { id:t.id, hangul:t.hangul, romanization:t.romanization, glossEn:t.glossEn }; }),
          sentences: (s.sentences||[]).map(function(x){ return { id:x.id, textKo:x.textKo, textEn:x.textEn, romanization:x.romanization, syllables:x.syllables||[] }; })
        };
      })
    };
  }
  function buildExportArray(){
    return units.slice().sort(function(a,b){ return a.order-b.order; }).map(orderedUnitOut);
  }

  function triggerDownload(filename, data, mime){
    var blob = data instanceof Blob ? data : new Blob([data], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function doExportJson(){
    triggerDownload("practice-hangul.json", JSON.stringify(buildExportArray(), null, 2), "application/json");
    toast("JSON 파일을 다운로드했어요");
  }
  function copyJsonToClipboard(){
    var json = JSON.stringify(buildExportArray(), null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){ toast("JSON을 클립보드에 복사했어요"); }, function(){ toast("복사에 실패했어요"); });
    } else {
      toast("이 브라우저에서는 클립보드 복사를 지원하지 않아요");
    }
  }

  function sheetRows(){
    var unitsRows = [], sitRows = [], termRows = [], sentRows = [];
    units.slice().sort(function(a,b){return a.order-b.order;}).forEach(function(u){
      unitsRows.push({ unitId:u.id, category:u.category, titleKo:u.titleKo, titleEn:u.titleEn });
      u.situations.forEach(function(s){
        sitRows.push({ situationId:s.id, unitId:u.id, menuLabelKo:s.menuLabelKo, menuLabelEn:s.menuLabelEn, titleKo:s.titleKo, titleEn:s.titleEn, descriptionKo:s.descriptionKo, descriptionEn:s.descriptionEn, placeTag:s.placeTag, formalityTag:s.formalityTag, difficultyTag:s.difficultyTag });
        (s.terms||[]).forEach(function(t){ termRows.push({ termId:t.id, situationId:s.id, hangul:t.hangul, romanization:t.romanization, glossEn:t.glossEn }); });
        (s.sentences||[]).forEach(function(x){ sentRows.push({ sentenceId:x.id, situationId:s.id, textKo:x.textKo, textEn:x.textEn, romanization:x.romanization, syllables:(x.syllables||[]).join(", ") }); });
      });
    });
    return { unitsRows:unitsRows, sitRows:sitRows, termRows:termRows, sentRows:sentRows };
  }
  function workbookFromRows(rows){
    if(typeof XLSX === "undefined"){ toast("엑셀 라이브러리를 불러오지 못했어요 (네트워크를 확인하세요)"); return null; }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.unitsRows), "Units");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.sitRows), "Situations");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.termRows), "Terms");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.sentRows), "Sentences");
    return wb;
  }
  function doExportExcel(){
    var wb = workbookFromRows(sheetRows());
    if(!wb) return;
    var out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    triggerDownload("practice-hangul.xlsx", new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    toast("엑셀 파일을 다운로드했어요");
  }
  function doDownloadTemplate(){
    var rows = {
      unitsRows:[{ unitId:"unit-1", category:"practice", titleKo:"유닛 제목", titleEn:"Unit title" }],
      sitRows:[{ situationId:"situation-1", unitId:"unit-1", menuLabelKo:"메뉴 라벨", menuLabelEn:"Menu label", titleKo:"상황 제목", titleEn:"Situation title", descriptionKo:"설명", descriptionEn:"Description", placeTag:"병실 · Patient room", formalityTag:"존댓말 · Polite form", difficultyTag:"난이도 초급 1" }],
      termRows:[{ termId:"term-example", situationId:"situation-1", hangul:"예시", romanization:"ye-si", glossEn:"example" }],
      sentRows:[{ sentenceId:"sentence-1-1", situationId:"situation-1", textKo:"예시 문장입니다.", textEn:"This is an example sentence.", romanization:"ye-si mun-jang-im-ni-da", syllables:"" }]
    };
    var wb = workbookFromRows(rows);
    if(!wb) return;
    var out = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    triggerDownload("hangul-library-template.xlsx", new Blob([out], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    toast("템플릿을 다운로드했어요 — 로마자/음절은 비워두면 자동 채워집니다");
  }

  function rowsToUnits(unitsRows, sitRows, termRows, sentRows){
    var unitMap = {}, order = 0;
    unitsRows.forEach(function(r){
      if(!r.unitId) return;
      unitMap[r.unitId] = { id:String(r.unitId), order:order++, category:r.category||"practice", titleKo:r.titleKo||"", titleEn:r.titleEn||"", situations:[] };
    });
    var sitMap = {};
    sitRows.forEach(function(r){
      if(!r.situationId) return;
      var parent = unitMap[r.unitId];
      if(!parent){ parent = unitMap[r.unitId] = { id:String(r.unitId||"unit-x"), order:order++, category:"practice", titleKo:r.unitId||"", titleEn:"", situations:[] }; }
      var s = { id:String(r.situationId), menuLabelKo:r.menuLabelKo||"", menuLabelEn:r.menuLabelEn||"", titleKo:r.titleKo||"", titleEn:r.titleEn||"", descriptionKo:r.descriptionKo||"", descriptionEn:r.descriptionEn||"", placeTag:r.placeTag||"", formalityTag:r.formalityTag||"", difficultyTag:r.difficultyTag||"", terms:[], sentences:[] };
      parent.situations.push(s);
      sitMap[s.id] = s;
    });
    termRows.forEach(function(r){
      if(!r.termId || !sitMap[r.situationId]) return;
      sitMap[r.situationId].terms.push({ id:String(r.termId), hangul:r.hangul||"", romanization: r.romanization || romanizeText(r.hangul||""), glossEn:r.glossEn||"" });
    });
    sentRows.forEach(function(r){
      if(!r.sentenceId || !sitMap[r.situationId]) return;
      var syl = r.syllables ? String(r.syllables).split(",").map(function(x){return x.trim();}).filter(Boolean) : extractSyllables(r.textKo||"");
      sitMap[r.situationId].sentences.push({ id:String(r.sentenceId), textKo:r.textKo||"", textEn:r.textEn||"", romanization: r.romanization || romanizeText(r.textKo||""), syllables:syl });
    });
    return Object.keys(unitMap).map(function(k){ return unitMap[k]; });
  }

  function replaceLibrary(newUnits, sourceLabel){
    if(readOnly) return;
    units = newUnits;
    activeUnitId = units[0] ? units[0].id : null;
    activeSituationId = null;
    expanded = {}; units.forEach(function(u){ expanded[u.id] = true; });
    units.forEach(function(u){ persistUnitImmediate(u); });
    if(API){
      API.listUnits().then(function(data){
        var arr = Array.isArray(data) ? data : (data && data.units) || [];
        var keep = new Set(units.map(function(u){ return u.id; }));
        arr.forEach(function(u){ if(u && u.id && !keep.has(u.id)) API.deleteUnit(u.id).catch(function(){}); });
      }).catch(function(){});
    }
    renderAll();
    toast(sourceLabel + " 불러오기를 완료했어요");
  }
  function confirmReplace(newUnits, label){
    confirmModal("라이브러리 교체", "지금 편집 중인 라이브러리를 새 데이터로 완전히 교체합니다. 계속할까요?", "교체하기", function(){ replaceLibrary(newUnits, label); }, "primary");
  }

  document.getElementById("btnImportJson").addEventListener("click", function(){
    if(readOnly) return;
    openModal(
      '<div class="modal"><h3>JSON 불러오기</h3><p>기존 practice-hangul.json 형식의 배열을 붙여넣거나 파일을 선택하세요.</p>' +
      '<textarea id="jsonIn" placeholder="[ { &quot;id&quot;: &quot;unit-1&quot;, ... } ]"></textarea>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-modal-cancel type="button">취소</button>' +
        '<button class="btn" id="btnPickJsonFile" type="button">파일 선택…</button>' +
        '<button class="btn primary" id="btnApplyJson" type="button">불러오기</button>' +
      '</div></div>'
    );
    document.querySelector("[data-modal-cancel]").onclick = closeModal;
    document.getElementById("overlayEl").onclick = function(e){ if(e.target.id === "overlayEl") closeModal(); };
    document.getElementById("btnPickJsonFile").onclick = function(){ document.getElementById("fileJson").click(); };
    document.getElementById("btnApplyJson").onclick = function(){ applyJsonText(document.getElementById("jsonIn").value.trim()); };
  });
  function applyJsonText(text){
    try{
      var data = JSON.parse(text);
      if(!Array.isArray(data)) throw new Error("루트가 배열이 아니에요");
      var normalized = normalizeUnitsArray(data);
      closeModal();
      confirmReplace(normalized, "JSON");
    }catch(err){
      toast("JSON을 읽지 못했어요: " + err.message);
    }
  }
  document.getElementById("fileJson").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){ closeModal(); applyJsonText(String(reader.result)); };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("btnImportExcel").addEventListener("click", function(){ if(!readOnly) document.getElementById("fileExcel").click(); });
  document.getElementById("fileExcel").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    if(typeof XLSX === "undefined"){ toast("엑셀 라이브러리를 불러오지 못했어요"); e.target.value=""; return; }
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var wb = XLSX.read(new Uint8Array(reader.result), { type:"array" });
        function sheet(name){ return wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:""}) : []; }
        var newUnits = rowsToUnits(sheet("Units"), sheet("Situations"), sheet("Terms"), sheet("Sentences"));
        if(newUnits.length === 0){ toast("Units/Situations 시트에서 데이터를 찾지 못했어요"); return; }
        confirmReplace(newUnits, "엑셀");
      }catch(err){ toast("엑셀 파일을 읽지 못했어요: " + err.message); }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  });

  document.getElementById("btnExportJson").addEventListener("click", doExportJson);
  document.getElementById("btnExportExcel").addEventListener("click", doExportExcel);
  document.getElementById("btnTemplate").addEventListener("click", doDownloadTemplate);
  document.getElementById("btnCopyJson").addEventListener("click", copyJsonToClipboard);
  document.getElementById("btnIntegrationGuide").addEventListener("click", openIntegrationGuide);

  /* ============================================================
     9. Public surface — for embedding in an admin page
     ============================================================ */
  window.HancareStudio = {
    init: init,
    getData: function(){ return buildExportArray(); },
    setData: function(arr){
      if(!Array.isArray(arr)) throw new Error("setData expects an array shaped like practice-hangul.json");
      units = normalizeUnitsArray(arr);
      activeUnitId = units[0] ? units[0].id : null; activeSituationId = null;
      expanded = {}; units.forEach(function(u){ expanded[u.id] = true; });
      renderAll();
    }
  };

  if(!window.HANCARE_STUDIO_NO_AUTOINIT){
    var start = function(){ init(window.HANCARE_STUDIO_CONFIG || {}); };
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
    else start();
  }
})();
</script>
