<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="한글케어 XR실습 — 활력징후(V/S) 및 기초사정 3D 인터랙티브 실습. 환자확인부터 손위생, 체온·맥박·호흡·혈압·SpO2 측정, 기초사정, 기록·보고까지 8단계 표준 임상 워크플로우를 브라우저에서 실습합니다.">
<title>HanCare XR · 활력징후 및 기초사정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#E9E5DC; --card:#ffffff; --card-border:#D9D3C7; --line:#D9D3C7;
  --text:#12241F; --muted:#6B7A75; --faint:#94A19C;
  --brand:#0E7C66; --brand-dark:#12241F; --brand-light:#7FBFAD; --brand-soft:#F1F6F3;
  --chip:#F1F6F3; --chip-border:#DCE8E2; --panel:#F4F1EA;
  --warn-bg:#FBF1EC; --warn-text:#B4552F; --warn-border:#F0DDD2; --warn-accent:#E07B45;
  --good-bg:#F1F6F3; --good-text:#0E7C66;
  --monitor-bg:#07140f; --monitor-grid:rgba(124,255,178,.12); --monitor-fg:#7cffb2; --monitor-dim:#3d8a63;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  --font-mono:'IBM Plex Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
h1,h2,h3,h4{text-wrap:balance;margin:0;}
p{margin:0;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
select,input,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
[hidden]{display:none !important;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
img{max-width:100%;display:block;}

/* ---------- buttons / chips ---------- */
.btn{border-radius:10px;padding:9px 14px;font-weight:600;font-size:.83rem;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:#0a5c4c;}
.btn-primary:disabled{background:#B9CCC5;cursor:not-allowed;}
.btn-ghost{background:#fff;border-color:var(--card-border);color:var(--brand-dark);}
.btn-ghost:hover{border-color:var(--brand);}
.btn-ghost.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-soft{background:var(--brand-soft);color:var(--brand-dark);}
.btn-soft:hover{background:#e3ede8;}
.btn-sm{padding:6px 10px;font-size:.74rem;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--card-border);font-size:1rem;}
.icon-btn:hover{border-color:var(--brand);}
.icon-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.pill{border-radius:999px;padding:3px 10px;font-size:.68rem;font-weight:700;letter-spacing:.02em;}
.pill-locked{background:#EFEBE2;color:var(--faint);}
.pill-active{background:var(--brand);color:#fff;}
.pill-done{background:var(--good-bg);color:var(--good-text);}

/* ---------- term tooltip ---------- */
.term{border-bottom:1px dashed var(--brand-light);cursor:help;position:relative;}
.term[data-tooltip]:hover::after,.term[data-tooltip]:focus::after{
  content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:var(--brand-dark);color:#fff;font-size:.72rem;font-weight:500;line-height:1.4;
  padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 20px rgba(18,36,31,.25);z-index:80;
}
.term[data-tooltip]:hover::before{
  content:'';position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--brand-dark);z-index:80;
}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;flex-wrap:wrap;}
.top .brandMark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.95rem;color:var(--brand-dark);}
.top .brandMark .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);}
.top .moduleName{font-size:.76rem;color:var(--muted);font-weight:500;}
.top .spacer{flex:1;}
.top .group{display:flex;align-items:center;gap:6px;}
.top select.langSelect{border:1px solid var(--card-border);border-radius:8px;padding:6px 8px;font-size:.74rem;background:#fff;}

/* ---------- layout ---------- */
.xrRoot{min-height:100%;background:var(--bg);}
.xrRoot:fullscreen{background:var(--bg);overflow:auto;}
.wrap{max-width:1440px;margin:0 auto;padding:16px;}
.mainGrid{display:grid;grid-template-columns:236px minmax(0,1fr) 348px;gap:14px;align-items:start;}
@media(max-width:1100px){.mainGrid{grid-template-columns:1fr;}}

.card{background:#fff;border:1px solid var(--card-border);border-radius:16px;padding:14px;}
.cardTitle{font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--brand);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}

/* ---------- stepper ---------- */
.stepper{display:flex;flex-direction:column;gap:2px;}
.stepItem{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:10px;text-align:left;width:100%;position:relative;}
.stepItem:not(:last-child)::before{content:'';position:absolute;left:22px;top:36px;width:2px;height:calc(100% - 4px);background:var(--line);}
.stepItem.done:not(:last-child)::before{background:var(--brand-light);}
.stepBadge{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;background:#EFEBE2;color:var(--faint);z-index:1;}
.stepItem.active .stepBadge{background:var(--brand);color:#fff;}
.stepItem.done .stepBadge{background:var(--brand-light);color:#fff;}
.stepItem .stepTxt{padding-top:2px;}
.stepItem .stepTxt .t{font-size:.82rem;font-weight:700;color:var(--brand-dark);}
.stepItem.locked .stepTxt .t{color:var(--faint);}
.stepItem .stepTxt .s{font-size:.68rem;color:var(--faint);margin-top:1px;}
.stepItem:hover:not(.locked){background:var(--panel);}
.stepItem.active{background:var(--brand-soft);}

/* ---------- viewport ---------- */
.viewportCard{padding:0;overflow:hidden;}
.viewportHead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);}
.viewportHead .camChips{display:flex;gap:6px;flex-wrap:wrap;}
.viewport{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 130% at 50% 0%,#16302a 0%,var(--monitor-bg) 70%);}
.viewport canvas{display:block;width:100%;height:100%;}
.viewportOverlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px;}
.overlayTop{pointer-events:auto;max-width:420px;background:rgba(7,20,15,.72);backdrop-filter:blur(3px);border:1px solid rgba(124,255,178,.18);border-radius:14px;padding:12px 14px;color:#eafff2;}
.overlayTop .stepEyebrow{font-size:.68rem;font-weight:700;color:var(--monitor-fg);letter-spacing:.04em;}
.overlayTop h3{font-size:1rem;margin-top:2px;color:#fff;}
.overlayTop p{font-size:.78rem;line-height:1.55;color:#cfe9db;margin-top:6px;}
.overlayTop .term{border-bottom-color:rgba(124,255,178,.5);}
.overlayTop .term[data-tooltip]:hover::after{background:#fff;color:var(--brand-dark);}
.overlayTop .term[data-tooltip]:hover::before{border-top-color:#fff;}
.overlayBottom{pointer-events:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.overlayActions{display:flex;gap:8px;flex-wrap:wrap;background:rgba(7,20,15,.72);border:1px solid rgba(124,255,178,.18);border-radius:14px;padding:10px;backdrop-filter:blur(3px);}
.overlayActions .btn-soft{background:rgba(255,255,255,.9);}
.overlayActions .btn-primary{box-shadow:0 6px 18px rgba(14,124,102,.4);}
.readout{background:rgba(7,20,15,.72);border:1px solid rgba(124,255,178,.18);border-radius:14px;padding:10px 12px;color:var(--monitor-fg);min-width:130px;}
.readout .rv{font-family:var(--font-mono);font-size:1.3rem;font-weight:600;}
.readout .rl{font-size:.64rem;color:#9fd8bb;letter-spacing:.03em;}
.timerBar{height:6px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px;width:100%;}
.timerBar > i{display:block;height:100%;background:var(--monitor-fg);width:0%;transition:width .2s linear;}
.hygieneGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px;}
.hygieneStep{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(124,255,178,.15);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#7c968a;}
.hygieneStep.done{background:rgba(124,255,178,.18);color:var(--monitor-fg);border-color:var(--monitor-fg);}
.hygieneStep.now{outline:2px solid var(--monitor-fg);}

/* toast / warning */
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--warn-text);color:#fff;padding:10px 16px;border-radius:12px;font-size:.8rem;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:60;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}

/* ---------- AI preceptor ---------- */
.aiCard{background:var(--brand-dark);color:#fff;}
.aiCard .cardTitle{color:rgba(255,255,255,.75);}
.aiRow{display:flex;gap:10px;align-items:flex-start;}
.aiAvatar{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(160deg,var(--brand-light),var(--brand));display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:2px solid rgba(255,255,255,.25);}
.aiName{font-size:.82rem;font-weight:800;}
.aiRole{font-size:.66rem;color:rgba(255,255,255,.55);}
.aiBubble{margin-top:9px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:.82rem;line-height:1.6;}
.aiPhrase{margin-top:8px;background:rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.aiPhrase span{font-size:.84rem;font-weight:600;}
.aiActions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.aiActions .btn{background:rgba(255,255,255,.14);color:#fff;}
.aiActions .btn:hover{background:rgba(255,255,255,.24);}
.aiActions .btn-primary{background:#fff;color:var(--brand-dark);}
.aiActions .btn-primary:hover{background:#eee;}

/* ---------- right lower card w/ tabs ---------- */
.rightLower .tabs{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px;margin-bottom:10px;}
.rightLower .tabBtn{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:.76rem;font-weight:700;color:var(--muted);}
.rightLower .tabBtn.active{background:#fff;color:var(--brand-dark);box-shadow:0 2px 6px rgba(18,36,31,.08);}

.monitor{background:var(--monitor-bg);border-radius:12px;padding:10px;}
.monitor canvas{width:100%;height:78px;display:block;border-radius:8px;}
.vGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.vTile{background:rgba(255,255,255,.05);border-radius:8px;padding:7px 9px;}
.vTile .vl{font-size:.62rem;color:#9fd8bb;letter-spacing:.03em;}
.vTile .vv{font-family:var(--font-mono);font-size:1.05rem;color:var(--monitor-fg);font-weight:600;}
.vTile .vv .u{font-size:.62rem;color:#7c968a;margin-left:2px;}

.emrTable{width:100%;border-collapse:collapse;font-size:.78rem;}
.emrTable th{text-align:left;font-size:.66rem;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line);}
.emrTable td{padding:4px 6px;border-bottom:1px solid var(--line);}
.emrTable input{width:100%;border:1px solid var(--card-border);border-radius:6px;padding:5px 6px;font-size:.78rem;font-family:var(--font-mono);}
.emrTable input:focus{border-color:var(--brand);}

/* ---------- modal ---------- */
.modalWrap{position:fixed;inset:0;background:rgba(18,36,31,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;}
.modal h3{font-size:1.05rem;color:var(--brand-dark);}
.modal .close{position:absolute;}
.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.modalBody{margin-top:10px;font-size:.85rem;line-height:1.65;color:var(--text);}
.codeBox{background:var(--brand-dark);color:#d7f5e8;border-radius:10px;padding:12px;font-family:var(--font-mono);font-size:.72rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin-top:10px;}
.faqList{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.faqBtn{text-align:left;background:var(--panel);border-radius:10px;padding:9px 11px;font-size:.8rem;font-weight:600;color:var(--brand-dark);}
.faqBtn:hover{background:var(--chip-border);}
.qnaAnswer{margin-top:10px;background:var(--good-bg);border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.6;color:var(--brand-dark);}
.qnaInputRow{display:flex;gap:8px;margin-top:12px;}
.qnaInputRow input{flex:1;border:1px solid var(--card-border);border-radius:10px;padding:9px 11px;font-size:.82rem;}

/* ---------- report ---------- */
.scoreBig{font-size:2.4rem;font-weight:900;color:var(--brand);font-family:var(--font-mono);}
.scoreRows{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.scoreRow .lbl{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--brand-dark);margin-bottom:3px;}
.scoreBarBg{height:8px;border-radius:999px;background:var(--panel);overflow:hidden;}
.scoreBarFg{height:100%;background:var(--brand);border-radius:999px;}
.feedbackList{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.feedbackItem{font-size:.78rem;line-height:1.55;background:var(--panel);border-radius:10px;padding:8px 10px;}

.notice{background:var(--warn-bg);color:var(--warn-text);border-radius:12px;padding:10px 14px;font-size:.78rem;line-height:1.55;}
.footNote{font-size:.7rem;color:var(--faint);margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="xrRoot" id="xrRoot">

  <header class="top">
    <div class="brandMark"><span class="dot"></span>한글케어 <span style="font-weight:500;color:var(--faint)">HanCare</span></div>
    <div class="moduleName">XR실습 · 활력징후(V/S) 및 기초사정</div>
    <div class="spacer"></div>
    <div class="group">
      <select id="tooltipLangSelect" class="langSelect" title="용어 툴팁 언어" onchange="XR.setTooltipLang(this.value)">
        <option value="ko">용어 툴팁: 한국어</option>
        <option value="en">Tooltip: English</option>
        <option value="vi">Chú thích: Tiếng Việt</option>
        <option value="tl">Tooltip: Tagalog</option>
      </select>
      <button class="icon-btn active" id="soundBtn" title="효과음 ON/OFF" onclick="XR.toggleSound()">🔊</button>
      <button class="icon-btn" id="fsBtn" title="전체화면" onclick="XR.toggleFullscreen()">⛶</button>
      <button class="icon-btn" title="실습 초기화" onclick="XR.resetPractice()">↺</button>
      <button class="btn btn-ghost btn-sm" onclick="XR.openEmbed()">🔗 임베드 코드</button>
    </div>
  </header>

  <div class="wrap">
    <div class="mainGrid">

      <!-- LEFT: stepper -->
      <div class="card">
        <div class="cardTitle">8단계 실습 흐름</div>
        <div class="stepper" id="stepperList"></div>
      </div>

      <!-- CENTER: 3D viewport -->
      <div class="card viewportCard">
        <div class="viewportHead">
          <strong style="font-size:.82rem;color:var(--brand-dark)">3D 병실 &amp; 환자 시뮬레이터</strong>
          <div class="camChips" id="camChips"></div>
        </div>
        <div class="viewport" id="viewport">
          <div id="toast" class="toast"></div>
          <div class="viewportOverlay" id="viewportOverlay"></div>
        </div>
      </div>

      <!-- RIGHT -->
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card aiCard">
          <div class="cardTitle">AI 지도교사</div>
          <div class="aiRow">
            <div class="aiAvatar" id="aiAvatarFace">🙂</div>
            <div>
              <div class="aiName">김수련 프리셉터</div>
              <div class="aiRole">Preceptor · 실시간 임상 코칭</div>
            </div>
          </div>
          <div class="aiBubble" id="aiTipBox"></div>
          <div class="aiPhrase" id="aiPhraseBox"></div>
          <div class="aiActions">
            <button class="btn btn-primary btn-sm" onclick="XR.speakCurrentPhrase()">🔊 표준 발음 듣기</button>
            <button class="btn btn-sm" onclick="XR.openQna()">💬 무엇이든 물어보기</button>
          </div>
        </div>

        <div class="card rightLower">
          <div class="tabs">
            <button class="tabBtn active" id="tabMonitorBtn" onclick="XR.showTab('monitor')">실시간 모니터</button>
            <button class="tabBtn" id="tabEmrBtn" onclick="XR.showTab('emr')">EMR 기록지</button>
          </div>

          <div id="panelMonitor">
            <div class="monitor">
              <canvas id="ecgCanvas" width="600" height="140"></canvas>
              <div class="vGrid" id="vitalsGrid"></div>
            </div>
          </div>

          <div id="panelEmr" hidden>
            <table class="emrTable">
              <thead><tr><th>항목</th><th>측정값</th></tr></thead>
              <tbody id="emrRows"></tbody>
            </table>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="btn btn-soft btn-sm" onclick="XR.emrAutofill()">⬇ 자동 불러오기</button>
              <button class="btn btn-ghost btn-sm" onclick="XR.emrClear()">지우기</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <p class="footNote">본 콘텐츠의 수치·절차는 실습용 예시이며 실제 임상 지침과 다를 수 있습니다. 실제 환자에게 적용하는 의료행위가 아닌 교육용 시뮬레이션입니다.</p>
  </div>

</div>

<div id="modalLayer"></div>

<script>
/* ============================================================
   HanCare XR · 활력징후 및 기초사정 — 독립 실행형 인터랙티브 프로토타입
   추후 한글케어 Next.js 앱의 /xr/xr-vital-signs 모듈로 이식 예정.
   ============================================================ */
(function(){
'use strict';

/* ---------------------------------------------------------- glossary / tooltip */
var GLOSSARY = {
  idband:{ko:'환자 등록 팔찌(ID Band)',en:'Patient ID band',vi:'Vòng đeo tay nhận diện bệnh nhân',tl:'ID band ng pasyente'},
  sanitizer:{ko:'알코올 손소독제',en:'Alcohol hand sanitizer',vi:'Nước rửa tay khô có cồn',tl:'Alcohol hand sanitizer'},
  thermometer:{ko:'고막 체온계',en:'Tympanic (ear) thermometer',vi:'Nhiệt kế đo tai',tl:'Thermometer sa tainga'},
  probecover:{ko:'일회용 프로브 커버',en:'Disposable probe cover',vi:'Nắp đầu dò dùng một lần',tl:'Disposable na takip ng probe'},
  radial:{ko:'요골동맥',en:'Radial artery',vi:'Động mạch quay',tl:'Radial artery'},
  cuff:{ko:'혈압계 커프',en:'Blood pressure cuff',vi:'Vòng bít đo huyết áp',tl:'Cuff ng presyon ng dugo'},
  oximeter:{ko:'펄스 옥시미터',en:'Pulse oximeter',vi:'Máy đo SpO2 kẹp ngón tay',tl:'Pulse oximeter'},
  nrs:{ko:'숫자통증척도(NRS)',en:'Numeric Rating Scale (pain)',vi:'Thang đo mức độ đau (NRS)',tl:'Numeric Rating Scale ng sakit'},
  emr:{ko:'전자간호기록지(EMR Flowsheet)',en:'Electronic nursing flowsheet',vi:'Phiếu theo dõi điều dưỡng điện tử',tl:'Elektronikong flowsheet ng nursing'},

/* ---------------------------------------------------------- sound + speech */
var soundOn = true;
var audioCtx = null;
function beep(freq,dur,type){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||'sine'; o.frequency.value = freq||880;
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(dur||0.12));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+(dur||0.12)+0.02);
  }catch(e){}
}
function chime(kind){
  if(kind==='success'){ beep(880,.09); setTimeout(function(){beep(1180,.14);},90); }
  else if(kind==='warn'){ beep(220,.16,'square'); setTimeout(function(){beep(180,.18,'square');},130); }
  else if(kind==='click'){ beep(520,.05); }
  else if(kind==='pump'){ beep(340,.07); }
  else if(kind==='shutter'){ beep(700,.03); }
}
function isTtsSupported(){ return typeof window!=='undefined' && 'speechSynthesis' in window; }
var cachedKoVoice;
function pickKoVoice(){
  if(cachedKoVoice) return cachedKoVoice;
  var voices = window.speechSynthesis.getVoices();
  cachedKoVoice = voices.find(function(v){return v.lang && v.lang.indexOf('ko')===0;});
  return cachedKoVoice;
}
function speak(text,opts){
  opts = opts||{};
  if(!soundOn || !isTtsSupported()){ opts.onEnd && opts.onEnd(); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = opts.rate||0.98; u.pitch = opts.pitch||1;
    var v = pickKoVoice(); if(v) u.voice = v;
    u.onstart = function(){ opts.onStart && opts.onStart(); };
    u.onend = function(){ opts.onEnd && opts.onEnd(); };
    u.onerror = function(){ opts.onEnd && opts.onEnd(); };
    window.speechSynthesis.speak(u);
  }catch(e){ opts.onEnd && opts.onEnd(); }
}
if(isTtsSupported()){ window.speechSynthesis.onvoiceschanged = function(){ cachedKoVoice = undefined; }; }

var ecgCtx, ecgPhase = 0;
function initMonitor(){
  var c = document.getElementById('ecgCanvas');
  ecgCtx = c.getContext('2d');
}
function ecgWave(x, bpm){
  // x in [0,1) within one beat cycle -> waveform value [-1,1]
  var t = x;
  if(t<0.08) return Math.sin(t/0.08*Math.PI)*0.12;
  if(t<0.12) return -0.08;
  if(t<0.16) return ((t-0.12)/0.04)*1.0-0.08;
  if(t<0.2) return (1-(t-0.16)/0.04)*1.0-0.08*(1-(t-0.16)/0.04);
  if(t<0.26) return -0.25*(1-(t-0.2)/0.06);
  if(t<0.5) return 0;
  if(t<0.62) return Math.sin((t-0.5)/0.12*Math.PI)*0.22;
  return 0;
}
function drawEcg(){
  if(!ecgCtx) return;
  var c = ecgCtx.canvas;
  var w = c.width, h = c.height;
  ecgCtx.fillStyle = '#07140f'; ecgCtx.fillRect(0,0,w,h);
  ecgCtx.strokeStyle = 'rgba(124,255,178,.10)'; ecgCtx.lineWidth = 1;
  for(var gx=0; gx<w; gx+=20){ ecgCtx.beginPath(); ecgCtx.moveTo(gx,0); ecgCtx.lineTo(gx,h); ecgCtx.stroke(); }
  for(var gy=0; gy<h; gy+=20){ ecgCtx.beginPath(); ecgCtx.moveTo(0,gy); ecgCtx.lineTo(w,gy); ecgCtx.stroke(); }
  var bpm = S.vitals.pulse || 78;
  var cyclesOnScreen = (w/220) * (bpm/72);
  ecgCtx.strokeStyle = '#7cffb2'; ecgCtx.lineWidth = 2; ecgCtx.beginPath();
  for(var px=0; px<w; px++){
    var xx = ((px/w)*cyclesOnScreen + ecgPhase) % 1;
    var v = ecgWave(xx,bpm);
    var y = h/2 - v*h*0.42;
    if(px===0) ecgCtx.moveTo(px,y); else ecgCtx.lineTo(px,y);
  }
  ecgCtx.stroke();
}
function tickMonitor(dt){
  var bpm = S.vitals.pulse || 78;
  ecgPhase = (ecgPhase + dt*(bpm/60)) % 1;
  drawEcg();
}

function pumpSanitizer(){

function startHygiene(){
  if(S.hygieneRunning) return;
  S.hygieneRunning = true; S.hygieneIdx = 0; renderOverlay();
  var stepDur = 2600;
  function stepTick(){
    var bar = document.getElementById('hygieneBar');
    var t0 = Date.now();
    (function frame(){
      var p = Math.min(1,(Date.now()-t0)/stepDur);
      if(bar) bar.style.width = (p*100)+'%';
      if(p<1 && S.hygieneRunning){ requestAnimationFrame(frame); }
      else if(S.hygieneRunning){
        chime('click'); S.hygieneIdx++;
        if(S.hygieneIdx>=6){ S.hygieneRunning=false; S.hygieneDone=true; chime('success'); renderOverlay(); }
        else { renderOverlay(); stepTick(); }
      }
    })();
  }
  stepTick();
}

  if(S.bp.inflating) return;

  (function frame(){
    var p = Math.min(1,(Date.now()-t0)/dur);
    var bar = document.getElementById('bpBar'); if(bar) bar.style.width=(p*100)+'%';
    var gauge = p<0.5 ? (p/0.5)*160 : 160-((p-0.5)/0.5)*(160-70);
    Scene.setGauge(gauge);
    if(p>0.5 && Math.random()<0.15) beep(500,.03);
    if(p<1 && S.bp.inflating) requestAnimationFrame(frame);
    else{
      S.bp.inflating=false; S.bp.done=true;
      S.vitals.bpSys = VITALS_TARGET.bpSys; S.vitals.bpDia = VITALS_TARGET.bpDia;

/* ---------------------------------------------------------- final report / scoring */
function computeScore(){
  var proc = 30;
  proc -= Math.min(15, S.warnings*3);
  if(!S.hygieneDone) proc -= 5;
  proc = Math.max(0,proc);

  var op = 20;
  if(!S.thermo.cover) op -= 6;
  if(S.bp.wristAttempt>0) op -= Math.min(8, S.bp.wristAttempt*4);
  if(!S.spo2.clipped) op -= 6;
  op = Math.max(0,op);

  var result = 20;
  var match = S.emr.temp===S.vitals.temp.toFixed(1) && S.emr.pulse===String(S.vitals.pulse) &&
    S.emr.resp===String(S.vitals.resp) && S.emr.bp===(S.vitals.bpSys+'/'+S.vitals.bpDia) && S.emr.spo2===String(S.vitals.spo2);
  if(!match) result -= 10;
  result = Math.max(0,result);

  var obs = 15;
  var expected = {consciousness:'Alert',breathing:'Normal',skin:'Normal Pink',pain:'NRS 0'};
  Object.keys(expected).forEach(function(k){ if(S.assess[k]!==expected[k]) obs -= 3; });
  if(!S.assess.aiAnswer) obs -= 3;
  obs = Math.max(0,obs);

  var lang = 15;
  if(!S.greetingHeard) lang -= 4;
  if(!S.patientVoiceHeard) lang -= 3;
  if(!S.reportListened) lang -= 4;
  if(!S.reportSpoken) lang -= 4;
  lang = Math.max(0,lang);

  var total = proc+op+result+obs+lang;
  return { total:total, proc:proc, op:op, result:result, obs:obs, lang:lang, match:match };
}
function feedbackLines(sc){
  var f = [];
  f.push(sc.proc>=25 ? '절차 준수가 우수합니다. 환자 확인과 손위생을 규정대로 수행했어요.' : '절차 중 경고가 발생했어요. 단계를 건너뛰지 않도록 다시 연습해 보세요.');
  f.push(sc.op>=16 ? '장비 조작이 정확했어요 — 프로브 커버, SpO₂ 클립 장착을 잘 수행했습니다.' : '장비 조작에서 감점이 있었어요. 커프 위치, 프로브 커버 순서를 다시 확인하세요.');
  f.push(sc.result>=18 ? 'EMR 기록값이 측정값과 정확히 일치합니다.' : 'EMR 기록값이 실제 측정값과 달라요. "자동 불러오기"로 정확히 옮겨 적는 연습을 해보세요.');
  f.push(sc.obs>=12 ? '기초사정 관찰이 정확했습니다.' : '기초사정 항목 중 일부가 예상 소견과 달라요. 의식·호흡·피부색·통증 관찰을 다시 확인하세요.');
  f.push(sc.lang>=12 ? '한국어 의사소통 연습을 충실히 수행했어요.' : '발음 듣기·환자 응답 듣기·구두 보고 연습을 빠짐없이 수행해 보세요.');
  return f;
}

        '<div class="faqList">'+FAQ.map(function(f,i){ return '<button class="faqBtn" onclick="XR.askFaq('+i+')">'+f.q+'</button>'; }).join('')+'</div>'+
        '<div id="qnaAnswerWrap"></div>'+
        '<div class="qnaInputRow"><input id="qnaFreeInput" type="text" placeholder="예: 손위생은 몇 초 동안 해야 해요?" onkeydown="if(event.key===\'Enter\') XR.askFree()">'+
        '<button class="btn btn-primary" onclick="XR.askFree()">전송</button></div>'+
      '</div>'+
    '</div></div>';
  document.getElementById('modalLayer').innerHTML = html;
}
function showQnaAnswer(text){
  var el = document.getElementById('qnaAnswerWrap');
  if(el) el.innerHTML = '<div class="qnaAnswer">'+text+' <button class="btn btn-sm btn-ghost" style="margin-left:6px;" onclick="XR.speak2(\''+text.replace(/'/g,"\\'")+'\')">🔊</button></div>';
}
function askFaq(i){ showQnaAnswer(FAQ[i].a); }
function speak2(t){ speak(t); }
function askFree(){
  var input = document.getElementById('qnaFreeInput');
  var q = (input.value||'').trim();
  if(!q) return;
  var lower = q;
  var ans = '죄송해요, 아직 답변을 준비하지 못한 질문이에요. 담당 지도교사나 선임 간호사에게 직접 문의해 주세요.';
  if(lower.indexOf('손위생')>-1 || lower.indexOf('소독')>-1) ans = FAQ[0].a + ' 손비비기는 보통 15~20초 정도 수행합니다.';
  else if(lower.indexOf('혈압')>-1 || lower.indexOf('커프')>-1) ans = FAQ[1].a;
  else if(lower.indexOf('체온')>-1) ans = FAQ[2].a;
  else if(lower.indexOf('산소')>-1 || lower.toLowerCase().indexOf('spo2')>-1) ans = FAQ[3].a;
  else if(lower.indexOf('보고')>-1) ans = FAQ[4].a;
  else if(lower.indexOf('맥박')>-1 || lower.indexOf('호흡')>-1) ans = '맥박은 보통 60~100회/분, 호흡은 12~20회/분을 정상 범위로 봅니다. 30초간 측정 후 2를 곱해 분당 횟수로 환산해요.';
  showQnaAnswer(ans); input.value='';
}

/* ---------------------------------------------------------- 3D scene (Three.js) */
var Scene = (function(){
  var scene, camera, renderer, clock;
  var patient = {}, cart = {}, ready=false;
  var camTargets = {
    full: { pos:new (window.THREE?THREE.Vector3:Object)(0,2.6,5.4), look:new (window.THREE?THREE.Vector3:Object)(0,0.9,0) },
  };
  var curPos, curLook, goalPos, goalLook, camT=1, camDur=800, camStart=0;

  function init(){
    if(!window.THREE) return;
    var el = document.getElementById('viewport');
    scene = new THREE.Scene();
    scene.background = null;
    camera = new THREE.PerspectiveCamera(38, el.clientWidth/el.clientHeight, 0.1, 100);
    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    renderer.setSize(el.clientWidth, el.clientHeight);
    el.insertBefore(renderer.domElement, el.firstChild);

    scene.add(new THREE.HemisphereLight(0xbfe8d8, 0x0a1712, 0.9));
    var key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(3,5,4); scene.add(key);
    var rim = new THREE.PointLight(0x7cffb2, 0.35, 12); rim.position.set(-3,2,-2); scene.add(rim);

    var floor = new THREE.Mesh(new THREE.PlaneGeometry(14,14), new THREE.MeshStandardMaterial({color:0x0d241d, roughness:0.9}));
    floor.rotation.x = -Math.PI/2; floor.position.y=-1.05; scene.add(floor);
    var back = new THREE.Mesh(new THREE.PlaneGeometry(14,7), new THREE.MeshStandardMaterial({color:0x102a22, roughness:1}));
    back.position.set(0,2.4,-3.2); scene.add(back);

    buildBed();
    buildPatient();
    buildCart();

    camTargets.full = { pos:new THREE.Vector3(0,2.5,5.2), look:new THREE.Vector3(0,0.8,0) };
    camTargets.head = { pos:new THREE.Vector3(-1.4,1.9,1.6), look:new THREE.Vector3(-1.0,1.35,0) };
    camTargets.arm  = { pos:new THREE.Vector3(1.6,1.7,1.9), look:new THREE.Vector3(0.9,0.95,0.1) };
    camTargets.cart = { pos:new THREE.Vector3(2.6,1.7,1.4), look:new THREE.Vector3(2.2,0.9,0) };

    curPos = camTargets.full.pos.clone(); curLook = camTargets.full.look.clone();
    camera.position.copy(curPos); camera.lookAt(curLook);

    clock = new THREE.Clock();
    ready = true;
    window.addEventListener('resize', onResize);
    animate();
  }

  function buildBed(){
    var frameMat = new THREE.MeshStandardMaterial({color:0xdfe7e2, metalness:0.3, roughness:0.5});
    var frame = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.12,3.4), frameMat);
    frame.position.set(-0.2,-0.42,0); scene.add(frame);
    var legMat = new THREE.MeshStandardMaterial({color:0x8f9a95, metalness:0.5, roughness:0.4});
    [[-0.9,-1.5],[0.9,-1.5],[-0.9,1.5],[0.9,1.5]].forEach(function(p){
      var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.62,8), legMat);
      leg.position.set(-0.2+p[0]*0.55,-0.72,p[1]*0.5); scene.add(leg);
    });
    var mattress = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.22,3.2), new THREE.MeshStandardMaterial({color:0xf4f1ea, roughness:0.9}));
    mattress.position.set(-0.2,-0.22,0); scene.add(mattress);
    var blanketMat = new THREE.MeshStandardMaterial({color:0x0e7c66, roughness:0.8});
    var blanket = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.16,1.9), blanketMat);
    blanket.position.set(-0.2,-0.06,0.55); scene.add(blanket);
  }

  function buildPatient(){
    var skin = new THREE.MeshStandardMaterial({color:0xe7bd9d, roughness:0.7});
    var gown = new THREE.MeshStandardMaterial({color:0xdfe9e4, roughness:0.85});
    var group = new THREE.Group(); group.position.set(-0.2,0,-0.15); scene.add(group);

    var torso = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.32,1.05), gown);
    torso.position.set(0,0.02,-0.35); group.add(torso);

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.24,20,16), skin);
    head.position.set(0,0.12,-1.05); group.add(head);
    var hair = new THREE.Mesh(new THREE.SphereGeometry(0.245,20,16,0,Math.PI*2,0,Math.PI*0.55), new THREE.MeshStandardMaterial({color:0x2b241c}));
    hair.position.copy(head.position).add(new THREE.Vector3(0,0.06,0)); group.add(hair);

    var eyeGeo = new THREE.SphereGeometry(0.022,8,8);
    var eyeMat = new THREE.MeshStandardMaterial({color:0x1c1a17});
    var eyeL = new THREE.Mesh(eyeGeo,eyeMat); eyeL.position.set(-0.08,0.14,-0.85); group.add(eyeL);
    var eyeR = new THREE.Mesh(eyeGeo,eyeMat); eyeR.position.set(0.08,0.14,-0.85); group.add(eyeR);

    var earSocket = new THREE.Object3D(); earSocket.position.set(-0.23,0.11,-1.02); group.add(earSocket);

    var armMat = gown;
    var armR = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.07,0.75,10), armMat);
    armR.rotation.z = Math.PI/2*0.15; armR.position.set(0.42,-0.02,-0.15); group.add(armR);
    var handR = new THREE.Mesh(new THREE.SphereGeometry(0.085,12,10), skin);
    handR.position.set(0.68,-0.14,0.22); group.add(handR);
    var indexTip = new THREE.Object3D(); indexTip.position.set(0.74,-0.15,0.34); group.add(indexTip);
    var wristPoint = new THREE.Object3D(); wristPoint.position.set(0.62,-0.1,0.1); group.add(wristPoint);
    var upperArmPos = new THREE.Object3D(); upperArmPos.position.set(0.46,0.0,-0.32); upperArmPos.rotation.z = armR.rotation.z; group.add(upperArmPos);
    var wristCuffPos = new THREE.Object3D(); wristCuffPos.position.set(0.62,-0.11,0.14); group.add(wristCuffPos);

    var pulseRing = new THREE.Mesh(new THREE.TorusGeometry(0.045,0.008,8,20), new THREE.MeshStandardMaterial({color:0xff6b6b, emissive:0xff2222, emissiveIntensity:0.6, transparent:true, opacity:0}));
    pulseRing.position.copy(wristPoint.position); pulseRing.rotation.x = Math.PI/2; group.add(pulseRing);

    var armL = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.07,0.75,10), armMat);
    armL.rotation.z = -Math.PI/2*0.15; armL.position.set(-0.42,-0.02,-0.15); group.add(armL);

    var legs = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,1.1), new THREE.MeshStandardMaterial({color:0x0e7c66,roughness:0.85}));
    legs.position.set(0,-0.06,0.55); group.add(legs);

    patient = { group:group, torso:torso, head:head, eyeL:eyeL, eyeR:eyeR, earSocket:earSocket,
      indexTip:indexTip, wristPoint:wristPoint, upperArmPos:upperArmPos, wristCuffPos:wristCuffPos, pulseRing:pulseRing };
  }

  function buildCart(){
    var group = new THREE.Group(); group.position.set(2.3,-0.3,-0.2); scene.add(group);
    var top = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.06,0.5), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5}));
    top.position.set(0,0.55,0); group.add(top);
    var shelf = top.clone(); shelf.position.set(0,0.1,0); group.add(shelf);
    var legMat = new THREE.MeshStandardMaterial({color:0x9aa39d, metalness:0.6, roughness:0.35});
    [[-0.4,-0.22],[0.4,-0.22],[-0.4,0.22],[0.4,0.22]].forEach(function(p){
      var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.62,8), legMat);
      leg.position.set(p[0],0.24,p[1]); group.add(leg);
    });

    // hand sanitizer dispenser
    var saniBase = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,0.22,10), new THREE.MeshStandardMaterial({color:0x0e7c66}));
    saniBase.position.set(-0.28,0.7,0); group.add(saniBase);
    var saniLever = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.03,0.05), new THREE.MeshStandardMaterial({color:0xffffff}));
    saniLever.position.set(-0.28,0.82,0.04); group.add(saniLever);

    // thermometer
    var thermo = new THREE.Group();
    var thermoBody = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.025,0.16,10), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4}));
    thermoBody.rotation.z = Math.PI/2.2;
    thermo.add(thermoBody);
    var thermoScreen = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.03,0.005), new THREE.MeshStandardMaterial({color:0x111111, emissive:0x000000}));
    thermoScreen.position.set(0,0.02,0.02); thermo.add(thermoScreen);
    var probeCover = new THREE.Mesh(new THREE.ConeGeometry(0.018,0.05,10), new THREE.MeshStandardMaterial({color:0x5fb8ff}));
    probeCover.position.set(0.09,-0.03,0); probeCover.rotation.z = Math.PI/2.4; probeCover.visible=false;
    thermo.add(probeCover);
    thermo.position.set(0.05,0.68,0.12);
    group.add(thermo);
    var thermoHome = thermo.position.clone();

    // BP cuff (arc)
    var cuff = new THREE.Mesh(new THREE.TorusGeometry(0.11,0.035,10,24,Math.PI*1.5), new THREE.MeshStandardMaterial({color:0x2b3a35}));
    cuff.position.set(0.25,0.68,-0.1); cuff.rotation.x = Math.PI/2;
    group.add(cuff);
    var cuffHome = cuff.position.clone();

    // SpO2 clip
    var clip = new THREE.Group();
    var clipTop = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.012,0.03), new THREE.MeshStandardMaterial({color:0x1c1c1c}));
    clipTop.position.set(0,0.01,0); clip.add(clipTop);
    var clipBot = clipTop.clone(); clipBot.position.set(0,-0.01,0); clip.add(clipBot);
    var led = new THREE.Mesh(new THREE.SphereGeometry(0.006,8,8), new THREE.MeshStandardMaterial({color:0xff3333, emissive:0xff0000, emissiveIntensity:0}));
    led.position.set(0.02,0,0.016); clip.add(led);
    clip.position.set(-0.05,0.68,-0.15);
    group.add(clip);
    var clipHome = clip.position.clone();

    cart = { group:group, saniLever:saniLever, thermo:thermo, thermoScreen:thermoScreen, probeCover:probeCover, thermoHome:thermoHome,
      cuff:cuff, cuffHome:cuffHome, clip:clip, led:led, clipHome:clipHome };
  }

  function lerpV(a,b,t){ return a.clone().lerp(b,t); }
  function ease(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function moveCamera(preset){
    if(!ready) return;
    var tgt = camTargets[preset] || camTargets.full;
    goalPos = tgt.pos.clone(); goalLook = tgt.look.clone();
    camStart = performance.now(); camT = 0;
  }

  var t0 = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    if(!ready) return;
    var now = performance.now();
    var dt = clock.getDelta();
    var elapsed = (now - t0)/1000;

    if(patient.torso){
      var breath = 1 + Math.sin(elapsed*1.6)*0.03;
      patient.torso.scale.set(1,breath,1);
    }
    if(patient.eyeL){
      var blink = (Math.sin(elapsed*0.7)>0.982) ? 0.15 : 1;
      patient.eyeL.scale.y = blink; patient.eyeR.scale.y = blink;
    }
    if(patient.pulseRing && patient.pulseRing.material.opacity>0){
      var bpm = (S.vitals.pulse||76)/60;
      var ph = (elapsed*bpm)%1;
      var sc = 1+ph*1.6;
      patient.pulseRing.scale.set(sc,sc,sc);
      patient.pulseRing.material.opacity = (1-ph)*0.8;
    }
    if(cart.led && cart.led.material.emissiveIntensity>0){
      cart.led.material.emissiveIntensity = (Math.sin(elapsed*10)*0.5+0.5)*1.4;
    }

    if(goalPos){
      var dur = 0.8;
      camT = Math.min(1,(now-camStart)/1000/dur);
      var e = ease(camT);
      camera.position.lerpVectors(curPos, goalPos, e);
      var look = lerpV(curLook, goalLook, e);
      camera.lookAt(look);
      if(camT>=1){ curPos = goalPos.clone(); curLook = goalLook.clone(); goalPos=null; }
    } else if(S.cam==='full'){
      camera.position.x = curPos.x + Math.sin(elapsed*0.12)*0.15;
      camera.lookAt(curLook);
    }

    renderer.render(scene,camera);
    tickMonitor(dt);
  }

  function onResize(){
    var el = document.getElementById('viewport');
    if(!el || !renderer) return;
    camera.aspect = el.clientWidth/el.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(el.clientWidth, el.clientHeight);
  }

  function pumpSanitizer(){
    if(!cart.saniLever) return;
    var t0 = performance.now();
    (function frame(){
      var p = Math.min(1,(performance.now()-t0)/260);
      cart.saniLever.rotation.x = Math.sin(p*Math.PI)*0.5;
      if(p<1) requestAnimationFrame(frame);
    })();
  }
  function thermoPower(on){
    if(cart.thermoScreen) cart.thermoScreen.material.emissive.setHex(on?0x33ffaa:0x000000);
  }
  function thermoCover(on){ if(cart.probeCover) cart.probeCover.visible = on; }
  function thermoToEar(cb){
    if(!cart.thermo || !patient.earSocket) { cb&&cb(); return; }
    var start = cart.thermo.position.clone();
    var end = new THREE.Vector3(); patient.earSocket.getWorldPosition(end);
    cart.group.worldToLocal(end);
    var t0 = performance.now(), dur=500;
    (function frame(){
      var p = Math.min(1,(performance.now()-t0)/dur);
      cart.thermo.position.lerpVectors(start,end,ease(p));
      if(p<1) requestAnimationFrame(frame);
      else { cb && cb();
        setTimeout(function(){
          var t1 = performance.now();
          (function back(){
            var p2 = Math.min(1,(performance.now()-t1)/dur);
            cart.thermo.position.lerpVectors(end,cart.thermoHome,ease(p2));
            if(p2<1) requestAnimationFrame(back);
          })();
        },900);
      }
    })();
  }
  function cuffTo(where){
    if(!cart.cuff) return;
    var start = cart.cuff.position.clone();
    var targetObj = where==='arm' ? patient.upperArmPos : patient.wristCuffPos;
    if(!targetObj){ return; }
    var end = new THREE.Vector3(); targetObj.getWorldPosition(end);
    cart.group.worldToLocal(end);
    var t0=performance.now(), dur=500;
    (function frame(){
      var p=Math.min(1,(performance.now()-t0)/dur);
      cart.cuff.position.lerpVectors(start,end,ease(p));
      if(p<1) requestAnimationFrame(frame);
    })();
  }
  function setGauge(v){ /* gauge value drives no extra 3D element currently, reserved for future HUD */ }
  function clipOximeter(on){
    if(!cart.clip || !patient.indexTip) return;
    if(on){
      var start = cart.clip.position.clone();
      var end = new THREE.Vector3(); patient.indexTip.getWorldPosition(end);
      cart.group.worldToLocal(end);
      var t0=performance.now(), dur=500;
      (function frame(){
        var p=Math.min(1,(performance.now()-t0)/dur);
        cart.clip.position.lerpVectors(start,end,ease(p));
        if(p<1) requestAnimationFrame(frame);
        else { cart.led.material.emissiveIntensity = 1; }
      })();
    }
  }
  function showPulseRing(on){ if(patient.pulseRing) patient.pulseRing.material.opacity = on?0.8:0; }
  function resetProps(){
    if(!ready) return;
    if(cart.thermoScreen) cart.thermoScreen.material.emissive.setHex(0x000000);
    if(cart.probeCover) cart.probeCover.visible = false;
    if(cart.thermo && cart.thermoHome) cart.thermo.position.copy(cart.thermoHome);
    if(cart.cuff && cart.cuffHome) cart.cuff.position.copy(cart.cuffHome);
    if(cart.clip && cart.clipHome) cart.clip.position.copy(cart.clipHome);
    if(cart.led) cart.led.material.emissiveIntensity = 0;
    if(patient.pulseRing) patient.pulseRing.material.opacity = 0;
    moveCamera('full');
  }

  return { init:init, moveCamera:moveCamera, pumpSanitizer:pumpSanitizer, thermoPower:thermoPower, thermoCover:thermoCover,
    thermoToEar:thermoToEar, cuffTo:cuffTo, setGauge:setGauge, clipOximeter:clipOximeter, showPulseRing:showPulseRing, resetProps:resetProps };
})();

  clipOximeter:clipOximeter, recordSpo2:recordSpo2,
  pickAssess:pickAssess, setAiAnswer:setAiAnswer, finishAssess:finishAssess,
  listenReport:listenReport, speakReport:speakReport, openReport:openReport,
  showTab:showTab, emrEdit:emrEdit, emrAutofill:emrAutofill, emrClear:emrClear
};
