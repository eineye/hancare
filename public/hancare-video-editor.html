<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상 편집기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 색·폰트 토큰·공통 스타일은 실습내용 편집기(hancare-library-editor.html)와 같다. */
  :root{
    --bg:#F3F6F4;
    --surface:#FFFFFF;
    --surface-2:#EAF0EC;
    --surface-3:#DEE8E2;
    --ink:#16211E;
    --ink-muted:#5C6B66;
    --ink-faint:#8B9B95;
    --border:#D7E2DD;
    --border-strong:#B9CBC3;
    --accent:#276F5F;
    --accent-strong:#1D5648;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1EEE8;
    --coral:#C85B36;
    --coral-soft:#F7E4DA;
    --danger:#B23B24;
    --danger-soft:#F6DFD9;
    --success:#2E8B5C;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,32,28,0.06);
    --shadow-md:0 8px 24px rgba(20,32,28,0.10);
    --font-display:'Gowun Batang', ui-serif, Georgia, serif;
    --font-body:'Noto Sans KR', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815;
      --surface:#17211D;
      --surface-2:#1D2924;
      --surface-3:#28342E;
      --ink:#E7EFEC;
      --ink-muted:#9DB0A9;
      --ink-faint:#6E8079;
      --border:#2B3A34;
      --border-strong:#3A4C44;
      --accent:#55B999;
      --accent-strong:#7BD1B3;
      --accent-ink:#0B1613;
      --accent-soft:#1E3931;
      --coral:#E88A61;
      --coral-soft:#3A2A20;
      --danger:#E58165;
      --danger-soft:#3E2620;
      --success:#59BE8B;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
      --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815;
    --surface:#17211D;
    --surface-2:#1D2924;
    --surface-3:#28342E;
    --ink:#E7EFEC;
    --ink-muted:#9DB0A9;
    --ink-faint:#6E8079;
    --border:#2B3A34;
    --border-strong:#3A4C44;
    --accent:#55B999;
    --accent-strong:#7BD1B3;
    --accent-ink:#0B1613;
    --accent-soft:#1E3931;
    --coral:#E88A61;
    --coral-soft:#3A2A20;
    --danger:#E58165;
    --danger-soft:#3E2620;
    --success:#59BE8B;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    padding-inline:16px;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}
  input,textarea,select,button{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- layout shell ---------- */
  #app{max-width:1400px; margin:0 auto; padding-block:18px 40px;}

  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .brand h1{font-size:22px; font-weight:700; color:var(--ink);}
  .brand .sub{color:var(--ink-muted); font-size:12.5px;}
  .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .stat{display:flex; flex-direction:column; gap:0;}
  .stat b{font-size:15px; color:var(--accent-strong); font-weight:700;}
  .stat span{font-size:11px; color:var(--ink-faint); letter-spacing:.02em;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .toolbar-group{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:5px; box-shadow:var(--shadow-sm);}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:var(--radius-sm); padding:7px 11px; font-size:12.5px; font-weight:500;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.ghost{background:transparent; border-color:transparent;}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger);}
  .btn.small{padding:4px 8px; font-size:11.5px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:disabled:hover{background:var(--surface); border-color:var(--border);}

  .status-line{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .status-line.saving .status-dot{background:var(--coral); animation:pulse 1s infinite;}
  .status-line.saved .status-dot{background:var(--success);}
  .status-line.offline .status-dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--coral-soft); border:1px solid var(--coral); color:var(--ink);
    border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; margin-bottom:14px;
  }
  .banner b{color:var(--coral);}
  .banner .btn{flex:none;}

  .grid{
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 320px;
    gap:14px;
    align-items:start;
  }
  @media (max-width:1100px){
    .grid{grid-template-columns:220px minmax(0,1fr);}
    #preview{grid-column:1 / -1;}
  }
  @media (max-width:760px){
    .grid{grid-template-columns:1fr;}
    #sidebar{order:1;}
    #editor{order:2;}
    #preview{grid-column:auto; order:3;}
    #sidebar .tree{max-height:none; overflow:visible; display:flex; flex-direction:column; gap:8px;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .panel-head h2{font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:.01em;}
  .panel-body{padding:12px;}

  /* ---------- sidebar tree ---------- */
  #sidebar{position:sticky; top:12px;}
  .tree{max-height:74vh; overflow-y:auto; padding:8px;}
  .unit-block{margin-bottom:6px; border-radius:var(--radius-md); overflow:hidden;}
  .unit-row{
    display:flex; align-items:center; gap:6px; padding:8px 8px; border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .unit-row:hover{background:var(--surface-2);}
  .unit-row.active{background:var(--accent-soft);}
  .unit-row .chevron{font-size:10px; color:var(--ink-faint); width:10px; flex:none;}
  .unit-row .label{flex:1; min-width:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .unit-row .count{font-size:10.5px; color:var(--ink-faint); flex:none;}
  .row-actions{display:none; gap:2px; flex:none;}
  .unit-row:hover .row-actions, .situation-row:hover .row-actions{display:flex;}
  .icon-btn{border:none; background:transparent; color:var(--ink-faint); border-radius:5px; padding:2px 4px; font-size:11px; line-height:1;}
  .icon-btn:hover{background:var(--surface-3); color:var(--ink);}

  .situation-list{padding-left:16px; display:flex; flex-direction:column; gap:1px;}
  .situation-row{
    display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:var(--radius-sm);
    cursor:pointer; font-size:12.5px;
  }
  .situation-row:hover{background:var(--surface-2);}
  .situation-row.active{background:var(--accent); color:var(--accent-ink);}
  .situation-row.active .icon-btn{color:var(--accent-ink);}
  .situation-row .label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .situation-row .dupe{color:var(--danger); font-weight:700;}

  .sidebar-foot{padding:8px; border-top:1px solid var(--border);}

  /* ---------- editor ---------- */
  #editor .panel-body{display:flex; flex-direction:column; gap:16px;}
  .empty-state{padding:48px 20px; text-align:center; color:var(--ink-muted);}
  .empty-state .big{font-size:34px; margin-bottom:6px;}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
  .field-grid.full{grid-template-columns:1fr;}
  @media (max-width:560px){.field-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field label{font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between; gap:6px;}
  .field label .tag{font-weight:400; color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;}
  .field input, .field textarea{
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px;
    background:var(--surface); color:var(--ink); width:100%; resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field input.mono, .field.mono input{font-family:var(--font-mono); font-size:12px;}
  .field input.dupe{border-color:var(--danger); background:var(--danger-soft);}

  .section-title{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px;}
  .section-title h3{font-size:13px; font-weight:700; color:var(--ink);}
  .section-title .count{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}

  .grid-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .grid-table th{
    text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em;
    padding:0 8px 6px; border-bottom:1px solid var(--border);
  }
  .grid-table td{padding:4px; vertical-align:top; border-bottom:1px solid var(--border);}
  .grid-table tr:last-child td{border-bottom:none;}
  .grid-table input{
    width:100%; border:1px solid transparent; border-radius:6px; padding:6px 7px;
    background:var(--surface-2); color:var(--ink);
  }
  .grid-table input:focus{background:var(--surface); border-color:var(--accent);}
  .grid-table input.mono{font-family:var(--font-mono); font-size:11px;}
  .grid-table input.dupe{border-color:var(--danger); background:var(--danger-soft);}
  .grid-table .col-actions{white-space:nowrap; width:1%;}
  .table-scroll{overflow-x:auto; border-radius:var(--radius-md);}
  .row-add{margin-top:8px;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:4px 10px; font-size:11.5px; color:var(--ink-muted);
  }

  /* ---------- preview ---------- */
  #preview{position:sticky; top:12px;}
  .preview-card{padding:16px; display:flex; flex-direction:column; gap:12px;}
  .preview-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag-pill{background:var(--accent-soft); color:var(--accent-strong); border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:600;}
  .tag-pill.coral{background:var(--coral-soft); color:var(--coral);}
  .preview-title{font-family:var(--font-display); font-size:18px; line-height:1.4; color:var(--ink);}
  .preview-title .en{display:block; font-family:var(--font-body); font-size:12px; color:var(--ink-muted); font-style:italic; margin-top:2px;}
  .preview-desc{font-size:12.5px; color:var(--ink-muted); background:var(--surface-2); border-radius:var(--radius-sm); padding:10px;}
  .preview-sub{font-size:11px; font-weight:700; color:var(--ink-faint); letter-spacing:.03em; margin-bottom:6px;}
  .preview-terms{display:flex; flex-wrap:wrap; gap:6px;}
  .term-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:11.5px;}
  .term-chip .h{font-weight:700; color:var(--ink);}
  .term-chip .r{color:var(--ink-faint); font-family:var(--font-mono); font-size:10px;}
  .term-chip .g{color:var(--ink-muted); display:block; margin-top:1px;}
  .sentence-item{border-top:1px solid var(--border); padding-top:8px; margin-top:2px;}
  .sentence-item:first-child{border-top:none; padding-top:0; margin-top:0;}
  .sentence-item .ko{font-weight:600; color:var(--ink); font-size:13.5px;}
  .sentence-item .rm{color:var(--ink-faint); font-family:var(--font-mono); font-size:10.5px; margin-top:1px;}
  .sentence-item .en{color:var(--ink-muted); font-size:12px; margin-top:2px;}

  /* ---------- modal / toast ---------- */
  .overlay{position:fixed; inset:0; background:rgba(10,16,14,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); max-width:560px; width:100%; padding:18px; max-height:85vh; overflow:auto;}
  .modal h3{font-size:15px; margin-bottom:8px;}
  .modal p{font-size:12.5px; color:var(--ink-muted); margin:0 0 10px;}
  .modal p b{color:var(--ink);}
  .modal textarea{width:100%; min-height:160px; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2); color:var(--ink);}
  .modal pre{white-space:pre; overflow-x:auto; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11px; line-height:1.6; margin:0 0 12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
    font-size:12.5px; box-shadow:var(--shadow-md); z-index:60; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  [hidden]{display:none !important;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>영상 편집기</h1>
      <div class="sub">한글케어 영상학습 — 영상 업로드 · AI 자동 자막 · 자막 편집</div>
    </div>
  </header>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script>
  // 한글케어 연결 (docs/VIDEO_EDITOR_DESIGN.md §6)
  // - ?host=hangulcare: 단일 파일판 hangulcare.html 안(iframe). 부모와 postMessage(hcVid)로 주고받고,
  //   부모가 브라우저 저장소에 보관해 영상학습 화면에 반영한다.
  // - 그 밖에 서버에서 열린 경우: Next.js 서버(/api/videos → content/videos.json)에 자동 저장.
  // - 파일만 따로 열었을 때(file://)는 로컬 전용 모드(JSON 내보내기로 보관).
  (function () {
    if (window.HANCARE_VIDEO_CONFIG) return;
    if (/[?&]host=hangulcare\b/.test(location.search) && window.parent !== window) {
      window.HANCARE_VIDEO_CONFIG = { adapter: true };
    } else if (location.protocol !== "file:") {
      window.HANCARE_VIDEO_CONFIG = { baseUrl: "/api/videos", libraryUrl: "/api/hangul-library/units" };
    } else {
      window.HANCARE_VIDEO_CONFIG = {};
    }
  })();
</script>
<script src="./hancare-video-editor.js"></script>
</body>
</html>
