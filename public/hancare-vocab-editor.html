<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어장 편집기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  /* 색·폰트 토큰은 실습내용 편집기(hancare-library-editor.html)와 같다. */
  :root{
    --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EAF0EC; --surface-3:#DEE8E2;
    --ink:#16211E; --ink-muted:#5C6B66; --ink-faint:#8B9B95;
    --border:#D7E2DD; --border-strong:#B9CBC3;
    --accent:#276F5F; --accent-strong:#1D5648; --accent-ink:#FFFFFF; --accent-soft:#E1EEE8;
    --coral:#C85B36; --coral-soft:#F7E4DA; --danger:#B23B24; --danger-soft:#F6DFD9; --success:#2E8B5C;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,32,28,0.06); --shadow-md:0 8px 24px rgba(20,32,28,0.10);
    --font-display:'Gowun Batang', ui-serif, Georgia, serif;
    --font-body:'Noto Sans KR', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815; --surface:#17211D; --surface-2:#1D2924; --surface-3:#28342E;
      --ink:#E7EFEC; --ink-muted:#9DB0A9; --ink-faint:#6E8079;
      --border:#2B3A34; --border-strong:#3A4C44;
      --accent:#55B999; --accent-strong:#7BD1B3; --accent-ink:#0B1613; --accent-soft:#1E3931;
      --coral:#E88A61; --coral-soft:#3A2A20; --danger:#E58165; --danger-soft:#3E2620; --success:#59BE8B;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815; --surface:#17211D; --surface-2:#1D2924; --surface-3:#28342E;
    --ink:#E7EFEC; --ink-muted:#9DB0A9; --ink-faint:#6E8079;
    --border:#2B3A34; --border-strong:#3A4C44;
    --accent:#55B999; --accent-strong:#7BD1B3; --accent-ink:#0B1613; --accent-soft:#1E3931;
    --coral:#E88A61; --coral-soft:#3A2A20; --danger:#E58165; --danger-soft:#3E2620; --success:#59BE8B;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; padding-inline:16px;}
  h1,h2,h3{font-family:var(--font-display); margin:0;}
  input,textarea,select,button{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  #app{max-width:1400px; margin:0 auto; padding-block:18px 40px;}

  header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .brand h1{font-size:22px; font-weight:700;}
  .brand .sub{color:var(--ink-muted); font-size:12.5px;}
  .stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;}
  .stat{display:flex; flex-direction:column;}
  .stat b{font-size:15px; color:var(--accent-strong); font-weight:700; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; color:var(--ink-faint);}
  .status-line{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .status-line.saving .status-dot{background:var(--coral); animation:pulse 1s infinite;}
  .status-line.saved .status-dot{background:var(--success);}
  .status-line.offline .status-dot{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .toolbar-group{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:5px; box-shadow:var(--shadow-sm);}
  .btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius-sm); padding:7px 11px; font-size:12.5px; font-weight:500; white-space:nowrap;}
  .btn:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn.danger{color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger);}
  .btn.small{padding:4px 8px; font-size:11.5px; border-radius:6px;}

  .banner{display:flex; gap:10px; align-items:flex-start; background:var(--coral-soft); border:1px solid var(--coral); border-radius:var(--radius-md); padding:10px 12px; font-size:12.5px; margin-bottom:14px;}
  .banner b{color:var(--coral);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .filters input, .filters select{border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px; outline:none;}
  .filters input{min-width:220px;}
  .filters input:focus, .filters select:focus{border-color:var(--accent);}
  .filters label{font-size:12.5px; color:var(--ink-muted); display:flex; gap:6px; align-items:center;}

  .layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start;}
  @media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr);} }
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:14px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:13.5px; font-weight:700;}
  .panel-head .hint{font-size:11.5px; color:var(--ink-faint);}
  .panel-body{padding:10px 12px; overflow-x:auto;}
  .empty{padding:18px; text-align:center; color:var(--ink-faint); font-size:12.5px;}

  table.grid{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.grid th{text-align:left; font-size:11px; font-weight:600; color:var(--ink-faint); padding:0 6px 6px; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.grid td{padding:4px; vertical-align:middle; border-bottom:1px solid var(--border);}
  table.grid tr:last-child td{border-bottom:none;}
  table.grid tr.is-hidden td{opacity:.5;}
  table.grid input[type=text]{width:100%; min-width:70px; border:1px solid transparent; border-radius:6px; padding:6px 7px; background:var(--surface-2); outline:none;}
  table.grid input[type=text]:focus{background:var(--surface); border-color:var(--accent);}
  table.grid input.mono{font-family:var(--font-mono); font-size:11px;}
  table.grid input.dupe{border-color:var(--danger); background:var(--danger-soft);}
  table.grid .ro{padding:6px 7px; color:var(--ink); white-space:nowrap;}
  table.grid .ro.mono{font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);}
  table.grid .src{font-size:11px; color:var(--ink-muted); white-space:nowrap;}
  table.grid .tight{width:1%; white-space:nowrap;}
  .cell-flex{display:flex; gap:4px; align-items:center;}
  .pill{display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong);}

  .preview{padding:14px;}
  .vcard{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--surface);}
  .vcard .h{font-size:18px; font-weight:700; color:var(--accent-strong);}
  .vcard .r{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); margin-top:3px;}
  .vcard .n{font-size:11.5px; color:var(--ink-muted); margin-top:8px;}
  .vcard .f{display:flex; justify-content:space-between; margin-top:12px; font-size:11px; color:var(--ink-faint);}
  .vcard .f a{color:var(--accent); text-decoration:none;}
  .help{font-size:12px; color:var(--ink-muted); line-height:1.6; padding:0 14px 14px;}
  .help b{color:var(--ink);}

  .overlay{position:fixed; inset:0; background:rgba(10,16,14,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); max-width:560px; width:100%; padding:18px; max-height:85vh; overflow:auto;}
  .modal h3{font-size:15px; margin-bottom:8px;}
  .modal p{font-size:12.5px; color:var(--ink-muted); margin:0 0 10px;}
  .modal textarea{width:100%; min-height:160px; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11.5px; background:var(--surface-2);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:999px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>단어장 편집기</h1>
      <div class="sub">한글케어 단어장 — 상황 용어 표시 설정 · 단어장 전용 단어 추가</div>
      <div class="stats" id="stats"></div>
      <div class="status-line" id="statusLine"><span class="status-dot"></span><span id="statusText">불러오는 중…</span></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn" id="btnImportExcel" type="button">엑셀 불러오기</button>
        <button class="btn" id="btnImportJson" type="button">JSON 불러오기</button>
      </div>
      <div class="toolbar-group">
        <button class="btn" id="btnExportExcel" type="button">엑셀로 내보내기</button>
        <button class="btn" id="btnExportJson" type="button">JSON 내보내기</button>
      </div>
      <div class="toolbar-group">
        <button class="btn primary" id="btnAdd" type="button">+ 단어 추가</button>
      </div>
    </div>
  </header>

  <div id="banners"></div>

  <div class="filters">
    <input id="q" type="text" placeholder="한글·로마자·뜻 검색">
    <select id="groupFilter"></select>
    <label><input type="checkbox" id="showHidden" checked> 숨긴 용어도 보기</label>
  </div>

  <div class="layout">
    <div>
      <section class="panel">
        <div class="panel-head">
          <h2>단어장 전용 단어</h2>
          <span class="hint">학습 상황에 없는 단어를 단어장에만 추가합니다</span>
        </div>
        <div class="panel-body" id="customBody"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>상황 용어</h2>
          <span class="hint">단어 자체는 "실습내용 편집"에서 고칩니다 · 여기서는 분류·메모·표시만</span>
        </div>
        <div class="panel-body" id="lessonBody"></div>
      </section>
    </div>
    <aside>
      <section class="panel">
        <div class="panel-head"><h2>학습자 화면 미리보기</h2></div>
        <div class="preview" id="preview"><div class="empty">표에서 단어를 선택하세요</div></div>
        <div class="help">
          <b>적용 방식</b><br>
          학습자 <b>단어장</b> = 상황 용어(숨긴 것 제외) + 단어장 전용 단어.<br>
          <b>분류</b>를 붙이면 단어장 화면에 분류 필터가 생깁니다.<br>
          상황 용어와 한글이 같은 전용 단어는 상황 쪽이 우선합니다(빨간 칸).
        </div>
      </section>
    </aside>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" class="visually-hidden">
<input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" class="visually-hidden">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ==================================================================
   단어장 편집기 — 한글케어 단어장(/vocab) 내용 편집
   데이터: content/vocab.json = { custom: [단어장 전용 단어], lessonOverrides: { 용어id: {hidden,group,note} } }
   연결 방식 (실습내용 편집기와 같다)
   - ?host=hangulcare: 단일 파일판 hangulcare.html 안(iframe). 부모와 postMessage로 get/put.
   - 서버에서 열림: Next.js의 GET/PUT /api/vocab 에 자동 저장 (→ content/vocab.json)
   - file:// 로 따로 열림: 로컬 전용 모드 (JSON/엑셀 내보내기로 보관)
   ================================================================== */
(function(){
  "use strict";

  /* ---------- 백엔드 어댑터 ---------- */
  function restBackend(url){
    return {
      get: function(){ return fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); },
      put: function(cfg){
        return fetch(url, { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(cfg) })
          .then(function(r){ if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(b){ throw new Error(b.error || ("HTTP " + r.status)); }); });
      }
    };
  }
  function parentBackend(){
    var seq = 0, pending = {};
    window.addEventListener("message", function(e){
      var d = e.data;
      if(e.source !== window.parent || !d || d.hcVocab !== "res" || !pending[d.id]) return;
      var p = pending[d.id]; delete pending[d.id];
      if(d.ok) p.resolve(d.data); else p.reject(new Error(d.error || "저장 실패"));
    });
    function call(op, payload){
      return new Promise(function(resolve, reject){
        var id = ++seq; pending[id] = { resolve:resolve, reject:reject };
        window.parent.postMessage({ hcVocab:"req", id:id, op:op, payload:payload }, "*");
      });
    }
    return { get: function(){ return call("get"); }, put: function(cfg){ return call("put", cfg); } };
  }
  var backend = null;
  if(/[?&]host=hangulcare\b/.test(location.search) && window.parent !== window) backend = parentBackend();
  else if(location.protocol !== "file:") backend = restBackend("/api/vocab");

  /* ---------- 상태 ---------- */
  var lessonTerms = [];                 // [{id,hangul,romanization,glossEn,unitId,situationId,situationLabelKo,category}]
  var config = { custom: [], lessonOverrides: {} };
  var selected = null;                  // { kind:"custom"|"lesson", id }
  var saveTimer = null;

  /* ---------- 한글 도우미 (실습내용 편집기와 같은 로마자 근사치) ---------- */
  var CHO = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
  var JUNG = ["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
  var JONG = ["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
  function romanizeText(text){
    return String(text || "").trim().split(/\s+/).filter(Boolean).map(function(word){
      var out = [];
      Array.from(word).forEach(function(ch){
        var c = ch.codePointAt(0);
        if(c >= 0xAC00 && c <= 0xD7A3){
          var s = c - 0xAC00;
          out.push(CHO[Math.floor(s/588)] + JUNG[Math.floor((s%588)/28)] + JONG[s%28]);
        } else if(/[a-z0-9]/i.test(ch)) out.push(ch.toLowerCase());
      });
      return out.join("-");
    }).filter(Boolean).join(" ");
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function newId(){
    var used = new Set(config.custom.map(function(e){ return e.id; }).concat(lessonTerms.map(function(t){ return t.id; })));
    var i = config.custom.length + 1, id;
    do { id = "vocab-" + i++; } while(used.has(id));
    return id;
  }
  function override(id){ return config.lessonOverrides[id] || {}; }
  function setOverride(id, key, value){
    var o = Object.assign({}, override(id));
    if(value) o[key] = value; else delete o[key];
    if(Object.keys(o).length) config.lessonOverrides[id] = o; else delete config.lessonOverrides[id];
  }
  function lessonHanguls(){ var s = new Set(); lessonTerms.forEach(function(t){ s.add(t.hangul); }); return s; }
  function customDupes(){
    var lh = lessonHanguls(), seen = {}, dup = new Set();
    config.custom.forEach(function(e){
      var h = (e.hangul || "").trim(); if(!h) return;
      // 서버와 같은 규칙: 상황 용어와 겹치거나, 앞선 전용 단어와 겹치는 뒤쪽 단어는 표시되지 않는다.
      if(lh.has(h) || seen[h]) dup.add(e.id);
      seen[h] = true;
    });
    return dup;
  }
  function allGroups(){
    var s = new Set();
    config.custom.forEach(function(e){ if(e.group) s.add(e.group); });
    Object.keys(config.lessonOverrides).forEach(function(k){ var g = config.lessonOverrides[k].group; if(g) s.add(g); });
    return Array.from(s).sort(function(a,b){ return a.localeCompare(b, "ko"); });
  }

  /* ---------- 저장 ---------- */
  function setStatus(mode, text){
    var el = document.getElementById("statusLine");
    el.className = "status-line " + mode;
    document.getElementById("statusText").textContent = text;
  }
  function cleanConfig(){
    return {
      custom: config.custom.filter(function(e){ return (e.hangul || "").trim(); }).map(function(e){
        var o = { id:e.id, hangul:e.hangul.trim(), romanization:e.romanization || "", glossEn:e.glossEn || "" };
        if(e.group) o.group = e.group; if(e.note) o.note = e.note;
        return o;
      }),
      lessonOverrides: JSON.parse(JSON.stringify(config.lessonOverrides))
    };
  }
  function scheduleSave(){
    renderStats();
    if(!backend){ setStatus("offline", "로컬 전용 모드 — 내보내기로 저장하세요"); return; }
    clearTimeout(saveTimer);
    setStatus("saving", "저장 대기…");
    saveTimer = setTimeout(function(){
      setStatus("saving", "저장 중…");
      backend.put(cleanConfig()).then(function(){
        var t = new Date();
        setStatus("saved", "저장됨 · " + pad2(t.getHours()) + ":" + pad2(t.getMinutes()) + " · 학습자 단어장에 반영됨");
      }).catch(function(err){ setStatus("offline", "저장 실패 — " + err.message); });
    }, 600);
  }

  /* ---------- 렌더 ---------- */
  function matches(fields, group, hidden){
    var q = document.getElementById("q").value.trim().toLowerCase();
    var g = document.getElementById("groupFilter").value;
    if(!document.getElementById("showHidden").checked && hidden) return false;
    if(g === "__none__" && group) return false;
    if(g && g !== "__none__" && group !== g) return false;
    if(q && !fields.some(function(f){ return String(f || "").toLowerCase().indexOf(q) !== -1; })) return false;
    return true;
  }
  function renderStats(){
    var lh = lessonHanguls(), dup = customDupes();
    var hidden = lessonTerms.filter(function(t){ return override(t.id).hidden; }).length;
    var customShown = config.custom.filter(function(e){ return (e.hangul || "").trim() && !lh.has(e.hangul.trim()) && !dup.has(e.id); }).length;
    var total = lessonTerms.length - hidden + customShown;
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + total + '</b><span>단어장 표시</span></div>' +
      '<div class="stat"><b>' + lessonTerms.length + '</b><span>상황 용어</span></div>' +
      '<div class="stat"><b>' + config.custom.length + '</b><span>전용 단어</span></div>' +
      '<div class="stat"><b>' + hidden + '</b><span>숨김</span></div>' +
      '<div class="stat"><b>' + allGroups().length + '</b><span>분류</span></div>';
  }
  function renderGroupFilter(){
    var sel = document.getElementById("groupFilter"), cur = sel.value;
    sel.innerHTML = '<option value="">모든 분류</option><option value="__none__">분류 없음</option>' +
      allGroups().map(function(g){ return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join("");
    sel.value = cur;
    if(sel.value !== cur) sel.value = "";
    var dl = document.getElementById("groupList");
    if(!dl){ dl = document.createElement("datalist"); dl.id = "groupList"; document.body.appendChild(dl); }
    dl.innerHTML = allGroups().map(function(g){ return '<option value="' + esc(g) + '">'; }).join("");
  }
  function renderCustom(){
    var dup = customDupes();
    var rows = config.custom.filter(function(e){ return matches([e.hangul, e.romanization, e.glossEn, e.note, e.group], e.group, false); });
    var el = document.getElementById("customBody");
    if(!rows.length){
      el.innerHTML = '<div class="empty">' + (config.custom.length ? "조건에 맞는 단어가 없습니다." : "아직 추가한 단어가 없습니다. 오른쪽 위 \"+ 단어 추가\"를 누르세요.") + '</div>';
      return;
    }
    el.innerHTML = '<table class="grid"><thead><tr><th>한글</th><th>로마자</th><th>영어 뜻</th><th>분류</th><th>메모</th><th></th></tr></thead><tbody>' +
      rows.map(function(e){
        return '<tr data-kind="custom" data-id="' + esc(e.id) + '">' +
          '<td><input type="text" data-f="hangul" value="' + esc(e.hangul) + '"' + (dup.has(e.id) ? ' class="dupe" title="상황 용어나 다른 전용 단어와 한글이 같아 단어장에 표시되지 않습니다"' : "") + '></td>' +
          '<td><div class="cell-flex"><input type="text" class="mono" data-f="romanization" value="' + esc(e.romanization) + '"><button class="btn small" data-act="roman" type="button" title="로마자 자동 채우기">자동</button></div></td>' +
          '<td><input type="text" data-f="glossEn" value="' + esc(e.glossEn) + '"></td>' +
          '<td><input type="text" data-f="group" list="groupList" value="' + esc(e.group || "") + '"></td>' +
          '<td><input type="text" data-f="note" value="' + esc(e.note || "") + '"></td>' +
          '<td class="tight"><button class="btn small danger" data-act="del" type="button">삭제</button></td>' +
        '</tr>';
      }).join("") + '</tbody></table>';
  }
  function renderLesson(){
    var el = document.getElementById("lessonBody");
    if(!lessonTerms.length){
      el.innerHTML = '<div class="empty">' + (backend ? "상황 용어가 없습니다." : "로컬 전용 모드에서는 상황 용어를 불러올 수 없습니다.") + '</div>';
      return;
    }
    var rows = lessonTerms.filter(function(t){
      var o = override(t.id);
      return matches([t.hangul, t.romanization, t.glossEn, o.note, o.group, t.situationLabelKo], o.group, o.hidden);
    });
    if(!rows.length){ el.innerHTML = '<div class="empty">조건에 맞는 용어가 없습니다.</div>'; return; }
    el.innerHTML = '<table class="grid"><thead><tr><th>표시</th><th>한글</th><th>로마자</th><th>영어 뜻</th><th>출처 상황</th><th>분류</th><th>메모</th></tr></thead><tbody>' +
      rows.map(function(t){
        var o = override(t.id);
        return '<tr data-kind="lesson" data-id="' + esc(t.id) + '"' + (o.hidden ? ' class="is-hidden"' : "") + '>' +
          '<td class="tight"><input type="checkbox" data-f="visible"' + (o.hidden ? "" : " checked") + ' title="학습자 단어장에 표시"></td>' +
          '<td><div class="ro"><b>' + esc(t.hangul) + '</b></div></td>' +
          '<td><div class="ro mono">' + esc(t.romanization) + '</div></td>' +
          '<td><div class="ro">' + esc(t.glossEn) + '</div></td>' +
          '<td class="src"><span class="pill">' + (t.category === "basic" ? "기초" : "실습") + '</span> ' + esc(t.situationLabelKo) + '</td>' +
          '<td><input type="text" data-f="group" list="groupList" value="' + esc(o.group || "") + '"></td>' +
          '<td><input type="text" data-f="note" value="' + esc(o.note || "") + '"></td>' +
        '</tr>';
      }).join("") + '</tbody></table>';
  }
  function renderPreview(){
    var el = document.getElementById("preview");
    var item = null, foot = "";
    if(selected && selected.kind === "custom"){
      var e = config.custom.find(function(x){ return x.id === selected.id; });
      if(e){ item = { hangul:e.hangul, romanization:e.romanization, glossEn:e.glossEn, note:e.note }; foot = '<span>' + esc(e.group || "단어장 단어") + '</span>'; }
    } else if(selected && selected.kind === "lesson"){
      var t = lessonTerms.find(function(x){ return x.id === selected.id; });
      if(t){
        var o = override(t.id);
        item = { hangul:t.hangul, romanization:t.romanization, glossEn:t.glossEn, note:o.note, hidden:o.hidden };
        foot = '<a href="#" onclick="return false">' + esc(t.situationLabelKo) + ' →</a>';
      }
    }
    if(!item){ el.innerHTML = '<div class="empty">표에서 단어를 선택하세요</div>'; return; }
    el.innerHTML = (item.hidden ? '<p style="font-size:11.5px;color:var(--danger);margin:0 0 8px;">숨김 — 학습자 단어장에 나타나지 않습니다</p>' : "") +
      '<div class="vcard"><div class="h">' + esc(item.hangul || "(한글 없음)") + '</div>' +
      '<div class="r">[' + esc(item.romanization) + '] · ' + esc(item.glossEn) + '</div>' +
      (item.note ? '<div class="n">' + esc(item.note) + '</div>' : "") +
      '<div class="f"><span>아직</span>' + foot + '</div></div>';
  }
  function renderAll(){ renderGroupFilter(); renderStats(); renderCustom(); renderLesson(); renderPreview(); renderBanners(); }
  function renderBanners(){
    document.getElementById("banners").innerHTML = backend ? "" :
      '<div class="banner"><div><b>로컬 전용 모드.</b> 한글케어 서버/앱 밖에서 파일만 열어 자동 저장이 꺼져 있어요. ' +
      '관리자 메뉴 "단어장 편집"에서 열면 학습자 단어장에 바로 반영됩니다. 여기서 편집한 내용은 JSON/엑셀로 내보내 보관하세요.</div></div>';
  }

  /* ---------- 편집 이벤트 ---------- */
  function rowOf(el){ var tr = el.closest("tr[data-kind]"); return tr ? { kind: tr.getAttribute("data-kind"), id: tr.getAttribute("data-id"), tr: tr } : null; }
  document.addEventListener("input", function(ev){
    var t = ev.target, r = rowOf(t), f = t.getAttribute && t.getAttribute("data-f");
    if(!r || !f || f === "visible") return;
    if(r.kind === "custom"){
      var e = config.custom.find(function(x){ return x.id === r.id; }); if(!e) return;
      e[f] = t.value;
      if(f === "hangul"){
        var dup = customDupes();
        document.querySelectorAll('#customBody tr[data-kind]').forEach(function(tr){
          var inp = tr.querySelector('input[data-f="hangul"]');
          if(inp) inp.classList.toggle("dupe", dup.has(tr.getAttribute("data-id")));
        });
      }
    } else {
      setOverride(r.id, f, t.value.trim() ? t.value : "");
    }
    selected = { kind:r.kind, id:r.id };
    renderPreview();
    scheduleSave();
  });
  document.addEventListener("change", function(ev){
    var t = ev.target, r = rowOf(t);
    if(r && t.getAttribute("data-f") === "visible"){
      setOverride(r.id, "hidden", !t.checked);
      r.tr.classList.toggle("is-hidden", !t.checked);
      selected = { kind:"lesson", id:r.id };
      renderPreview(); scheduleSave();
    }
    if(r && t.getAttribute("data-f") === "group") renderGroupFilter();
  });
  document.addEventListener("focusin", function(ev){
    var r = rowOf(ev.target);
    if(r){ selected = { kind:r.kind, id:r.id }; renderPreview(); }
  });
  document.addEventListener("click", function(ev){
    var b = ev.target.closest && ev.target.closest("[data-act]"); if(!b) return;
    var r = rowOf(b); if(!r) return;
    var act = b.getAttribute("data-act");
    if(act === "roman"){
      var e = config.custom.find(function(x){ return x.id === r.id; }); if(!e) return;
      e.romanization = romanizeText(e.hangul);
      r.tr.querySelector('input[data-f="romanization"]').value = e.romanization;
      renderPreview(); scheduleSave();
    } else if(act === "del"){
      config.custom = config.custom.filter(function(x){ return x.id !== r.id; });
      if(selected && selected.id === r.id) selected = null;
      renderAll(); scheduleSave(); toast("단어를 삭제했어요");
    }
  });
  ["q", "groupFilter", "showHidden"].forEach(function(id){
    document.getElementById(id).addEventListener(id === "q" ? "input" : "change", function(){ renderCustom(); renderLesson(); });
  });
  document.getElementById("btnAdd").addEventListener("click", function(){
    var e = { id:newId(), hangul:"", romanization:"", glossEn:"" };
    var g = document.getElementById("groupFilter").value;
    if(g && g !== "__none__") e.group = g;
    config.custom.unshift(e);
    document.getElementById("q").value = "";
    selected = { kind:"custom", id:e.id };
    renderAll();
    var inp = document.querySelector('#customBody tr[data-id="' + e.id + '"] input[data-f="hangul"]');
    if(inp) inp.focus();
  });

  /* ---------- 불러오기 / 내보내기 ---------- */
  var toastTimer;
  function toast(msg){
    var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }
  function download(name, blob){
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
  function applyImportedConfig(data, replace){
    if(!data || !Array.isArray(data.custom)) throw new Error("{ custom: [...], lessonOverrides: {...} } 형식이 아닙니다");
    var incoming = data.custom.filter(function(e){ return e && e.hangul; });
    if(replace){
      config = { custom: [], lessonOverrides: data.lessonOverrides && typeof data.lessonOverrides === "object" ? data.lessonOverrides : {} };
    }
    var ids = new Set(config.custom.map(function(e){ return e.id; }));
    incoming.forEach(function(e){
      var id = e.id && !ids.has(e.id) ? String(e.id) : newId();
      ids.add(id);
      config.custom.push({ id:id, hangul:String(e.hangul), romanization:String(e.romanization || romanizeText(e.hangul)), glossEn:String(e.glossEn || ""), group:e.group ? String(e.group) : undefined, note:e.note ? String(e.note) : undefined });
    });
    renderAll(); scheduleSave();
  }
  document.getElementById("btnExportJson").addEventListener("click", function(){
    download("vocab.json", new Blob([JSON.stringify(cleanConfig(), null, 2) + "\n"], { type:"application/json" }));
  });
  document.getElementById("btnImportJson").addEventListener("click", function(){
    document.getElementById("modalRoot").innerHTML =
      '<div class="overlay" id="overlayEl"><div class="modal"><h3>JSON 불러오기</h3>' +
      '<p>vocab.json 형식(<code>{ "custom": [...], "lessonOverrides": {...} }</code>)을 붙여넣거나 파일을 선택하세요. 지금 설정을 <b>교체</b>합니다.</p>' +
      '<textarea id="jsonIn"></textarea><div class="modal-actions">' +
      '<button class="btn" id="mCancel" type="button">취소</button><button class="btn" id="mFile" type="button">파일 선택…</button>' +
      '<button class="btn primary" id="mApply" type="button">교체하기</button></div></div></div>';
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("overlayEl").onclick = function(e){ if(e.target.id === "overlayEl") closeModal(); };
    document.getElementById("mFile").onclick = function(){ document.getElementById("fileJson").click(); };
    document.getElementById("mApply").onclick = function(){
      try { applyImportedConfig(JSON.parse(document.getElementById("jsonIn").value), true); closeModal(); toast("JSON을 불러왔어요"); }
      catch(err){ toast("불러오기 실패 — " + err.message); }
    };
  });
  document.getElementById("fileJson").addEventListener("change", function(ev){
    var f = ev.target.files[0]; if(!f) return;
    f.text().then(function(text){
      try { applyImportedConfig(JSON.parse(text), true); closeModal(); toast("JSON을 불러왔어요"); }
      catch(err){ toast("불러오기 실패 — " + err.message); }
    });
    ev.target.value = "";
  });
  document.getElementById("btnExportExcel").addEventListener("click", function(){
    if(!window.XLSX){ toast("엑셀 라이브러리를 불러오지 못했어요 (네트워크 확인)"); return; }
    var wb = XLSX.utils.book_new();
    var custom = cleanConfig().custom.map(function(e){ return { id:e.id, hangul:e.hangul, romanization:e.romanization, glossEn:e.glossEn, group:e.group || "", note:e.note || "" }; });
    if(!custom.length) custom = [{ id:"", hangul:"", romanization:"", glossEn:"", group:"", note:"" }];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custom), "CustomWords");
    var lesson = lessonTerms.map(function(t){ var o = override(t.id); return { id:t.id, hangul:t.hangul, situation:t.situationLabelKo, visible:o.hidden ? "N" : "Y", group:o.group || "", note:o.note || "" }; });
    if(lesson.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lesson), "LessonTerms");
    download("hancare-vocab.xlsx", new Blob([XLSX.write(wb, { bookType:"xlsx", type:"array" })], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  });
  document.getElementById("btnImportExcel").addEventListener("click", function(){ document.getElementById("fileExcel").click(); });
  document.getElementById("fileExcel").addEventListener("change", function(ev){
    var f = ev.target.files[0]; if(!f) return;
    if(!window.XLSX){ toast("엑셀 라이브러리를 불러오지 못했어요 (네트워크 확인)"); return; }
    f.arrayBuffer().then(function(buf){
      try{
        var wb = XLSX.read(buf, { type:"array" });
        // CustomWords 시트(없으면 첫 시트)의 단어를 추가. 열: hangul, romanization, glossEn, group, note (한글 머리글도 허용)
        var ws = wb.Sheets["CustomWords"] || wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
        var pick = function(r, keys){ for(var i=0;i<keys.length;i++){ if(r[keys[i]] !== undefined && r[keys[i]] !== "") return String(r[keys[i]]); } return ""; };
        var existing = new Set(config.custom.map(function(e){ return e.hangul; }));
        var add = [], updated = 0;
        rows.forEach(function(r){
          var h = pick(r, ["hangul","한글","단어"]).trim(); if(!h) return;
          var entry = { id: pick(r, ["id"]), hangul:h, romanization: pick(r, ["romanization","로마자"]), glossEn: pick(r, ["glossEn","영어","뜻","영어 뜻"]), group: pick(r, ["group","분류"]), note: pick(r, ["note","메모"]) };
          if(existing.has(h)){
            var cur = config.custom.find(function(e){ return e.hangul === h; });
            ["romanization","glossEn","group","note"].forEach(function(k){ if(entry[k]) cur[k] = entry[k]; });
            updated++;
          } else { existing.add(h); add.push(entry); }
        });
        // LessonTerms 시트가 있으면 표시/분류/메모도 반영
        var lessonWs = wb.Sheets["LessonTerms"], lessonCount = 0;
        if(lessonWs){
          var known = new Set(lessonTerms.map(function(t){ return t.id; }));
          XLSX.utils.sheet_to_json(lessonWs, { defval:"" }).forEach(function(r){
            var id = String(r.id || ""); if(!known.has(id)) return;
            setOverride(id, "hidden", String(r.visible).toUpperCase() === "N");
            setOverride(id, "group", String(r.group || ""));
            setOverride(id, "note", String(r.note || ""));
            lessonCount++;
          });
        }
        applyImportedConfig({ custom: add }, false);
        toast("엑셀 불러오기 — 새 단어 " + add.length + "개, 갱신 " + updated + "개" + (lessonCount ? ", 상황 용어 " + lessonCount + "개" : ""));
      } catch(err){ toast("엑셀 불러오기 실패 — " + err.message); }
    });
    ev.target.value = "";
  });

  /* ---------- 시작 ---------- */
  function start(){
    if(!backend){ renderAll(); setStatus("offline", "로컬 전용 모드 — 내보내기로 저장하세요"); return; }
    backend.get().then(function(data){
      lessonTerms = (data && Array.isArray(data.lessonTerms) ? data.lessonTerms : []).slice().sort(function(a,b){ return a.hangul.localeCompare(b.hangul, "ko"); });
      var c = data && data.config || {};
      config = { custom: Array.isArray(c.custom) ? c.custom : [], lessonOverrides: c.lessonOverrides && typeof c.lessonOverrides === "object" ? c.lessonOverrides : {} };
      renderAll();
      setStatus("saved", "연결됨 · 자동 저장 켜짐");
    }).catch(function(err){
      backend = null;
      renderAll();
      setStatus("offline", "서버 연결 실패 — 로컬 전용 모드 (" + err.message + ")");
    });
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</body>
</html>
