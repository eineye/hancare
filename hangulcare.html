<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="로그인부터 진도관리, 기초·실습한글 학습, XR실습, 관리자 화면까지 앱 전체를 브라우저에서 바로 테스트하는 독립 프로토타입">
<title>HangulCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9E5DC;
    --card: #ffffff;
    --card-border: #D9D3C7;
    --line: #D9D3C7;
    --text: #12241F;
    --text-muted: #6B7A75;
    --muted: #6B7A75;
    --faint: #94A19C;
    --brand: #0E7C66;
    --brand-dark: #12241F;
    --brand-light: #7FBFAD;
    --brand-soft: #F1F6F3;
    --chip: #F1F6F3;
    --chip-border: #DCE8E2;
    --chipBorder: #DCE8E2;
    --panel: #F4F1EA;
    --chip-bg: #F4F1EA;
    --warn-bg: #FBF1EC;
    --warnBg: #FBF1EC;
    --warn-text: #B4552F;
    --warn: #B4552F;
    --warn-border: #F0DDD2;
    --warnBorder: #F0DDD2;
    --warn-accent: #E07B45;
    --warnAccent: #E07B45;
    --good-bg: #F1F6F3;
    --good-text: #0E7C66;
    --danger-bg: #FBF1EC;
    --danger-text: #B4552F;
    --shadow: none;
    --monitor-bg: #07140f;
    --monitor-grid: rgba(124,255,178,.10);
    --monitor-fg: #7cffb2;
    --monitor-dim: #3d8a63;
    --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --font-mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  h1,h2,h3 { text-wrap: balance; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .app { min-height: 100vh; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; }
  .btn { border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: .86rem; border: 1px solid transparent; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: #0a5c4c; }
  .btn-ghost { background: var(--card); border-color: var(--card-border); color: var(--brand-dark); }
  .btn-ghost:hover { border-color: var(--brand); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: .68rem; font-weight: 600; }
  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 10px 14px; font-size: .8rem; line-height: 1.55; }
  .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--brand); }
  .backlink { display: inline-block; margin-top: 4px; font-size: .78rem; font-weight: 600; color: var(--brand); text-decoration: none; }
  .backlink:hover { text-decoration: underline; }

  /* ---------------- app shell (topbar + sidebar) ---------------- */
  .shellTop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; }
  .shellTop .brandMark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--brand-dark); font-weight: 700; font-size: .95rem; flex: none; }
  .shellTop .brandMark img { width: 32px; height: 32px; border-radius: 8px; background: #fff; object-fit: contain; }
  .langBtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: .78rem; background: var(--card); color: var(--brand-dark); white-space: nowrap; }
  .langBtn:hover { background: var(--panel); }
  .langMenu { position: absolute; top: 46px; right: 0; z-index: 50; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; min-width: 220px; box-shadow: 0 12px 28px rgba(18,36,31,.14); }
  .langMenu .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: .8rem; cursor: pointer; }
  .langMenu .row:hover { background: var(--panel); }
  .langMenu .row.active { background: var(--brand-dark); color: #fff; }
  .bellBtn { position: relative; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: .68rem; color: var(--brand-dark); text-decoration: none; flex: none; }
  .bellBtn:hover { background: var(--panel); }
  .bellBtn .badge { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 999px; background: var(--warn-accent); color: #fff; font-size: .6rem; display: flex; align-items: center; justify-content: center; }
  .profileBtn { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--brand-dark); padding-left: 4px; flex: none; }
  .avatarCircle { width: 34px; height: 34px; border-radius: 999px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .76rem; flex: none; }
  .profileText b { display: block; font-size: .78rem; font-weight: 600; }
  .profileText small { display: block; font-size: .66rem; color: var(--faint); }
  .mobileNav { display: none; gap: 6px; overflow-x: auto; padding: 0 14px 10px; }
  .navPill { flex: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .78rem; color: var(--brand-dark); text-decoration: none; }
  .navPill.active { background: var(--brand-dark); color: #fff; border-color: var(--brand-dark); }
  .shellBody { max-width: 1440px; margin: 0 auto; display: flex; align-items: flex-start; gap: 20px; padding: 18px 16px; }
  .shellSide { width: 220px; flex: none; position: sticky; top: 80px; display: flex; flex-direction: column; gap: 18px; }
  .navItem { display: flex; align-items: center; gap: 9px; border-radius: 10px; padding: 9px 12px; text-decoration: none; color: var(--brand-dark); font-size: .85rem; font-weight: 500; }
  .navItem:hover { background: rgba(217,211,199,.4); }
  .navItem.active { background: var(--brand-dark); color: #fff; }
  .navItem .bar { width: 3px; height: 14px; border-radius: 2px; background: transparent; flex: none; }
  .navItem.active .bar { background: #4FBF9B; }
  .sideCard { background: var(--brand-dark); color: #fff; border-radius: 16px; padding: 16px; }
  .sideCard .lbl { font-size: .68rem; font-weight: 700; letter-spacing: .05em; color: var(--brand-light); }
  .sideCard .big { margin-top: 10px; font-size: .86rem; font-weight: 700; line-height: 1.5; }
  .sideCard .cta { margin-top: 12px; display: block; text-align: center; background: #fff; color: var(--brand); border-radius: 9px; padding: 10px; font-size: .78rem; font-weight: 700; text-decoration: none; }
  .sideCard .logoutBtn { margin-top: 8px; width: 100%; border-radius: 9px; padding: 10px; font-size: .78rem; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; }
  .shellMain { flex: 1; min-width: 0; }
  @media (max-width: 980px) { .shellSide { display: none; } .mobileNav { display: flex; } }

  /* ---------------- login (split screen) ---------------- */
  .loginSplit { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
  @media (min-width: 980px) { .loginSplit { grid-template-columns: minmax(0,1fr) minmax(0,1.05fr); } }
  .loginHero { background: var(--brand-dark); color: #fff; padding: 48px 40px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
  .loginHero h1 { font-size: 2rem; font-weight: 900; line-height: 1.25; letter-spacing: -.02em; }
  .loginHero .sub { margin-top: 14px; color: rgba(255,255,255,.7); font-size: .92rem; line-height: 1.65; max-width: 440px; }
  .loginHero .steps { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .loginHero .steps div { display: flex; align-items: center; gap: 10px; font-size: .84rem; color: rgba(255,255,255,.85); }
  .loginHero .steps span { width: 24px; height: 24px; border-radius: 999px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-size: .7rem; flex: none; }
  .loginFormWrap { display: flex; align-items: center; justify-content: center; padding: 48px 28px; }
  .loginFormCard { width: min(420px,100%); }

  /* ---------------- form fields / login demo box ---------------- */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .74rem; color: var(--text-muted); margin-bottom: 5px; }
  .field input { width: 100%; border: 1px solid var(--card-border); border-radius: 11px; padding: 11px 14px; background: var(--card); color: var(--text); }
  .demoBox { margin-top: 18px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card); padding: 14px; font-size: .78rem; color: var(--muted); }
  .demoBox p { margin: 0 0 8px; font-weight: 500; color: var(--brand-dark); }
  .demoBox .row { display: flex; gap: 8px; }
  .demoBox button { flex: 1; }
  .errMsg { color: var(--warn); font-size: .78rem; margin: 4px 0 10px; }

  /* ---------------- hero / widgets (home) ---------------- */
  .heroCard { background: var(--brand-dark); color: #fff; border-radius: 18px; padding: 28px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .heroStat { min-width: 104px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 14px 16px; }
  .heroStat b { display: block; font-size: 1.3rem; font-weight: 900; }
  .heroStat small { display: block; margin-top: 3px; font-size: .66rem; color: rgba(255,255,255,.65); }
  .widgetGrid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 16px; margin-top: 16px; }
  .barChart { display: flex; align-items: flex-end; gap: 8px; }
  .barChart .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
  .barChart .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--chip-border); }
  .barChart .bar.hi { background: var(--brand); }

  /* ---------------- stat tiles ---------------- */
  .statGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
  .statTile { text-align: center; padding: 14px; }
  .statTile p:first-child { font-size: .72rem; color: var(--text-muted); }
  .statTile p:last-child { margin-top: 6px; font-weight: 700; font-family: var(--font-mono); font-size: 1.1rem; }

  /* ---------------- course sections ---------------- */
  .sectionHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .sectionHead h2 { font-size: 1rem; color: var(--brand-dark); }
  .itemGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; }
  .itemBtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card); font-weight: 600; font-size: .86rem; color: var(--brand-dark); text-decoration: none; }
  .itemBtn:hover { border-color: var(--brand); background: var(--chip); }
  .itemBtn.disabled { color: var(--faint); background: var(--panel); cursor: default; }
  .itemBtn.disabled:hover { border-color: var(--card-border); background: var(--panel); }

  /* ---------------- lesson screen ---------------- */
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .tagRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { background: var(--chip); border: 1px solid var(--chip-border); color: var(--brand); border-radius: 999px; padding: 5px 12px; font-size: .72rem; font-weight: 500; }
  .tag.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }

  .termGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 8px; margin-top: 12px; }
  .termCard { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--card-border); border-radius: 12px; padding: 11px 13px; }
  .termCard .word { font-weight: 700; color: var(--brand-dark); }
  .termCard .rom { font-size: .72rem; color: var(--text-muted); }
  .playBtn { flex: none; width: 30px; height: 30px; border-radius: 999px; border: none; background: var(--chip); color: var(--brand); }
  .playBtn:hover { background: var(--brand); color: #fff; }

  .repeatCard { background: var(--brand-dark); color: #fff; border-radius: 16px; padding: 18px; }
  .syllables { display: flex; flex-wrap: wrap; gap: 4px; font-size: 1.7rem; font-weight: 700; }
  .syllables span.pending { color: #fff; }
  .syllables span.good { color: #6ee7a4; }
  .syllables span.mid { color: #fcd34d; }
  .syllables span.bad { color: #fca5a5; }
  .recordBtn { margin-top: 14px; border-radius: 999px; padding: 10px 22px; font-weight: 700; font-size: .86rem; border: none; }
  .recordBtn.idle { background: var(--brand); color: #fff; }
  .recordBtn.recording { background: var(--warn-accent); color: #fff; }

  .avatarCard { background: var(--brand); color: #fff; border-radius: 16px; padding: 16px; }
  .avatarFace { aspect-ratio: 4/3; border-radius: 12px; background: rgba(10,31,24,.4); display: flex; align-items: center; justify-content: center; }
  .avatarFace svg { width: 62%; height: 62%; }
  @keyframes avatarPulse { 0%,100%{opacity:.25;} 50%{opacity:.6;} }
  @media (prefers-reduced-motion: reduce) { .avatarFace svg circle[stroke] { animation: none !important; } }

  .scoreCircle { width: 68px; height: 68px; border-radius: 999px; border: 4px solid var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; color: var(--brand-dark); }
  .barTrack { height: 6px; border-radius: 999px; background: var(--panel); margin-top: 4px; }
  .barFill { height: 6px; border-radius: 999px; background: var(--brand); }
  .chip-syl { border-radius: 8px; padding: 5px 7px; font-size: .68rem; font-weight: 700; text-align: center; }

  .feedbackItem { border-radius: 10px; padding: 10px 12px; font-size: .82rem; }
  .feedbackItem.warning { background: var(--warn-bg); color: var(--warn-text); }
  .feedbackItem.success { background: var(--good-bg); color: var(--good-text); }

  .chatMsg { max-width: 85%; border-radius: 12px; padding: 8px 11px; font-size: .84rem; }
  .chatMsg.user { margin-left: auto; background: var(--brand-dark); color: #fff; }
  .chatMsg.assistant { background: var(--panel); color: var(--brand-dark); }

  /* ---------------- XR viewport ---------------- */
  .viewport { position: relative; aspect-ratio: 16/10; overflow: hidden; border-radius: 16px; background: var(--monitor-bg);
    background-image: linear-gradient(var(--monitor-grid) 1px, transparent 1px), linear-gradient(90deg, var(--monitor-grid) 1px, transparent 1px);
    background-size: 28px 28px; }
  .viewport .vpLabel { position: absolute; top: 12px; left: 14px; font-size: .62rem; letter-spacing: .07em; color: var(--monitor-dim); border: 1px dashed var(--monitor-dim); padding: 3px 7px; border-radius: 8px; }
  .viewport svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .monitorPanel { position: absolute; top: 12px; right: 12px; width: min(58%,220px); background: rgba(7,20,15,.82); border: 1px solid var(--monitor-dim); border-radius: 10px; padding: 9px 11px; color: var(--monitor-fg); }
  .monitorPanel .lbl { font-size: .6rem; letter-spacing: .06em; color: var(--monitor-dim); margin-bottom: 3px; }
  .monitorPanel .reading { font-family: var(--font-mono); font-size: .82rem; min-height: 2.2em; }
  .monitorPanel .log { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(124,255,178,.18); max-height: 76px; overflow-y: auto; }
  .monitorPanel .log div { font-family: var(--font-mono); font-size: .64rem; color: var(--monitor-dim); margin-bottom: 2px; }
  .monitorPanel .log strong { color: var(--monitor-fg); font-weight: 500; }
  .dialogueBubble { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 440px; background: rgba(255,255,255,.96); color: var(--brand-dark); border-radius: 12px; padding: 11px 13px; }
  .dialogueBubble .who { font-weight: 700; font-size: .8rem; }
  .dialogueBubble .say { font-size: .84rem; margin-top: 2px; }
  .dialogueBubble .sayEn { font-size: .72rem; color: var(--text-muted); margin-top: 2px; }
  .hint { position: absolute; left: 12px; bottom: 12px; color: var(--monitor-fg); font-family: var(--font-mono); font-size: .72rem; background: rgba(7,20,15,.7); padding: 7px 11px; border-radius: 9px; border: 1px solid var(--monitor-dim); }
  .rail { display: flex; flex-direction: column; gap: 8px; }
  .railBtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border-radius: 12px; padding: 10px 13px; border: 1px solid var(--card-border); background: var(--card); font-weight: 600; font-size: .84rem; color: var(--brand-dark); }
  .railBtn:hover { border-color: var(--brand); }
  .railBtn.start { background: var(--brand); color: #fff; border-color: var(--brand); }
  .railBtn.started { background: var(--good-bg); color: var(--good-text); }
  .railBtn.submit { background: var(--brand-dark); color: #fff; }
  .railBtn:disabled { opacity: .45; cursor: not-allowed; }

  .modGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; margin-top: 12px; }
  .modCard { display: flex; flex-direction: column; gap: 7px; padding: 14px; text-align: left; text-decoration: none; color: inherit; }
  .modCard:hover { border-color: var(--brand); }
  .modCard .top { display: flex; align-items: center; gap: 8px; }
  .modCard .order { width: 28px; height: 28px; border-radius: 8px; background: var(--chip); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .82rem; flex: none; }

  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th { text-align: left; font-size: .72rem; color: var(--faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }

  .modalMask { position: fixed; inset: 0; background: rgba(18,36,31,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  .modal { width: min(440px,100%); background: var(--card); border-radius: 16px; padding: 18px; max-height: 84vh; overflow-y: auto; position: relative; }
  .modal.wide { width: min(1040px,96vw); max-height: min(640px,80vh); }
  .modalCloseX { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: none; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 1rem; cursor: pointer; line-height: 1; }
  .modalGrid { display: flex; flex-wrap: wrap; gap: 16px; }
  .modalGrid .col-left { flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; }
  .modalGrid .col-right { flex: 1 1 260px; }

  .mediMask { position: fixed; inset: 0; background: rgba(18,36,31,.65); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 40; }
  .mediPanel { width: min(1400px,96vw); height: 94vh; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .mediHeader { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--card-border); font-weight: 700; color: var(--brand-dark); font-size: .9rem; }
  .mediClose { width: 30px; height: 30px; border: none; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 1rem; cursor: pointer; line-height: 1; }
  .mediPanel iframe { flex: 1; border: 0; width: 100%; }

  /* ---------------- vocab / journal / notices / settings / admin-alerts ---------------- */
  .vocabCard { border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 16px; background: var(--card); }
  .tabPill { border-radius: 999px; padding: 8px 14px; font-size: .78rem; border: 1px solid var(--card-border); background: var(--card); color: var(--brand-dark); }
  .tabPill.active { background: var(--brand-dark); color: #fff; border-color: var(--brand-dark); }
  .journalCard { border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; background: var(--card); }
  .toggle { width: 40px; height: 22px; border-radius: 999px; position: relative; flex: none; border: none; }
  .toggle .knob { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 999px; background: #fff; }

  /* ---------------- 영상학습 (video) ---------------- */
  .vidGrid { display: grid; grid-template-columns: minmax(0,1fr) 380px; grid-template-areas: "main qa" "script qa"; gap: 14px; margin-top: 14px; align-items: start; }
  .vidMain { grid-area: main; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .vidQa { grid-area: qa; position: sticky; top: 76px; height: calc(100vh - 100px); min-height: 440px; display: flex; flex-direction: column; padding: 18px; }
  .vidScript { grid-area: script; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  @media (max-width: 980px) {
    .vidGrid { grid-template-columns: 1fr; grid-template-areas: "main" "qa" "script"; }
    .vidQa { position: static; height: auto; }
  }
  .vidScreen { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 16px; overflow: hidden; background: var(--brand-dark); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .vidScreen video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }

  /* ============================== STORAGE ============================== */
  function ls() {
    try { localStorage.setItem("__t__", "1"); localStorage.removeItem("__t__"); return localStorage; }
    catch (e) {
      var mem = {};
      return { getItem: function (k) { return mem[k] || null; }, setItem: function (k, v) { mem[k] = v; }, removeItem: function (k) { delete mem[k]; } };
    }
  }
  var STORE = ls();
  function readJSON(key, fallback) { try { var v = STORE.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function writeJSON(key, val) { try { STORE.setItem(key, JSON.stringify(val)); } catch (e) {} }

  /* ---- 실습내용(라이브러리): 관리자 "실습내용 편집"에서 고친 유닛을 이 브라우저에 보관해
     위 기본 콘텐츠 대신 쓴다. 편집기(public/hancare-library-editor.html)와는 postMessage로 연결. */
  var LIBRARY_KEY = "hc-library-units";
  function applyLibrary(units) {
    var basic = units.filter(function (u) { return u.category === "basic"; });
    var practice = units.filter(function (u) { return u.category !== "basic"; });
    // 화면 곳곳이 각 분류의 첫 유닛을 전제로 하므로, 한 분류가 비면 기본 콘텐츠를 쓴다.
    BASIC_UNITS = basic.length ? basic : DEFAULT_BASIC_UNITS;
    PRACTICE_UNITS = practice.length ? practice : DEFAULT_PRACTICE_UNITS;
    ALL_UNITS = BASIC_UNITS.concat(PRACTICE_UNITS);
  }
  function getLibraryUnits() {
    var saved = readJSON(LIBRARY_KEY, null);
    return Array.isArray(saved) ? saved : DEFAULT_BASIC_UNITS.concat(DEFAULT_PRACTICE_UNITS);
  }
  function setLibraryUnits(units) {
    writeJSON(LIBRARY_KEY, units);
    applyLibrary(units);
  }
  if (Array.isArray(readJSON(LIBRARY_KEY, null))) applyLibrary(getLibraryUnits());
  window.addEventListener("message", function (e) {
    var frame = document.getElementById("libraryEditorFrame");
    var d = e.data;
    if (!frame || e.source !== frame.contentWindow || !d || d.hcLib !== "req") return;
    var reply = function (ok, data, error) { e.source.postMessage({ hcLib: "res", id: d.id, ok: ok, data: data, error: error }, "*"); };
    var auth = getAuth();
    if (!auth || auth.role !== "admin") return reply(false, null, "관리자만 편집할 수 있습니다.");
    try {
      var units = getLibraryUnits();
      if (d.op === "list") return reply(true, units);
      if (d.op === "save") {
        var u = d.payload || {};
        if (!u.id || (u.category !== "basic" && u.category !== "practice") || !Array.isArray(u.situations)) {
          return reply(false, null, "유닛 형식이 올바르지 않습니다.");
        }
        var clean = { id: u.id, category: u.category, titleKo: u.titleKo, titleEn: u.titleEn, situations: u.situations };
        var idx = -1;
        units.forEach(function (x, i) { if (x.id === clean.id) idx = i; });
        if (idx >= 0) units[idx] = clean; else units.push(clean);
        setLibraryUnits(units);
        return reply(true, null);
      }
      if (d.op === "delete") {
        setLibraryUnits(units.filter(function (x) { return x.id !== d.payload; }));
        return reply(true, null);
      }
      reply(false, null, "알 수 없는 요청");
    } catch (err) { reply(false, null, String(err)); }
  });

  /* ---- 영상학습: 관리자 "영상 편집"에서 고친 영상 목록을 이 브라우저에 보관해 위 기본 VIDEOS 대신
     쓴다. 편집기(public/hancare-video-editor.html)와는 postMessage(hcVid)로 연결.
     docs/VIDEO_EDITOR_DESIGN.md §6 */
  var VIDEO_LIST_KEY = "hc-videos";
  var DEFAULT_VIDEOS = VIDEOS;
  function applyVideos(list) {
    // 화면이 영상이 하나 이상 있다고 전제하므로, 비어 있으면 기본 영상을 쓴다.
    VIDEOS = Array.isArray(list) && list.length ? list.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }) : DEFAULT_VIDEOS;
  }
  applyVideos(readJSON(VIDEO_LIST_KEY, null));
  window.addEventListener("message", function (e) {
    var frame = document.getElementById("videoEditorFrame");
    var d = e.data;
    if (!frame || e.source !== frame.contentWindow || !d || d.hcVid !== "req") return;
    var reply = function (ok, data, error) { e.source.postMessage({ hcVid: "res", id: d.id, ok: ok, data: data, error: error }, "*"); };
    var auth = getAuth();
    if (!auth || auth.role !== "admin") return reply(false, null, "관리자만 편집할 수 있습니다.");
    if (d.op === "list") return reply(true, VIDEOS);
    // 편집기의 "관련 학습" 선택지 — 기초한글·실습한글 유닛(편집한 내용 포함)
    if (d.op === "units") return reply(true, ALL_UNITS);
    if (d.op === "save") {
      var list = d.payload;
      var ok = Array.isArray(list) && list.every(function (v) { return v && typeof v.id === "string" && v.id && Array.isArray(v.cues); });
      if (!ok) return reply(false, null, "영상 목록 형식이 올바르지 않습니다.");
      writeJSON(VIDEO_LIST_KEY, list);
      applyVideos(list);
      return reply(true, null);
    }
    reply(false, null, "알 수 없는 요청");
  });

  /* ---- XR실습: 관리자 "XR실습 편집"에서 고친 모듈 배열을 이 브라우저에 보관해 위 기본 모듈 대신 쓴다 ---- */
  var XR_KEY = "hc-xr-modules";
  var DEFAULT_XR_MODULES = XR_MODULES;
  function applyXrModules(list) {
    // 화면이 모듈이 하나 이상 있다고 전제하므로, 비어 있으면 기본 모듈을 쓴다.
    XR_MODULES = Array.isArray(list) && list.length ? list.slice().sort(function (a, b) { return a.order - b.order; }) : DEFAULT_XR_MODULES;
  }
  applyXrModules(readJSON(XR_KEY, null));
  window.addEventListener("message", function (e) {
    var frame = document.getElementById("xrEditorFrame");
    var d = e.data;
    if (!frame || e.source !== frame.contentWindow || !d || d.hcXr !== "req") return;
    var reply = function (ok, data, error) { e.source.postMessage({ hcXr: "res", id: d.id, ok: ok, data: data, error: error }, "*"); };
    var auth = getAuth();
    if (!auth || auth.role !== "admin") return reply(false, null, "관리자만 편집할 수 있습니다.");
    if (d.op === "get") return reply(true, XR_MODULES);
    if (d.op === "put") {
      if (!Array.isArray(d.payload) || !d.payload.length) return reply(false, null, "모듈이 하나 이상 있어야 합니다.");
      var ids = {};
      for (var i = 0; i < d.payload.length; i++) {
        var m = d.payload[i];
        if (!m || !m.id || ids[m.id] || !Array.isArray(m.interactions)) return reply(false, null, "모듈 형식이 올바르지 않습니다: " + (m && m.id));
        ids[m.id] = 1;
      }
      writeJSON(XR_KEY, d.payload);
      applyXrModules(d.payload);
      return reply(true, null);
    }
    reply(false, null, "알 수 없는 요청");
  });

  /* ---- 역할극: 관리자 "역할극 편집"의 시나리오 { scenarios: { "unitId/situationId": {...} } }를 이 브라우저에 보관 ---- */
  var RP_KEY = "hc-roleplay-config";
  function getRoleplayConfig() {
    var c = readJSON(RP_KEY, null) || {};
    return { scenarios: c.scenarios && typeof c.scenarios === "object" ? c.scenarios : {} };
  }

  function mountPatientAvatar() {
    var box = document.getElementById("patientAvatarBox");

  function mockPatientOpening(scenario) { return (scenario && scenario.openingKo) || "안녕하세요."; }
  function mockPatientReply(situation, message, scenario) {
    var rules = (scenario && scenario.replies) || [];
    for (var i = 0; i < rules.length; i++) {
      var hit = (rules[i].keywords || []).some(function (k) { return k.trim() && message.indexOf(k.trim()) !== -1; });
      if (hit && rules[i].replyKo) return rules[i].replyKo;
    }
    var term = situation.terms.filter(function (t) { return message.indexOf(t.hangul) !== -1; })[0];
    if (term) return "네, " + term.hangul + " 확인 감사합니다.";
    if (message.indexOf("아프") !== -1 || message.indexOf("통증") !== -1) return "네, 조금 아파요. 잘 부탁드립니다.";
    if (message.indexOf("감사") !== -1) return "저도 감사합니다.";
    if (scenario && scenario.fallbackKo) return scenario.fallbackKo;
    return "네, 알겠습니다. (이 화면은 정적 데모라 미리 정해진 답변만 드려요 — Next.js 앱에서는 Gemini API로 실제 대화합니다.)";

  function findSituation(unitId, situationId) {
    var unit = ALL_UNITS.filter(function (u) { return u.id === unitId; })[0];
    if (!unit) return null;
    var situation = unit.situations.filter(function (s) { return s.id === situationId; })[0];
    if (!situation) return null;
    return { unit: unit, situation: situation };
  }
  function adjacentSituation(unitId, situationId, dir) {
    var unit = ALL_UNITS.filter(function (u) { return u.id === unitId; })[0];
    if (!unit) return null;
    var idx = unit.situations.findIndex(function (s) { return s.id === situationId; });
    var next = idx + dir;
    if (next < 0 || next >= unit.situations.length) return null;
    return { unitId: unit.id, situationId: unit.situations[next].id };
  }

        '<div class="card" style="padding:14px;"><p class="eyebrow">복습이 필요한 용어</p><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">' + reviewHtml + '</div><a class="btn btn-primary" style="margin-top:14px;width:100%;text-align:center;display:block;text-decoration:none;" href="#" onclick="App.navItem(\'vocab\');return false;">단어장 전체 보기</a></div>' +
        '<div class="card" style="padding:14px;"><div style="display:flex;justify-content:space-between;align-items:center;"><p class="eyebrow">최근 실습 일지</p><a href="#" onclick="App.navItem(\'journal\');return false;" style="font-size:.72rem;color:var(--brand);text-decoration:none;">일지 →</a></div><div style="margin-top:12px;">' + journalHtml + '</div></div>' +
      '</div>';

  /* ============================== COURSES ============================== */

    var mainHtml =

      '<div class="notice" style="margin-top:14px;">이 페이지는 로그인부터 학습·XR실습까지 전체 흐름을 브라우저에서만 테스트하는 독립 HTML입니다. 음성 인식(마이크)은 브라우저 설정·권한에 따라 제한될 수 있고, 역할극·대화는 서버 연동 없이 규칙 기반 응답으로 대체되어 있습니다.</div>' +
      '<div class="sectionHead"><h2>나의 진도</h2></div>' +

      '<div class="sectionHead"><h2>기초한글</h2></div><div class="itemGrid">' + basicItems + '</div>' +
      '<div class="sectionHead"><h2>실습한글</h2></div><div class="itemGrid">' + practiceItems + '</div>' +

  var App_openLesson = function (unitId, situationId) { navigate("learn", { unitId: unitId, situationId: situationId }); };
  var App_openXr = function (moduleId) { navigate("xr-practice", { moduleId: moduleId }); };

  /* ============================== ADMIN ============================== */

    var mainHtml =
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;">' +
        '<div><p class="eyebrow">기관 관리자 ADMIN</p><h1 style="margin-top:8px;font-size:1.6rem;font-weight:900;color:var(--brand-dark);">실습생 ' + LEARNERS.length + '명 진도관리</h1><p style="margin-top:6px;font-size:.82rem;color:var(--muted);">아래 학습자 목록은 실제 사용자 데이터가 아닌 데모용 목데이터입니다.</p></div>' +
        '<a class="btn btn-ghost" style="text-decoration:none;" href="#" onclick="App.navItem(\'admin-alerts\');return false;">알림 및 면담</a>' +
      '</div>' +
      '<div class="statGrid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">' +
        '<div class="card statTile"><p>전체 실습생</p><p>' + LEARNERS.length + '</p></div>' +
        '<div class="card statTile"><p>평균 발음 정확도</p><p>' + avgAcc + '%</p></div>' +
        '<div class="card statTile"><p>누적 학습 문장 수</p><p>' + totalWords + '</p></div>' +
        '<div class="card statTile"><p>주의가 필요한 실습생</p><p style="color:var(--warn);">' + attention.length + '</p></div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;align-items:flex-start;">' +
        '<div class="card" style="flex:1 1 480px;min-width:0;padding:16px;overflow-x:auto;"><p class="eyebrow">실습생 현황</p><table style="margin-top:10px;"><thead><tr><th>실습생</th><th>부서</th><th>평균 발음</th><th>최근 학습</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div style="flex:1 1 280px;max-width:360px;min-width:0;display:flex;flex-direction:column;gap:12px;">' +
          '<div class="sideCard"><p class="lbl">주의가 필요한 실습생</p><div style="margin-top:12px;">' + attentionHtml + '</div><a class="cta" href="#" onclick="App.navItem(\'admin-alerts\');return false;">면담 예약하기</a></div>' +
          '<div class="card" style="padding:16px;"><p class="eyebrow">코스 구성</p><p style="margin-top:8px;font-size:.78rem;color:var(--muted);">기초한글 ' + BASIC_UNITS[0].situations.length + '개 · 실습한글 ' + PRACTICE_UNITS[0].situations.length + '개 · XR실습 ' + XR_MODULES.length + '개 준비됨</p><a class="backlink" style="margin-top:8px;display:block;" href="#" onclick="App.navItem(\'courses\');return false;">학습자 화면 미리보기 →</a></div>' +
        '</div>' +
      '</div>';

    el.innerHTML = shell(mainHtml, "admin");
  }

  /* ============================== LESSON ============================== */
  function renderLesson() {
    var L = state.lesson;
    var found = findSituation(L.unitId, L.situationId);
    var unit = found.unit, situation = found.situation;
    var sentence = situation.sentences[Math.min(L.sentenceIndex, situation.sentences.length - 1)];
    var prev = adjacentSituation(L.unitId, L.situationId, -1);
    var next = adjacentSituation(L.unitId, L.situationId, 1);
    var idx = unit.situations.findIndex(function (s) { return s.id === L.situationId; });

    var displayLang = getSettings().displayLang;
    var bilingual = displayLang !== "ko";

    var termsHtml = situation.terms.map(function (t) {
      return '<div class="termCard"><div><div class="word">' + esc(t.hangul) + '</div><div class="rom">[' + esc(t.romanization) + (bilingual ? " · " + esc(t.glossEn) : "") + "</div></div>" +
        '<button class="playBtn" onclick="App.speakText(\'' + t.id + "','" + esc(t.hangul).replace(/'/g, "\\'") + "')\">▶</button></div>";
    }).join("");

    var syllablesHtml = sentence.syllables.map(function (syl, i) {
      var cls = "pending";
      if (L.lastScore) {
        var sc = L.lastScore.perSyllable[i];
        cls = sc ? (sc.score >= 80 ? "good" : sc.score >= 60 ? "mid" : "bad") : "pending";
      }
      return '<span class="' + cls + '">' + esc(syl) + "</span>";
    }).join("");

    var recBtnLabel = L.recordingState === "recording" ? "● 녹음 중지" : L.recordingState === "scoring" ? "채점 중…" : "🎙 따라 말하기";
    var recBtnCls = L.recordingState === "recording" ? "recording" : "idle";

    var scoreHtml;
    if (!L.lastScore) {
      scoreHtml = '<p style="color:var(--faint);font-size:.86rem;">' + (L.recordingState === "scoring" ? "채점 중입니다…" : "따라 읽기를 완료하면 결과가 표시됩니다.") + "</p>";
    } else {
      var sc = L.lastScore;
      var chips = sc.perSyllable.map(function (s) {
        var bg = s.score >= 80 ? "background:var(--good-bg);color:var(--good-text);" : "background:var(--warn-bg);color:var(--warn-text);";
        return '<div class="chip-syl" style="' + bg + '">' + esc(s.syllable) + "<br>" + s.score + "</div>";
      }).join("");
      scoreHtml =
        '<div style="display:flex;gap:14px;align-items:center;">' +
          '<div class="scoreCircle">' + sc.overall + "</div>" +
          '<div style="flex:1;">' +
            barRow("정확도 Accuracy", sc.accuracy) + barRow("유창성 Fluency", sc.fluency) + barRow("억양 Intonation", sc.intonation) +
          "</div></div>" +
        '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;">' + chips + "</div>" +
        '<p style="margin-top:10px;font-size:.68rem;color:var(--faint);">* 실제 음성 채점 모델이 아닌 텍스트 유사도 근사치입니다.</p>';
    }

    var feedbackHtml;
    if (L.recordingState !== "result") feedbackHtml = '<p style="color:var(--faint);font-size:.86rem;">따라 읽기를 완료하면 피드백이 표시됩니다.</p>';
    else feedbackHtml = L.lastFeedback.map(function (f) {
      return '<div class="feedbackItem ' + f.tone + '"><strong>' + esc(f.titleKo) + "</strong><div style=\"opacity:.85;margin-top:2px;\">" + esc(f.detailKo) + "</div></div>";
    }).join("");

    var situationHeader =
      '<div class="card" style="padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
        '<span class="eyebrow">상황 SITUATION</span><span style="flex:1;height:1px;background:var(--line);"></span>' +
        '<span style="font-size:.72rem;color:var(--faint);">' + String(idx + 1).padStart(2, "0") + " / " + String(unit.situations.length).padStart(2, "0") + '</span>' +
        '<button style="border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--brand-dark);padding:5px 9px;font-size:.82rem;" ' + (prev ? "" : "disabled") + ' onclick="App.gotoSituation(-1)">←</button>' +
        '<button style="border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--brand-dark);padding:5px 9px;font-size:.82rem;" ' + (next ? "" : "disabled") + ' onclick="App.gotoSituation(1)">→</button>' +
      '</div>' +
      '<div class="card" style="padding:14px;"><h2 style="font-size:1.15rem;color:var(--brand-dark);">' + esc(situation.titleKo) + "</h2>" +
        (bilingual ? '<p style="font-size:.82rem;color:var(--muted);margin-top:4px;">' + esc(situation.titleEn) + "</p>" : "") +
        '<p style="font-size:.86rem;color:var(--muted);margin-top:8px;line-height:1.6;">' + esc(situation.descriptionKo) + "</p>" +
        (bilingual ? '<p style="font-size:.76rem;color:var(--faint);margin-top:4px;line-height:1.6;">' + esc(situation.descriptionEn) + "</p>" : "") +
        '<div class="tagRow"><span class="tag">' + esc(situation.placeTag) + '</span><span class="tag">' + esc(situation.formalityTag) + '</span><span class="tag warn">' + esc(situation.difficultyTag) + "</span></div></div>";

    var mainHtml =
      '<a class="backlink" href="#" onclick="App.navItem(\'courses\');return false;">← 커리큘럼으로</a>' +
      '<div class="stack" style="margin-top:10px;">' +
          situationHeader +
          '<div class="card" style="padding:14px;"><p class="eyebrow">오늘의 용어 KEY TERMS</p><div class="termGrid">' + termsHtml + "</div></div>" +
          '<div class="repeatCard"><div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<p class="eyebrow" style="color:rgba(255,255,255,.75);">따라 읽기 · REPEAT AFTER ME</p>' +
            '<div style="display:flex;gap:10px;font-size:.74rem;opacity:.8;"><button onclick="App.speakSentence(1)" style="background:none;border:none;color:#fff;">▶ 원어민 발음</button><button onclick="App.speakSentence(0.6)" style="background:none;border:none;color:#fff;">느리게</button></div>' +
          "</div>" +
          '<div class="syllables" style="margin-top:10px;">' + syllablesHtml + "</div>" +
          '<p style="margin-top:8px;font-size:.78rem;color:rgba(255,255,255,.65);">[' + esc(sentence.romanization) + "]" + (bilingual ? " — " + esc(sentence.textEn) : "") + "</p>" +
          '<button class="recordBtn ' + recBtnCls + '" ' + (L.recordingState === "scoring" ? "disabled" : "") + ' onclick="App.toggleRecording()">' + recBtnLabel + "</button>" +
          (L.recErr ? '<p style="margin-top:8px;font-size:.76rem;color:#fca5a5;">' + esc(L.recErr) + "</p>" : "") +
          (!isSttSupported() ? '<p style="margin-top:8px;font-size:.76rem;color:#fcd34d;">이 브라우저는 음성 인식을 지원하지 않습니다.</p>' : "") +
          "</div>" +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
            '<div class="card" style="padding:14px;"><p class="eyebrow">발음 정확도 PRONUNCIATION</p><div style="margin-top:12px;">' + scoreHtml + "</div></div>" +
            '<div class="card" style="padding:14px;"><p class="eyebrow">AI 피드백 FEEDBACK</p><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">' + feedbackHtml + "</div>" +
              '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-primary" style="flex:1;" ' + (L.recordingState !== "result" ? "disabled" : "") + ' onclick="App.focusPractice()">집중 연습</button><button class="btn btn-ghost" style="flex:1;" ' + (L.recordingState !== "result" || L.sentenceIndex + 1 >= situation.sentences.length ? "disabled" : "") + ' onclick="App.nextSentence()">다음 문장 →</button></div></div>' +
          "</div>" +
        "</div>";

    el.innerHTML = shell(mainHtml, isPracticeUnit(unit.id) ? "learn" : "basic-hangul");
  }

  var App_gotoSituation = function (dir) {
    var target = adjacentSituation(state.lesson.unitId, state.lesson.situationId, dir);
    if (target) navigate("learn", target);
  };
  var App_speakText = function (id, text) { speak(text); markTermPracticed(id); };
  var App_speakSentence = function (rate) {
    var settings = getSettings();
    var found = findSituation(state.lesson.unitId, state.lesson.situationId);
    var sentence = found.situation.sentences[Math.min(state.lesson.sentenceIndex, found.situation.sentences.length - 1)];
    speak(sentence.textKo, { rate: rate * settings.speechRate });
  };
  var App_toggleRecording = function () {
    var L = state.lesson;
    if (L.recordingState === "recording") { App._stopRec && App._stopRec(); return; }
    L.recordingState = "recording"; L.recErr = null; L.lastScore = null; L.lastFeedback = [];
    renderLesson();
    var found = findSituation(L.unitId, L.situationId);
    var sentence = found.situation.sentences[Math.min(L.sentenceIndex, found.situation.sentences.length - 1)];
    App._stopRec = startRecognition({
      onResult: function (text) {
        L.recordingState = "scoring"; renderLesson();
        setTimeout(function () {
          var settings = getSettings();
          var score = scoreSentence(sentence, text);
          var feedback = generateFeedback(sentence, score, settings.scoringStrictness);
          L.recordingState = "result"; L.lastScore = score; L.lastFeedback = feedback;
          recordPractice(score.overall);
          renderLesson();
        }, 450);
      },
      onError: function (msg) { L.recordingState = "idle"; L.recErr = msg; renderLesson(); }
    });
  };
  var App_focusPractice = function () { state.lesson.recordingState = "idle"; state.lesson.lastScore = null; state.lesson.lastFeedback = []; renderLesson(); };
  var App_nextSentence = function () {
    var found = findSituation(state.lesson.unitId, state.lesson.situationId);
    if (state.lesson.sentenceIndex + 1 < found.situation.sentences.length) {
      state.lesson.sentenceIndex += 1; state.lesson.recordingState = "idle"; state.lesson.lastScore = null; state.lesson.lastFeedback = [];
      renderLesson();
    }
  };
  function barRow(label, value) {
    return '<div style="margin-bottom:7px;"><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);"><span>' + label + "</span><span>" + value + '%</span></div><div class="barTrack"><div class="barFill" style="width:' + value + '%"></div></div></div>';
  }

  /* ============================== ROLEPLAY ============================== */
  function renderRoleplay() {
    var bilingual = getSettings().displayLang !== "ko";
    var R = state.roleplay;
    var found = findSituation(R.unitId, R.situationId);
    var situation = found.situation;
    var scenario = getRoleplayScenario(R.unitId, R.situationId);
    if (scenario.enabled === false) {
      el.innerHTML = shell(
        '<a class="backlink" href="#" onclick="App.openLesson(\'' + R.unitId + "','" + R.situationId + '\');return false;">← 학습 화면으로</a>' +
        '<div class="card" style="margin-top:12px;padding:32px;text-align:center;"><p style="font-size:1.05rem;font-weight:700;color:var(--brand-dark);">' + esc(situation.titleKo) + '</p>' +
        '<p style="margin-top:8px;font-size:.84rem;color:var(--muted);">이 상황은 아직 역할극이 준비되지 않았습니다.</p></div>', "roleplay");
      return;
    }
    var patientLabel = [scenario.patientNameKo, scenario.patientProfileKo].filter(Boolean).join(" · ");
    var hintsBlock = scenario.hintsKo && scenario.hintsKo.length
      ? '<div class="card" style="padding:14px;"><p class="eyebrow">추천 표현 · 눌러서 입력</p><div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">' +
          scenario.hintsKo.map(function (h, i) {
            return '<button onclick="App.roleplayHint(' + i + ')" style="text-align:left;border:none;background:var(--panel);border-radius:10px;padding:9px 12px;font-size:.84rem;color:var(--brand-dark);cursor:pointer;">' + esc(h) + '</button>';
          }).join("") + '</div></div>'
      : "";
    var msgsHtml = R.messages.map(function (m) {
      return '<div class="chatMsg ' + (m.role === "user" ? "user" : "assistant") + '" style="align-self:' + (m.role === "user" ? "flex-end" : "flex-start") + ';">' + esc(m.content) + "</div>";
    }).join("");

    var termsBlock = situation.terms.length
      ? '<div class="card" style="padding:14px;"><p class="eyebrow">이 상황의 용어</p><div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">' +
          situation.terms.map(function (t) {
            return '<div style="background:var(--panel);border-radius:10px;padding:9px 12px;"><b style="font-size:.84rem;color:var(--brand-dark);">' + esc(t.hangul) + '</b>' + (bilingual ? '<div style="font-size:.7rem;color:var(--muted);">' + esc(t.glossEn) + '</div>' : "") + '</div>';
          }).join("") + '</div></div>'
      : "";

    var mainHtml =
      '<a class="backlink" href="#" onclick="App.openLesson(\'' + R.unitId + "','" + R.situationId + '\');return false;">← 학습 화면으로</a>' +
      '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:12px;">' +
        '<div style="flex:1 1 480px;min-width:0;background:var(--brand-dark);color:#fff;border-radius:18px;padding:22px;">' +
          '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;"><div><p style="font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--brand-light);">역할극 ROLE PLAY</p><h1 style="margin-top:8px;font-size:1.3rem;font-weight:900;">' + esc(situation.titleKo) + '</h1></div><span class="pill" style="background:rgba(255,255,255,.12);">환자 역: ' + esc(patientLabel || "정적 데모") + '</span></div>' +
          (scenario.goalKo ? '<p style="margin-top:12px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 13px;font-size:.8rem;line-height:1.55;color:rgba(255,255,255,.85);"><b style="color:var(--brand-light);margin-right:6px;">목표</b>' + esc(scenario.goalKo) + '</p>' : "") +
          '<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;">' + msgsHtml + '</div>' +
          '<div style="margin-top:16px;display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px;">' +
            '<input id="roleplayInput" placeholder="직접 입력하거나 마이크로 말해보세요…" style="flex:1;min-width:0;background:none;border:none;color:#fff;" onkeydown="if(event.key===\'Enter\')App.roleplaySend()" />' +
            (isSttSupported() ? '<button onclick="App.roleplayMic()" style="border:none;border-radius:999px;padding:8px 14px;font-size:.72rem;font-weight:700;background:' + (state.roleplayRecording ? "var(--warn-accent)" : "rgba(255,255,255,.15)") + ';color:#fff;">🎙 ' + (state.roleplayRecording ? "듣는 중…" : "말하기") + '</button>' : "") +
            '<button onclick="App.roleplaySend()" style="border:none;border-radius:999px;padding:8px 14px;font-size:.72rem;font-weight:700;background:#fff;color:var(--brand);">보내기</button>' +
          '</div>' +
          (!isSttSupported() ? '<p style="margin-top:8px;font-size:.68rem;color:var(--warn-accent);">이 브라우저는 음성 인식을 지원하지 않습니다.</p>' : "") +
          '<p style="margin-top:12px;font-size:.68rem;color:rgba(255,255,255,.5);line-height:1.6;">이 독립 실행형 페이지는 서버가 없어 정해진 규칙 기반 응답으로만 동작합니다 — Next.js 앱에서는 Gemini API로 실제 대화합니다.</p>' +
        '</div>' +
        '<div style="flex:1 1 280px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:14px;">' +
          '<div class="avatarCard"><div style="display:flex;justify-content:space-between;"><p class="eyebrow" style="color:rgba(255,255,255,.8);">AI 환자 아바타</p><span class="pill" style="background:rgba(255,255,255,.15);">' + (state.avatar.state === "speaking" ? "● 말하는 중" : state.avatar.state === "listening" ? "● 듣는 중" : "대기 중") + "</span></div>" +
            '<div class="avatarFace" style="margin-top:10px;position:relative;">' +
              '<div id="patientAvatarBox" style="width:100%;height:100%;"></div>' +
              (state.avatar.state === "listening" ? '<div style="position:absolute;inset:8px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.5);pointer-events:none;animation:avatarPulse 1.6s ease-in-out infinite;"></div>' : "") +
            "</div>" +
            '<p style="margin-top:6px;font-size:.68rem;color:rgba(255,255,255,.5);">* 대화가 텍스트로만 오가 실제 음성은 없습니다 — 도착한 답변 길이에 맞춘 입모양만 재생합니다.</p>' +
          '</div>' +
          hintsBlock +
          termsBlock +
        '</div>' +
      '</div>';

    el.innerHTML = shell(mainHtml, "roleplay");
    mountPatientAvatar();
    var lastMsg = R.messages[R.messages.length - 1];
    if (patientEngine && lastMsg && lastMsg.role === "assistant" && R.spokenIndex !== R.messages.length - 1) {
      R.spokenIndex = R.messages.length - 1;
      patientEngine.playText(lastMsg.content);
    }
  }

  var App_roleplaySend = function () {
    var input = document.getElementById("roleplayInput");
    var text = input ? input.value.trim() : "";
    if (!text) return;
    var R = state.roleplay;
    var found = findSituation(R.unitId, R.situationId);
    R.messages.push({ role: "user", content: text });
    state.avatar.state = "speaking";
    renderRoleplay();
    setTimeout(function () {
      R.messages.push({ role: "assistant", content: mockPatientReply(found.situation, text, getRoleplayScenario(R.unitId, R.situationId)) });
      state.avatar.state = "idle";
      renderRoleplay();
    }, 450);
  };
  var App_roleplayMic = function () {
    if (state.roleplayRecording) { state._stopRoleplayRec && state._stopRoleplayRec(); return; }
    state.roleplayRecording = true;
    state.avatar.state = "listening";
    renderRoleplay();
    state._stopRoleplayRec = startRecognition({
      onResult: function (text) {
        state.roleplayRecording = false;
        var R = state.roleplay;
        var found = findSituation(R.unitId, R.situationId);
        R.messages.push({ role: "user", content: text });
        state.avatar.state = "speaking";
        renderRoleplay();
        setTimeout(function () {
          R.messages.push({ role: "assistant", content: mockPatientReply(found.situation, text, getRoleplayScenario(R.unitId, R.situationId)) });
          state.avatar.state = "idle";
          renderRoleplay();
        }, 450);
      },
      onError: function () { state.roleplayRecording = false; state.avatar.state = "idle"; renderRoleplay(); }
    });
  };

  /* ============================== 기초한글 (상황별 학습) ============================== */
  function renderBasicHangul() {
    var bilingual = getSettings().displayLang !== "ko";
    var practiced = getPracticedTerms();

    var situationsHtml = BASIC_UNITS[0].situations.map(function (s) {
      var termsHtml = s.terms.map(function (t) {
        var learned = practiced.indexOf(t.id) !== -1;
        return '<div class="termCard"><div><div class="word">' + esc(t.hangul) + '</div><div class="rom">[' + esc(t.romanization) + ']' + (bilingual ? " · " + esc(t.glossEn) : "") + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:.68rem;color:' + (learned ? "var(--brand)" : "var(--faint)") + ';">' + (learned ? "학습함" : "아직") + '</span>' +
          '<button class="playBtn" onclick="App.vocabPlay(\'' + t.id + "','" + t.hangul.replace(/'/g, "\\'") + '\')">▶</button></div></div>';
      }).join("");
      return '<div class="card" style="padding:14px;margin-top:14px;">' +
        '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;">' +
          '<div><h2 style="font-size:1.05rem;font-weight:700;color:var(--brand-dark);">' + esc(s.menuLabelKo) + '</h2><p style="margin-top:4px;font-size:.82rem;color:var(--muted);">' + esc(s.titleKo) + '</p>' +
            '<div class="tagRow" style="margin-top:8px;"><span class="tag">' + esc(s.placeTag) + '</span><span class="tag">' + esc(s.formalityTag) + '</span></div></div>' +
          '<button class="btn btn-primary" style="flex:none;white-space:nowrap;" onclick="App.openLesson(\'' + BASIC_UNITS[0].id + "','" + s.id + '\')">학습하기 →</button>' +
        '</div>' +
        '<div class="termGrid">' + termsHtml + '</div>' +
      '</div>';
    }).join("");

    var mainHtml =
      '<p class="eyebrow">기초한글 BASIC HANGUL</p><h1 style="margin-top:8px;font-size:1.6rem;font-weight:900;color:var(--brand-dark);">한글 자체를 처음부터 배우기</h1>' +
      '<p style="margin-top:6px;font-size:.82rem;color:var(--muted);">자음·모음, 받침, 기초 낱말 등 한글 자체를 처음부터 배웁니다. 각 상황에 등장하는 용어는 바로 듣고 연습할 수 있고, 전체 용어는 단어장 메뉴에서 모아볼 수 있습니다.</p>' +
      '<button type="button" onclick="App.openMediSsam()" style="display:inline-flex;align-items:center;gap:14px;border:none;border-radius:16px;background:var(--brand-dark);padding:14px 18px;margin-top:14px;cursor:pointer;text-align:left;">' +
        '<span style="flex:none;width:48px;height:48px;border-radius:999px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.4rem;">🩺</span>' +
        '<span><span style="display:block;font-size:1rem;font-weight:700;color:#fff;">메디쌤과 대화 연습</span><span style="display:block;margin-top:2px;font-size:.78rem;color:rgba(255,255,255,.7);">AI 아바타와 실제 문장을 말해보세요 ↗</span></span>' +
      '</button>' +
      situationsHtml;

    el.innerHTML = shell(mainHtml, "basic-hangul");
  }

  /* ============================== 단어장 (기초한글+실습한글 전체 용어) ============================== */
  function renderVocab() {
    var bilingual = getSettings().displayLang !== "ko";
    var practiced = getPracticedTerms();
    var V = state.vocab;
    var all = getAllTerms();
    var shown = all.filter(function (t) {
      var learned = practiced.indexOf(t.id) !== -1;
      if (V.tab === "학습함" && !learned) return false;
      if (V.tab === "아직" && learned) return false;
      if (V.group && t.group !== V.group) return false;
      if (V.query && t.hangul.indexOf(V.query) === -1 && t.glossEn.toLowerCase().indexOf(V.query.toLowerCase()) === -1) return false;
      return true;
    });
    var cardsHtml = shown.length === 0
      ? '<p class="card" style="padding:26px;text-align:center;color:var(--muted);font-size:.86rem;">조건에 맞는 용어가 없습니다.</p>'
      : '<div class="itemGrid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr));">' + shown.map(function (t) {
          var learned = practiced.indexOf(t.id) !== -1;
          return '<div class="vocabCard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
            '<div><p style="font-size:1.05rem;font-weight:700;color:var(--brand-dark);">' + esc(t.hangul) + '</p><p class="mono" style="font-size:.7rem;color:var(--muted);margin-top:3px;">[' + esc(t.romanization) + ']' + (bilingual ? " · " + esc(t.glossEn) : "") + '</p></div>' +
            '<button class="playBtn" onclick="App.vocabPlay(\'' + t.id + "','" + t.hangul.replace(/'/g, "\\'") + '\')">▶</button>' +
            '</div>' + (t.note ? '<p style="margin-top:8px;font-size:.72rem;color:var(--muted);line-height:1.45;">' + esc(t.note) + '</p>' : "") +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;"><span style="font-size:.68rem;color:' + (learned ? "var(--brand)" : "var(--faint)") + ';">' + (learned ? "학습함" : "아직") + '</span>' +
            (t.custom
              ? '<span style="font-size:.7rem;color:var(--faint);">' + esc(t.group || "단어장 단어") + '</span>'
              : '<a href="#" onclick="App.openLesson(\'' + t.unitId + "','" + t.situationId + '\');return false;" style="font-size:.7rem;color:var(--brand);text-decoration:none;">' + esc(t.situationLabelKo) + ' →</a>') +
            '</div></div>';
        }).join("") + '</div>';

    var tabsHtml = ["전체", "학습함", "아직"].map(function (t) {
      return '<button class="tabPill' + (V.tab === t ? " active" : "") + '" onclick="App.vocabTab(\'' + t + '\')">' + t + '</button>';
    }).join("");
    // 단어장 편집(관리자)에서 붙인 분류가 있으면 분류 필터를 보여준다.
    var groups = [];
    all.forEach(function (t) { if (t.group && groups.indexOf(t.group) === -1) groups.push(t.group); });
    groups.sort(function (a, b) { return a.localeCompare(b, "ko"); });
    if (groups.length) {
      tabsHtml += '<span style="align-self:center;color:var(--line);margin:0 4px;">|</span>' + [""].concat(groups).map(function (g, i) {
        return '<button class="tabPill' + (V.group === g ? " active" : "") + '" onclick="App.vocabGroup(' + i + ')">' + esc(g || "모든 분류") + '</button>';
      }).join("");
    }
    state.vocabGroups = [""].concat(groups);

    var mainHtml =
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;">' +
        '<div><p class="eyebrow">단어장 VOCABULARY</p><h1 style="margin-top:8px;font-size:1.6rem;font-weight:900;color:var(--brand-dark);">내 의료 용어 ' + all.length + '개</h1>' +
        '<p style="margin-top:6px;font-size:.82rem;color:var(--muted);">학습 화면에서 용어 듣기 버튼을 누르면 "학습함"으로 표시됩니다 (' + practiced.length + '/' + all.length + ').</p></div>' +
        '<input value="' + esc(V.query) + '" oninput="App.vocabSearch(this.value)" placeholder="용어 검색 · Search" style="min-width:200px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--card);color:var(--text);" />' +
      '</div>' +
      savedVideoTermsHtml() +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;">' + tabsHtml + '</div>' +
      '<div style="margin-top:16px;">' + cardsHtml + '</div>';

    el.innerHTML = shell(mainHtml, "vocab");
  }
  var App_vocabPlay = function (id, hangul) { speak(hangul); markTermPracticed(id); if (state.view === "vocab") renderVocab(); else renderBasicHangul(); };
  var App_vocabTab = function (t) { state.vocab.tab = t; renderVocab(); };
  var App_vocabSearch = function (v) { state.vocab.query = v; renderVocab(); };
  var App_vocabGroup = function (i) { state.vocab.group = (state.vocabGroups || [""])[i] || ""; renderVocab(); };

  /* ============================== REPORT ============================== */
  function renderReport() {
    var stats = getStats();
    var avgAcc = stats.accuracyCount ? Math.round(stats.accuracySum / stats.accuracyCount) : 0;
    var estMin = Math.round(stats.wordsPracticed * 0.5);
    var practiced = getPracticedTerms();
    var unitRows = ALL_UNITS.map(function (u) {
      var termIds = [];
      u.situations.forEach(function (s) { s.terms.forEach(function (t) { termIds.push(t.id); }); });
      var learned = termIds.filter(function (id) { return practiced.indexOf(id) !== -1; }).length;
      var pct = termIds.length ? Math.round((learned / termIds.length) * 100) : 0;
      return { titleKo: u.titleKo, total: termIds.length, learned: learned, pct: pct };
    });
    var completedUnits = unitRows.filter(function (u) { return u.total > 0 && u.learned === u.total; }).length;

    var mockWeekly = [58, 64, 68, 73, 79, 87];
    var weekLabels = ["1주", "2주", "3주", "4주", "5주", "6주"];
    var weeklyBars = mockWeekly.map(function (v, i) {
      return '<div class="col"><div class="bar' + (v >= 85 ? " hi" : "") + '" style="height:' + v + '%;"></div><span style="font-size:.68rem;color:var(--faint);">' + weekLabels[i] + '</span></div>';
    }).join("");

    var weakSounds = [
      { label: "모음 ㅐ / ㅔ 구분", value: 61, warn: true },
      { label: "받침 ㄺ / ㄼ", value: 64, warn: true },
      { label: "경음 ㄲ / ㄸ", value: 78, warn: false },
      { label: "문장 억양", value: 72, warn: false }
    ];
    var weakHtml = weakSounds.map(function (s) {
      return '<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:.78rem;"><span style="color:var(--brand-dark);">' + s.label + '</span><span style="font-weight:700;color:' + (s.warn ? "var(--warn)" : "var(--brand-dark)") + ';">' + s.value + '%</span></div><div class="barTrack"><div class="barFill" style="width:' + s.value + '%;background:' + (s.warn ? "var(--warn-accent)" : "var(--brand)") + ';"></div></div></div>';
    }).join("");

    var unitRowsHtml = unitRows.map(function (u) {
      return '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.84rem;align-items:center;"><span style="color:var(--brand-dark);">' + esc(u.titleKo) + '</span><span style="color:var(--muted);">' + u.learned + '/' + u.total + '</span><span style="font-weight:700;color:' + (u.pct === 100 ? "var(--brand)" : "var(--brand-dark)") + ';">' + u.pct + '%</span></div>';
    }).join("");

    var mainHtml =
      '<p class="eyebrow">발음 리포트 REPORT</p><h1 style="margin-top:8px;font-size:1.6rem;font-weight:900;color:var(--brand-dark);">내 학습 기록</h1>' +
      '<p style="margin-top:6px;font-size:.82rem;color:var(--muted);">이 브라우저에 쌓인 실제 연습 기록을 기준으로 계산합니다.</p>' +
      '<div class="statGrid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">' +
        '<div class="card statTile"><p>평균 발음 점수</p><p>' + avgAcc + ' / 100</p></div>' +
        '<div class="card statTile"><p>완료 유닛</p><p>' + completedUnits + '/' + unitRows.length + '</p></div>' +
        '<div class="card statTile"><p>학습 시간(추정)</p><p>' + estMin + '분</p></div>' +
        '<div class="card statTile"><p>연습 문장 수</p><p>' + stats.wordsPracticed + '</p></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px;">' +
        '<div class="card" style="padding:14px;"><p class="eyebrow">주차별 평균 점수 (예시)</p><div class="barChart" style="margin-top:16px;height:130px;">' + weeklyBars + '</div><p style="margin-top:12px;font-size:.68rem;color:var(--faint);">* 주차별 이력은 아직 저장하지 않아 예시 그래프입니다.</p></div>' +
        '<div class="card" style="padding:14px;"><p class="eyebrow">약한 발음 요소 (예시)</p><div style="margin-top:16px;">' + weakHtml + '</div><p style="font-size:.68rem;color:var(--faint);">* 음소 단위 분석은 아직 하지 않아 예시 값입니다.</p></div>' +
      '</div>' +
      '<div class="card" style="padding:14px;margin-top:16px;"><p class="eyebrow">유닛별 용어 학습 현황</p><div style="margin-top:12px;"><div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:.72rem;color:var(--faint);"><span>유닛</span><span>학습한 용어</span><span>진행률</span></div>' + unitRowsHtml + '</div></div>';

    el.innerHTML = shell(mainHtml, "report");
  }

  /* ============================== JOURNAL ============================== */

  var App_journalSave = function () {
    var dept = document.getElementById("journalDept").value.trim();
    var notes = document.getElementById("journalNotes").value.trim();
    var tagsRaw = document.getElementById("journalTags").value;
    if (!dept || !notes) return;
    var tags = tagsRaw.split(",").map(function (t) { return t.trim(); }).filter(function (t) { return t; });
    var entries = getJournalEntries();
    entries.unshift({ id: "journal-" + Date.now(), dateKo: todayKo(), department: dept, notesKo: notes, tags: tags, createdAt: Date.now() });
    writeJSON("hc-demo-journal", entries);
    renderJournal();

  /* ============================== NOTICES ============================== */
  function renderNotices() {
    var read = getNoticesRead();
    var notices = getAdminNotices();
    var unread = notices.filter(function (n) { return read.indexOf(n.id) === -1; }).length;
    var now = new Date();
    var described = notices.map(function (n) {
      var t = describeNoticeTime(n.createdAt, now);
      return { id: n.id, titleKo: n.titleKo, detailKo: n.detailKo, groupKo: t.groupKo, timeKo: t.timeKo };
    });
    var groupOrder = ["오늘", "이번 주", "이전"];
    var groups = groupOrder.filter(function (g) { return described.some(function (n) { return n.groupKo === g; }); });
    var groupsHtml = groups.map(function (g) {
      var rows = described.filter(function (n) { return n.groupKo === g; }).map(function (n) {
        var isRead = read.indexOf(n.id) !== -1;
        return '<button onclick="App.noticeRead(\'' + n.id + '\')" style="display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:none;background:none;border-bottom:1px solid var(--line);padding:14px 18px;' + (isRead ? "opacity:.55;" : "") + '">' +
          '<span style="width:8px;height:8px;border-radius:999px;margin-top:6px;flex:none;background:' + (isRead ? "var(--line)" : "var(--warn-accent)") + ';"></span>' +
          '<span style="flex:1;"><b style="display:block;font-size:.9rem;color:var(--brand-dark);">' + esc(n.titleKo) + '</b><small style="display:block;margin-top:4px;font-size:.76rem;color:var(--muted);">' + esc(n.detailKo) + '</small></span>' +
          '<span style="font-size:.7rem;color:var(--faint);flex:none;">' + esc(n.timeKo) + '</span></button>';
      }).join("");
      return '<div style="background:var(--panel);padding:10px 18px;font-size:.7rem;font-weight:700;color:var(--muted);">' + g + '</div>' + rows;
    }).join("");

    var listHtml = notices.length === 0
      ? '<div class="card" style="padding:30px;text-align:center;color:var(--muted);font-size:.86rem;">아직 받은 알림이 없습니다.</div>'
      : '<div class="card" style="margin-top:16px;overflow:hidden;padding:0;">' + groupsHtml + '</div>';

    var mainHtml =
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;">' +
        '<div><p class="eyebrow">알림 NOTIFICATIONS</p><h1 style="margin-top:8px;font-size:1.6rem;font-weight:900;color:var(--brand-dark);">읽지 않은 알림 ' + unread + '건</h1><p style="margin-top:6px;font-size:.82rem;color:var(--muted);">관리자가 작성한 알림입니다. 실제 발송 서버(푸시 등)는 없어 이 목록에 나타나는 것으로 전달을 대신하며, 읽음 처리만 실제로 저장됩니다.</p></div>' +
        (notices.length > 0 ? '<button class="btn btn-ghost" onclick="App.noticesReadAll()">모두 읽음으로 표시</button>' : "") +
      '</div>' +
      listHtml;

    el.innerHTML = shell(mainHtml, "notices");
  }

  var App_noticesReadAll = function () { markAllNoticesRead(); renderNotices(); };

      lines.push(sel ? "뜻 — 「" + sel.term + "」" + (sel.gloss ? ": " + sel.gloss : " (이 대사의 뜻: " + cue.textEn + ")") : "뜻 — \"" + cue.textKo + "\" = " + cue.textEn);
      lines.push("이 장면에서 — " + who + "\"" + cue.textKo + "\" (" + cue.textEn + ")");
      if (notes[0]) lines.push("쓰는 법 — " + notes[0]);
    } else if (kind === "grammar") {
      lines.push("「" + target + "」에 쓰인 문법");
      if (notes.length) notes.slice(0, 3).forEach(function (n) { lines.push("· " + n); });
      else lines.push("· 특별한 어미 없이 쓰는 기본 표현이에요. 문장 끝을 -요/-습니다로 맺으면 공손하게 말할 수 있어요.");
    } else if (kind === "examples") {
      var key = sel ? sel.term : (cue.terms && cue.terms[0] ? cue.terms[0].hangul : "");
      var ex = key ? videoExamples(key, cue.textKo) : [];
      if (!ex.length && key && key.length > 2) ex = videoExamples(key.slice(0, 2), cue.textKo);
      lines.push("「" + (key || target) + "」 예문");
      if (ex.length) ex.forEach(function (x) { lines.push("· " + x.ko + " — " + x.en); });
      else lines.push("· 같은 표현이 들어간 예문이 아직 없어요. 이 장면 대사를 그대로 따라 말해 보세요: " + cue.textKo);
    } else {
      var sim = VIDEO_SIMILAR[target] || (sel ? null : VIDEO_SIMILAR[(cue.terms && cue.terms[cue.terms.length - 1] || {}).hangul]);
      lines.push("「" + target + "」과(와) 비슷한 표현");
      if (sim) sim.forEach(function (x) { lines.push("· " + x); });
      else lines.push("· 병원에서는 -요보다 -습니다/-세요를 쓰면 더 공손하게 들려요.");
    }
    lines.push("");
    lines.push("※ 정적 데모라 미리 만든 규칙으로 답합니다. 실제 앱에서는 Gemini가 이 장면에 맞춰 설명합니다.");
    return lines.join("\n");
  }

  /* ---------- 상태·재생 제어 ---------- */
  function initVideoLesson(videoId, t) {
    var idx = Math.max(0, VIDEOS.findIndex(function (v) { return v.id === videoId; }));
    var v = VIDEOS[idx];
    var hasT = t !== undefined && t !== null && isFinite(Number(t));
    var start = hasT ? Number(t) : ((getVideoData().progress[v.id] || {}).last || 0);
    var restore = start > 1 && start < v.durationSec - 1;
    stopVideoClock();
    state.video = {
      idx: idx, time: restore ? start : 0, duration: v.durationSec, playing: false, rate: 1,
      captionMode: !videoSrc(v), loopCueId: null, selected: null, messages: [], pausedAt: null, lastSaved: 0,
      notice: restore ? (hasT ? fmtTime(start) + " 장면부터 봅니다." : "지난번 본 " + fmtTime(start) + "부터 이어봅니다.") : null,
      captionKey: null, scriptKey: null, listening: false
    };
  }
  function leaveVideoLesson() {
    var V = state.video;
    stopVideoClock();
    if (!V) return;
    var vid = document.getElementById("vidVideo");
    if (vid) vid.pause();
    videoSavePosition(VIDEOS[V.idx].id, videoGetTime());
  }
  function stopVideoClock() { if (videoClock) { clearInterval(videoClock); videoClock = null; } }
  function videoGetTime() {
    var V = state.video, vid = document.getElementById("vidVideo");
    return !V.captionMode && vid ? vid.currentTime : V.time;
  }
  function videoCurrentCue() {
    var V = state.video, cues = VIDEOS[V.idx].cues, i = findVideoCueIndex(cues, V.time);
    return i >= 0 ? cues[i] : null;
  }
  function onVideoTime(t) {
    var V = state.video, v = VIDEOS[V.idx];
    V.time = t;
    if (Math.abs(t - V.lastSaved) >= 2) { V.lastSaved = t; videoSavePosition(v.id, t); }
    if (V.loopCueId && V.playing) {
      var lc = v.cues.filter(function (c) { return c.id === V.loopCueId; })[0];
      if (lc && t >= lc.end) { videoSetTime(lc.start); return; }
    }
    updateVideoDynamic();
  }
  function onVideoPlaying(p) {
    var V = state.video;
    V.playing = p;
    if (p) V.notice = null;
    else videoSavePosition(VIDEOS[V.idx].id, videoGetTime());
    updateVideoDynamic();
  }
  function videoSetTime(sec) {
    var V = state.video, t = Math.max(0, Math.min(sec, V.duration || VIDEOS[V.idx].durationSec));
    var vid = document.getElementById("vidVideo");
    if (!V.captionMode && vid) vid.currentTime = t;
    onVideoTime(t);
  }
  function videoPlay() {
    var V = state.video;
    if (V.captionMode) {
      if (V.time >= V.duration) V.time = 0;
      stopVideoClock();
      videoClock = setInterval(function () {
        var next = Math.min(V.duration, V.time + (VIDEO_TICK_MS / 1000) * V.rate);
        onVideoTime(next);
        if (next >= V.duration) { stopVideoClock(); onVideoPlaying(false); }
      }, VIDEO_TICK_MS);
      onVideoPlaying(true);
    } else {
      var vid = document.getElementById("vidVideo");
      if (vid) { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {}); }
    }
  }
  function videoPause() {
    var V = state.video;
    if (V.captionMode) { stopVideoClock(); onVideoPlaying(false); }
    else { var vid = document.getElementById("vidVideo"); if (vid) vid.pause(); }
  }
