  function attachVideoElement() {
    var V = state.video, vid = document.getElementById("vidVideo");
    if (!vid) return;
    vid.addEventListener("timeupdate", function () { onVideoTime(vid.currentTime); });
    vid.addEventListener("play", function () { onVideoPlaying(true); });
    vid.addEventListener("pause", function () { onVideoPlaying(false); });
    vid.addEventListener("ended", function () { onVideoPlaying(false); });
    vid.addEventListener("click", function () { App_videoToggle(); });
    vid.addEventListener("loadedmetadata", function () {
      vid.playbackRate = V.rate;
      if (isFinite(vid.duration) && vid.duration > 0) { V.duration = vid.duration; var sk = document.getElementById("vidSeek"); if (sk) sk.max = vid.duration; }
    });
    // 파일이 없거나 재생할 수 없으면 같은 위치에서 자막 연습 모드로 바꾼다.
    vid.addEventListener("error", function () {
      if (state.view !== "video-lesson" || state.video !== V) return;
      V.captionMode = true; V.playing = false; V.duration = VIDEOS[V.idx].durationSec;
      document.getElementById("vidScreen").innerHTML = videoScreenInnerHtml();
      var sk = document.getElementById("vidSeek"); if (sk) sk.max = V.duration;
      updateVideoDynamic();
    });
    vid.playbackRate = V.rate;
    if (V.time > 0) { try { vid.currentTime = V.time; } catch (e) {} }
  }

  // 재생 tick마다 불린다 — 바뀐 부분만 갱신한다(<video>와 입력창은 건드리지 않음).
  function updateVideoDynamic() {
    if (state.view !== "video-lesson" || !state.video) return;
    var V = state.video, v = VIDEOS[V.idx], cue = videoCurrentCue();
    var $ = function (id) { return document.getElementById(id); };
    if (!$("vidTime")) return;
    $("vidTime").textContent = fmtTime(V.time) + " / " + fmtTime(V.duration);
    if (document.activeElement !== $("vidSeek")) $("vidSeek").value = Math.min(V.time, V.duration);
    $("vidPlayBtn").textContent = V.playing ? "⏸ 정지" : "▶ 재생";
    $("vidLoopBtn").className = "ctl" + (V.loopCueId ? " on" : "");
    $("vidLoopBtn").textContent = V.loopCueId ? "구간 반복 끄기" : "구간 반복";
    $("vidRates").innerHTML = [0.75, 1, 1.25].map(function (r) { return '<button class="' + (V.rate === r ? "on" : "") + '" onclick="App.videoRate(' + r + ')">' + r + 'x</button>'; }).join("");
    $("vidNotice").hidden = !V.notice;
    $("vidResume").hidden = V.playing || !V.messages.length || V.answering;
    if ($("vidMicBtn")) $("vidMicBtn").style.borderColor = V.listening ? "var(--warnAccent)" : "var(--line)";
    var cueId = cue ? cue.id : "";
    var capKey = cueId + "|" + (V.selected ? V.selected.term : "");
    if (capKey !== V.captionKey) {
      V.captionKey = capKey;
      $("vidCaption").innerHTML = videoCaptionHtml(cue);
      if ($("vidOverlay")) $("vidOverlay").innerHTML = videoOverlayHtml(cue);
    }
    var askedCount = (getVideoData().questions[v.id] || []).length;
    var scriptKey = cueId + "|" + V.loopCueId + "|" + askedCount;
    if (scriptKey !== V.scriptKey) {
      V.scriptKey = scriptKey;
      var list = $("vidScript");
      list.innerHTML = videoScriptHtml();
      // 재생 중인 대사가 목록 밖으로 나가지 않게 목록 안에서만 스크롤한다.
      var row = list.querySelector(".scriptRow.on");
      if (row) {
        var top = row.offsetTop - list.offsetTop;
        if (top < list.scrollTop || top + row.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = top - list.clientHeight / 3;
      }
    }
  }
  function renderVideoQa() {
    var V = state.video;
    document.getElementById("vidQaHead").innerHTML = videoQaHeadHtml();
    var msgs = document.getElementById("vidQaMsgs");
    msgs.innerHTML = videoMsgsHtml();
    msgs.scrollTop = msgs.scrollHeight;
    var input = document.getElementById("vidQaInput");
    input.placeholder = V.selected ? "\"" + V.selected.term + "\"에 대해 질문…" : "궁금한 표현을 질문하세요…";
    V.captionKey = null;
    updateVideoDynamic();
  }
  function pauseForQuestion() {
    var V = state.video;
    videoPause();
    V.pausedAt = videoGetTime();
  }
  function videoSend(kind, question) {
    var V = state.video, v = VIDEOS[V.idx];
    if (V.answering) return;
    pauseForQuestion();
    var cues = v.cues, i = findVideoCueIndex(cues, V.pausedAt), cue = i >= 0 ? cues[i] : null;
    if (cue) videoLogQuestion(v.id, { cueId: cue.id, question: question, at: Date.now() });
    var sel = V.selected;
    V.messages.push({ role: "user", content: question, ctx: fmtTime(V.pausedAt) + (cue ? " · \"" + cue.textKo + "\"" : "") });
    var answer = { role: "assistant", content: "" };
    V.messages.push(answer);
    V.answering = true;
    renderVideoQa();
    setTimeout(function () {
      answer.content = mockVideoAnswer(kind, cue, sel);
      V.answering = false;
      if (state.video === V && state.view === "video-lesson") renderVideoQa();
    }, 450);
  }

  /* ---------- App 핸들러 ---------- */
  var App_openVideo = function (id) { navigate("video-lesson", { videoId: id }); };
  var App_openVideoAt = function (id, t) { navigate("video-lesson", { videoId: id, t: t }); };
  var App_videoToggle = function () { if (state.video.playing) videoPause(); else videoPlay(); };
  var App_videoSeekBy = function (d) { videoSetTime(videoGetTime() + d); };
  var App_videoSeek = function (val) { videoSetTime(Number(val)); };
  var App_videoSeekCue = function (i) { videoSetTime(VIDEOS[state.video.idx].cues[i].start); };
  var App_videoReplayCue = function () { var c = videoCurrentCue(); if (c) videoSetTime(c.start); };
  var App_videoLoop = function () {
    var V = state.video, c = videoCurrentCue();
    V.loopCueId = V.loopCueId ? null : (c ? c.id : null);
    updateVideoDynamic();
  };
  var App_videoRate = function (r) {
    var V = state.video, vid = document.getElementById("vidVideo");
    V.rate = r;
    if (vid) vid.playbackRate = r;
    updateVideoDynamic();
  };
  var App_videoPick = function (i) {
    var V = state.video, seg = V.segs && V.segs[i], cue = videoCurrentCue();
    if (!seg || !seg.pick) return;
    pauseForQuestion();
    V.selected = { term: seg.pick, gloss: seg.gloss || "", cueId: cue ? cue.id : null };
    renderVideoQa();
  };
  var App_videoClearPick = function () { state.video.selected = null; renderVideoQa(); };
  var App_videoAsk = function (kind) {
    var sel = state.video.selected;
    var q = {
      meaning: sel ? "\"" + sel.term + "\" 무슨 뜻이에요? 이 장면에서는 어떤 의미예요?" : "방금 이 문장은 무슨 뜻이에요?",
      grammar: sel ? "\"" + sel.term + "\"에 쓰인 문법(어미·존댓말)을 설명해 주세요." : "이 문장에 쓰인 문법을 설명해 주세요.",
      examples: sel ? "\"" + sel.term + "\"을 병원에서 쓰는 예문을 더 알려 주세요." : "이 문장과 같은 형식으로 병원에서 쓰는 예문을 더 알려 주세요.",
      similar: sel ? "\"" + sel.term + "\"와 비슷한 표현이나 더 공손한 표현을 알려 주세요." : "이 문장을 다르게 말하는 방법이나 더 공손한 표현을 알려 주세요."
    }[kind];
    videoSend(kind, q);
  };
  var App_videoSubmit = function (ev) {
    ev.preventDefault();
    var input = document.getElementById("vidQaInput"), text = input.value.trim();
    if (!text) return;
    input.value = "";
    videoSend(videoAskKind(text), text);
  };
  var App_videoMic = function () {
    var V = state.video;
    if (V.listening) return;
    V.listening = true; updateVideoDynamic();
    startRecognition({
      onResult: function (text) { var input = document.getElementById("vidQaInput"); if (input) input.value = text; },
      onError: function () { V.listening = false; updateVideoDynamic(); },
      onEnd: function () { V.listening = false; updateVideoDynamic(); }
    });
  };
  var App_videoResume = function () {
    var V = state.video;
    videoSetTime((V.pausedAt !== null ? V.pausedAt : videoGetTime()) - 2);
    videoPlay();
  };
  var App_videoSaveTerm = function () {
    var V = state.video, v = VIDEOS[V.idx], sel = V.selected;
    if (!sel) return;
    var cue = v.cues.filter(function (c) { return c.id === sel.cueId; })[0] || videoCurrentCue();
    var d = getVideoData();
    if (!d.savedTerms.some(function (t) { return t.videoId === v.id && t.hangul === sel.term; })) {
      d.savedTerms.unshift({ id: v.id + ":" + sel.term, hangul: sel.term, glossEn: sel.gloss || "", sentenceKo: cue ? cue.textKo : "", videoId: v.id, videoTitleKo: v.titleKo, cueStart: cue ? cue.start : 0, savedAt: Date.now() });
      setVideoData(d);
    }
    renderVideoQa();
  };
  var App_videoRemoveTerm = function (i) {
    var d = getVideoData();
    d.savedTerms.splice(i, 1);
    setVideoData(d);
    renderVocab();
  };
  var App_videoSpeakCue = function () { var c = videoCurrentCue(); if (c) speak(c.textKo); };
  var App_videoSpeakTerm = function (i) { var t = getVideoData().savedTerms[i]; if (t) speak(t.hangul); };

  // 스페이스바 = 재생/정지 (영상 화면에서만, 입력창·버튼 포커스 시 제외)
  document.addEventListener("keydown", function (e) {
    if (state.view !== "video-lesson" || e.code !== "Space") return;
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
    e.preventDefault();
    App_videoToggle();
  });

  // 단어장 화면 상단의 "영상에서 담은 표현" 섹션
  function savedVideoTermsHtml() {
    var terms = getVideoData().savedTerms;
    if (!terms.length) return "";
    return '<div class="card" style="padding:16px;margin-top:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;"><p class="eyebrow">영상에서 담은 표현 ' + terms.length + '개</p><a href="#" onclick="App.navItem(\'video-list\');return false;" style="font-size:.72rem;color:var(--brand);text-decoration:none;">영상학습 →</a></div>' +
      '<div class="itemGrid" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));">' + terms.map(function (t, i) {
        return '<div style="border-radius:12px;background:var(--panel);padding:10px 12px;">' +
          '<div style="display:flex;gap:8px;align-items:flex-start;"><div style="flex:1;min-width:0;"><p style="font-weight:700;color:var(--brand-dark);">' + esc(t.hangul) +
          (t.glossEn ? ' <span style="font-size:.72rem;font-weight:400;color:var(--muted);">' + esc(t.glossEn) + '</span>' : "") + '</p>' +
          '<p style="margin-top:2px;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">“' + esc(t.sentenceKo) + '”</p></div>' +
          '<button class="playBtn" onclick="App.videoSpeakTerm(' + i + ')">▶</button></div>' +
          '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.68rem;">' +
            '<a href="#" onclick="App.openVideoAt(\'' + t.videoId + '\',' + Math.floor(t.cueStart) + ');return false;" style="color:var(--brand);text-decoration:none;">' + esc(t.videoTitleKo) + ' 장면 보기 →</a>' +
            '<button style="border:none;background:none;color:var(--faint);font-size:.68rem;" onclick="App.videoRemoveTerm(' + i + ')">삭제</button></div></div>';
      }).join("") + '</div></div>';
  }

  /* ============================== MODAL ============================== */
  var modalMask = document.getElementById("modalMask");
  var modalBody = document.getElementById("modalBody");
  function openModal(title, bodyHtml, opts) {
    var wide = !!(opts && opts.wide);
    modalBody.classList.toggle("wide", wide);
    var closeX = wide ? '<button type="button" class="modalCloseX" aria-label="닫기" onclick="App.closeModal()">✕</button>' : "";
    var titleStyle = wide ? "font-size:1.05rem;margin-bottom:14px;padding-right:32px;color:var(--brand-dark);" : "font-size:1rem;margin-bottom:10px;color:var(--brand-dark);";
    var closeBtn = (opts && opts.noCloseBtn) ? "" : '<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="App.closeModal()">닫기</button>';
    modalBody.innerHTML = closeX + "<h3 style=\"" + titleStyle + "\">" + esc(title) + "</h3>" + bodyHtml + closeBtn;
    modalMask.hidden = false;
  }
  modalMask.addEventListener("click", function (e) { if (e.target === modalMask) modalMask.hidden = true; });
  var App_closeModal = function () { modalMask.hidden = true; };

  /* ---------------- 메디쌤 팝업(전체화면에 가까운 크기, iframe) ---------------- */
  var mediMask = document.getElementById("mediMask");
  var mediFrame = document.getElementById("mediFrame");
  var App_openMediSsam = function () {
    mediFrame.src = "./medi-ssam.html";
    mediMask.hidden = false;
  };
  var App_closeMediSsam = function () {
    mediMask.hidden = true;
    mediFrame.src = "about:blank"; // 닫으면 음성·애니메이션이 즉시 멈추도록 언로드한다
  };
  mediMask.addEventListener("click", function (e) { if (e.target === mediMask) App_closeMediSsam(); });

  /* ---------------- 실습생 세부현황 팝업 ---------------- */
  function App_learnerDetail(id) {
    var l = LEARNERS.filter(function (x) { return x.id === id; })[0];
    if (!l) return;
    var allUnits = BASIC_UNITS.concat(PRACTICE_UNITS);
    var totalSituations = allUnits.reduce(function (s, u) { return s + u.situations.length; }, 0);
    var completedCount = l.completedSituationIds.length;
    var weekdays = ["1주", "2주", "3주", "4주", "5주", "6주"];

    var statTile = function (value, label, warn) {
      return '<div style="border:1px solid var(--card-border);border-radius:11px;background:#fff;padding:12px;"><p style="font-size:.72rem;color:var(--muted);">' + esc(label) + '</p><p style="margin-top:5px;font-size:1.2rem;font-weight:900;color:' + (warn ? "var(--warn)" : "var(--brand-dark)") + ';">' + esc(value) + '</p></div>';
    };

    var attentionHtml = l.needsAttentionKo
      ? '<div style="margin-top:12px;border:1px solid var(--warn-border);background:var(--warn-bg);border-radius:11px;padding:12px;"><p style="font-size:.76rem;font-weight:700;color:var(--warn);">⚠ 주의가 필요합니다</p><p style="margin-top:4px;font-size:.76rem;line-height:1.5;color:var(--warn);">' + esc(l.needsAttentionKo) + '</p></div>'
      : "";

    var weeklyBars = l.weeklyScores.map(function (v, i) {
      return '<div style="flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;"><div style="width:100%;border-radius:5px 5px 0 0;background:' + (v >= 85 ? "var(--brand)" : "var(--card-border)") + ';height:' + v + '%;"></div><span style="font-size:.66rem;color:var(--faint);">' + weekdays[i] + '</span></div>';
    }).join("");

    var weakSoundsHtml = l.weakSounds.map(function (s) {
      return '<div><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:6px;"><span style="color:var(--brand-dark);">' + esc(s.labelKo) + '</span><span style="font-weight:700;color:' + (s.warn ? "var(--warn)" : "var(--brand-dark)") + ';">' + s.value + '%</span></div><div style="height:6px;border-radius:999px;background:var(--chip);"><div style="height:6px;border-radius:999px;background:' + (s.warn ? "var(--warn)" : "var(--brand)") + ';width:' + s.value + '%;"></div></div></div>';
    }).join('<div style="height:10px;"></div>');

    var learnedHtml = allUnits.map(function (u) {
      var rows = u.situations.map(function (s) {
        var done = l.completedSituationIds.indexOf(s.id) !== -1;
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:8px;background:var(--chip);padding:8px 10px;font-size:.78rem;"><span style="color:' + (done ? "var(--brand-dark)" : "var(--muted)") + ';">' + esc(s.menuLabelKo) + '</span><span style="font-size:.68rem;font-weight:700;color:' + (done ? "var(--brand)" : "var(--faint)") + ';">' + (done ? "완료" : "미완료") + '</span></div>';
      }).join('<div style="height:6px;"></div>');
      return '<div><p style="font-size:.76rem;font-weight:700;color:var(--brand-dark);">' + esc(u.titleKo) + '</p><div style="margin-top:8px;display:flex;flex-direction:column;">' + rows + '</div></div>';
    }).join('<div style="height:14px;"></div>');

    var body =
      '<p style="font-size:.76rem;color:var(--muted);margin-bottom:10px;">' + esc(l.nationality) + " · " + esc(l.level) + " · " + esc(l.department) + " · 최근 학습 " + esc(l.lastActiveKo) + '</p>' +
      '<div class="modalGrid">' +
        '<div class="col-left">' +
          '<p style="border-radius:11px;background:var(--chip);padding:10px 12px;font-size:.74rem;line-height:1.5;color:var(--muted);">이 세부현황은 실제 다중 사용자 백엔드가 없어 데모용 목데이터입니다(진도관리 화면 전체와 동일). 실제 서비스에서는 이 실습생 본인 계정에 쌓인 실제 학습 기록을 표시합니다.</p>' +
          attentionHtml +
          '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">' +
            statTile(String(l.avgAccuracy), "평균 발음 정확도", l.avgAccuracy < 70) +
            statTile(String(l.wordsPracticed), "누적 학습 문장 수") +
            statTile(Math.round(l.wordsPracticed * 0.5) + "분", "학습 시간(추정)") +
            statTile(completedCount + "/" + totalSituations, "완료 상황") +
          '</div>' +
          '<div style="border:1px solid var(--card-border);border-radius:14px;padding:14px;">' +
            '<p class="eyebrow" style="margin-bottom:12px;">주차별 평균 점수 (예시)</p>' +
            '<div style="height:90px;display:flex;align-items:flex-end;gap:8px;">' + weeklyBars + '</div>' +
            '<p style="margin-top:8px;font-size:.66rem;color:var(--faint);">* 주차별 이력은 저장하지 않아 예시 그래프입니다.</p>' +
          '</div>' +
          '<div style="border:1px solid var(--card-border);border-radius:14px;padding:14px;">' +
            '<p class="eyebrow" style="margin-bottom:12px;">약한 발음 요소 (예시)</p>' +
            weakSoundsHtml +
            '<p style="margin-top:10px;font-size:.66rem;color:var(--faint);">* 음소 단위 분석은 하지 않아 예시 값입니다.</p>' +
          '</div>' +
        '</div>' +
        '<div class="col-right">' +
          '<div style="border:1px solid var(--card-border);border-radius:14px;padding:14px;">' +
            '<p class="eyebrow" style="margin-bottom:12px;">학습한 내용</p>' +
            learnedHtml +
          '</div>' +
        '</div>' +
      '</div>';

    openModal(esc(l.name), body, { wide: true });
  }

  /* ============================== EXPORT ============================== */
  window.App = {
    login: App_login, quickLogin: App_quickLogin, logout: App_logout, navItem: App_navItem,
    openLesson: App_openLesson, openXr: App_openXr, openRoleplay: App_openRoleplay,
    gotoSituation: App_gotoSituation, speakText: App_speakText, speakSentence: App_speakSentence,
    toggleRecording: App_toggleRecording, focusPractice: App_focusPractice, nextSentence: App_nextSentence,
    xrGoto: App_xrGoto, xrDismissDialogue: App_xrDismissDialogue, xrStart: App_xrStart, xrInteract: App_xrInteract, xrSubmit: App_xrSubmit, xrModal: App_xrModal,
    closeModal: App_closeModal, learnerDetail: App_learnerDetail,
    openMediSsam: App_openMediSsam, closeMediSsam: App_closeMediSsam,
    toggleTopLang: App_toggleTopLang, toggleSettingsLang: App_toggleSettingsLang, setDisplayLang: App_setDisplayLang,
    setSpeechRate: App_setSpeechRate, setScoringStrictness: App_setScoringStrictness,
    vocabTab: App_vocabTab, vocabSearch: App_vocabSearch, vocabPlay: App_vocabPlay, vocabGroup: App_vocabGroup,
    journalSave: App_journalSave,
    noticeRead: App_noticeRead, noticesReadAll: App_noticesReadAll,
    roleplaySend: App_roleplaySend, roleplayMic: App_roleplayMic,
    openVideo: App_openVideo, openVideoAt: App_openVideoAt, videoToggle: App_videoToggle, videoSeekBy: App_videoSeekBy,
    videoSeek: App_videoSeek, videoSeekCue: App_videoSeekCue, videoReplayCue: App_videoReplayCue, videoLoop: App_videoLoop,
    videoRate: App_videoRate, videoPick: App_videoPick, videoClearPick: App_videoClearPick, videoAsk: App_videoAsk,
    videoSubmit: App_videoSubmit, videoMic: App_videoMic, videoResume: App_videoResume, videoSaveTerm: App_videoSaveTerm,
    videoRemoveTerm: App_videoRemoveTerm, videoSpeakCue: App_videoSpeakCue, videoSpeakTerm: App_videoSpeakTerm,
    noticeFillAudience: App_noticeFillAudience, noticeSend: App_noticeSend, noticeDelete: App_noticeDelete,
    resetLibrary: App_resetLibrary, resetVocab: App_resetVocab, resetXr: App_resetXr, resetVideos: App_resetVideos, resetRoleplay: App_resetRoleplay, roleplayHint: App_roleplayHint,
    selectVoice: App_selectVoice, previewVoice: App_previewVoice
  };

  /* ============================== BOOT ============================== */
  // 이 파일을 새로 열 때는(이전 로그인 정보가 localStorage에 남아 있어도)
  // 항상 로그인 화면부터 보여준다. 데모 계정 자체는 여전히 유효하므로
  // "학습자로 시작" 등을 누르면 바로 들어갈 수 있다.
  navigate("login");
})();
</script>
</body>
</html>
