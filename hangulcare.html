<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="로그인부터 진도관리, 기초·실습한글 학습, XR실습, 관리자 화면까지 앱 전체를 브라우저에서 바로 테스트하는 독립 프로토타입">
<title>HangulCare</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --card-border: rgba(15,46,36,.10);
    --text: #16241d;
    --text-muted: #5b6b63;
    --brand: #1f7a5c;
    --brand-dark: #0f2e24;
    --brand-soft: #e8f3ee;
    --chip-bg: rgba(15,46,36,.06);
    --warn-bg: #fff4e0;
    --warn-text: #8a5a00;
    --good-bg: #e8f6ee;
    --good-text: #186a43;
    --danger-bg: #fdecec;
    --danger-text: #a23b3b;
    --shadow: 0 1px 2px rgba(15,46,36,.06), 0 8px 24px -12px rgba(15,46,36,.18);
    --monitor-bg: #07140f;
    --monitor-grid: rgba(124,255,178,.10);
    --monitor-fg: #7cffb2;
    --monitor-dim: #3d8a63;
    --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1613; --card: #142019; --card-border: rgba(255,255,255,.09);
      --text: #eef2ef; --text-muted: #9fb0a8; --brand: #3cb583; --brand-dark: #0a1f18;
      --brand-soft: rgba(60,181,131,.16); --chip-bg: rgba(255,255,255,.07);
      --warn-bg: rgba(255,196,79,.14); --warn-text: #ffcf6b;
      --good-bg: rgba(60,181,131,.16); --good-text: #6ee0ac;
      --danger-bg: rgba(220,90,90,.14); --danger-text: #ff9c9c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1613; --card: #142019; --card-border: rgba(255,255,255,.09);
    --text: #eef2ef; --text-muted: #9fb0a8; --brand: #3cb583; --brand-dark: #0a1f18;
    --brand-soft: rgba(60,181,131,.16); --chip-bg: rgba(255,255,255,.07);
    --warn-bg: rgba(255,196,79,.14); --warn-text: #ffcf6b;
    --good-bg: rgba(60,181,131,.16); --good-text: #6ee0ac;
    --danger-bg: rgba(220,90,90,.14); --danger-text: #ff9c9c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
  h1,h2,h3 { text-wrap: balance; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: var(--shadow); }
  .btn { border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: .86rem; border: 1px solid transparent; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-ghost { background: var(--card); border-color: var(--card-border); }
  .btn-ghost:hover { border-color: var(--brand); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: .68rem; font-weight: 600; }
  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 12px; padding: 10px 14px; font-size: .8rem; line-height: 1.55; }

  /* ---------------- topbar ---------------- */
  .topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--brand-dark); color: #fff; border-radius: 16px; padding: 12px 16px; margin-block: 16px;
  }
  .mark { width: 38px; height: 38px; border-radius: 10px; flex: none; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem; text-decoration: none; color: #fff; }
  .topbar .titles { min-width: 120px; flex: 1 1 140px; }
  .topbar .titles h1 { font-size: .98rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .titles p { margin: 1px 0 0; font-size: .72rem; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .chip { flex: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 5px 11px; font-size: .74rem; }
  .topbar .iconbtn { flex: none; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 9px; padding: 6px 11px; font-size: .8rem; font-weight: 600; }
  .topbar .iconbtn:hover { background: rgba(255,255,255,.18); }
  .backlink { display: inline-block; margin-top: 4px; font-size: .78rem; font-weight: 600; color: var(--brand); text-decoration: none; }
  .backlink:hover { text-decoration: underline; }

  /* ---------------- login ---------------- */
  .loginWrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .loginCard { width: min(380px, 100%); padding: 26px; }
  .loginCard .head { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .74rem; color: var(--text-muted); margin-bottom: 5px; }
  .field input { width: 100%; border: 1px solid var(--card-border); border-radius: 10px; padding: 9px 12px; background: var(--bg); color: var(--text); }
  .demoBox { margin-top: 14px; border-radius: 12px; background: var(--brand-soft); padding: 12px; font-size: .78rem; }
  .demoBox .row { display: flex; gap: 8px; margin-top: 8px; }
  .demoBox button { flex: 1; }
  .errMsg { color: var(--danger-text); font-size: .78rem; margin: 4px 0 10px; }

  /* ---------------- stat tiles ---------------- */
  .statGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 10px; }
  .statTile { text-align: center; padding: 12px; }
  .statTile p:first-child { font-size: .72rem; color: var(--text-muted); }
  .statTile p:last-child { margin-top: 4px; font-weight: 700; font-family: var(--font-mono); }

  /* ---------------- course sections ---------------- */
  .sectionHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .sectionHead h2 { font-size: 1rem; }
  .itemGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; }
  .itemBtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card); font-weight: 600; font-size: .86rem; }
  .itemBtn:hover { border-color: var(--brand); background: var(--brand-soft); }
  .itemBtn.disabled { color: var(--text-muted); background: var(--bg); cursor: default; }
  .itemBtn.disabled:hover { border-color: var(--card-border); background: var(--bg); }

  /* ---------------- lesson screen ---------------- */
  .lessonGrid { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 14px; margin-top: 12px; }
  @media (max-width: 860px) { .lessonGrid { grid-template-columns: 1fr; } }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
  .tagRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { background: var(--brand-soft); color: var(--brand-dark); border-radius: 999px; padding: 3px 10px; font-size: .72rem; font-weight: 600; }

  .termGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; margin-top: 10px; }
  .termCard { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px; }
  .termCard .word { font-weight: 700; }
  .termCard .rom { font-size: .72rem; color: var(--text-muted); }
  .playBtn { flex: none; width: 30px; height: 30px; border-radius: 999px; border: none; background: var(--brand-soft); color: var(--brand-dark); }
  .playBtn:hover { background: var(--brand); color: #fff; }

  .repeatCard { background: var(--brand-dark); color: #fff; border-radius: 16px; padding: 16px; }
  .syllables { display: flex; flex-wrap: wrap; gap: 4px; font-size: 1.7rem; font-weight: 700; }
  .syllables span.pending { color: #fff; }
  .syllables span.good { color: #6ee7a4; }
  .syllables span.mid { color: #fcd34d; }
  .syllables span.bad { color: #fca5a5; }
  .recordBtn { margin-top: 14px; border-radius: 999px; padding: 9px 20px; font-weight: 700; font-size: .86rem; border: none; }
  .recordBtn.idle { background: var(--brand); color: #fff; }
  .recordBtn.recording { background: #e05252; color: #fff; }

  .avatarCard { background: var(--brand); color: #fff; border-radius: 16px; padding: 14px; }
  .avatarFace { aspect-ratio: 4/3; border-radius: 12px; background: rgba(10,31,24,.4); display: flex; align-items: center; justify-content: center; }
  .avatarFace .dots { display: flex; gap: 16px; }
  .avatarFace .eye { width: 10px; height: 10px; border-radius: 999px; background: #fff; }
  .avatarFace .mouth { width: 32px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.9); margin-top: 14px; }
  .avatarFace.speaking .mouth { animation: talk .35s ease-in-out infinite; }
  @keyframes talk { 0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);} }
  @media (prefers-reduced-motion: reduce) { .avatarFace.speaking .mouth { animation: none; } }

  .scoreCircle { width: 64px; height: 64px; border-radius: 999px; border: 4px solid var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .barTrack { height: 6px; border-radius: 999px; background: var(--chip-bg); margin-top: 3px; }
  .barFill { height: 6px; border-radius: 999px; background: var(--brand); }
  .chip-syl { border-radius: 8px; padding: 4px 7px; font-size: .68rem; font-weight: 700; text-align: center; }

  .feedbackItem { border-radius: 10px; padding: 8px 10px; font-size: .82rem; }
  .feedbackItem.warning { background: var(--warn-bg); color: var(--warn-text); }
  .feedbackItem.success { background: var(--good-bg); color: var(--good-text); }

  .chatMsg { max-width: 85%; border-radius: 12px; padding: 8px 11px; font-size: .84rem; }
  .chatMsg.user { margin-left: auto; background: var(--brand); color: #fff; }
  .chatMsg.assistant { background: var(--bg); }

  /* ---------------- XR viewport ---------------- */
  .viewport { position: relative; aspect-ratio: 16/10; overflow: hidden; border-radius: 16px; background: var(--monitor-bg);
    background-image: linear-gradient(var(--monitor-grid) 1px, transparent 1px), linear-gradient(90deg, var(--monitor-grid) 1px, transparent 1px);
    background-size: 28px 28px; }
  .viewport .vpLabel { position: absolute; top: 12px; left: 14px; font-size: .62rem; letter-spacing: .07em; color: var(--monitor-dim); border: 1px dashed var(--monitor-dim); padding: 3px 7px; border-radius: 8px; }
  .viewport svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .monitorPanel { position: absolute; top: 12px; right: 12px; width: min(58%,220px); background: rgba(7,20,15,.82); border: 1px solid var(--monitor-dim); border-radius: 10px; padding: 9px 11px; color: var(--monitor-fg); }
  .monitorPanel .lbl { font-size: .6rem; letter-spacing: .06em; color: var(--monitor-dim); margin-bottom: 3px; }
  .monitorPanel .reading { font-family: var(--font-mono); font-size: .82rem; min-height: 2.2em; }
  .monitorPanel .log { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(124,255,178,.18); max-height: 76px; overflow-y: auto; }
  .monitorPanel .log div { font-family: var(--font-mono); font-size: .64rem; color: var(--monitor-dim); margin-bottom: 2px; }
  .monitorPanel .log strong { color: var(--monitor-fg); font-weight: 500; }
  .dialogueBubble { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 440px; background: rgba(255,255,255,.96); color: var(--brand-dark); border-radius: 12px; padding: 11px 13px; }
  .dialogueBubble .who { font-weight: 700; font-size: .8rem; }
  .dialogueBubble .say { font-size: .84rem; margin-top: 2px; }
  .dialogueBubble .sayEn { font-size: .72rem; color: var(--text-muted); margin-top: 2px; }
  .hint { position: absolute; left: 12px; bottom: 12px; color: var(--monitor-fg); font-family: var(--font-mono); font-size: .72rem; background: rgba(7,20,15,.7); padding: 7px 11px; border-radius: 9px; border: 1px solid var(--monitor-dim); }
  .rail { display: flex; flex-direction: column; gap: 8px; }
  .railBtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border-radius: 12px; padding: 10px 13px; border: 1px solid var(--card-border); background: var(--card); font-weight: 600; font-size: .84rem; }
  .railBtn:hover { border-color: var(--brand); }
  .railBtn.start { background: var(--brand); color: #fff; border-color: var(--brand); }
  .railBtn.started { background: var(--good-bg); color: var(--good-text); }
  .railBtn.submit { background: var(--brand-dark); color: #fff; }
  .railBtn:disabled { opacity: .45; cursor: not-allowed; }

  .modGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; margin-top: 12px; }
  .modCard { display: flex; flex-direction: column; gap: 7px; padding: 14px; text-align: left; }
  .modCard:hover { border-color: var(--brand); }
  .modCard .top { display: flex; align-items: center; gap: 8px; }
  .modCard .order { width: 28px; height: 28px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .82rem; flex: none; }

  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .84rem; white-space: nowrap; }
  th { text-align: left; font-size: .72rem; color: var(--text-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--card-border); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--card-border); }

  .modalMask { position: fixed; inset: 0; background: rgba(8,16,13,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  .modal { width: min(440px,100%); background: var(--card); border-radius: 16px; padding: 18px; max-height: 84vh; overflow-y: auto; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modalMask" id="modalMask" hidden><div class="modal" id="modalBody"></div></div>

  var App_setLang = function (l) { state.lesson.lang = l; renderLesson(); };
  var App_gotoSituation = function (dir) {
    var target = adjacentSituation(state.lesson.unitId, state.lesson.situationId, dir);
    if (target) navigate("learn", target);
  };
  var App_speakText = function (text) { speak(text); };
  var App_speakSentence = function (rate, isAvatar) {
    var found = findSituation(state.lesson.unitId, state.lesson.situationId);
    var sentence = found.situation.sentences[Math.min(state.lesson.sentenceIndex, found.situation.sentences.length - 1)];
    if (isAvatar) state.lesson.avatarState = "speaking";
    renderLesson();
    speak(sentence.textKo, { rate: rate, onEnd: function () { if (isAvatar) { state.lesson.avatarState = "idle"; renderLesson(); } } });
  };
  var App_toggleRecording = function () {
    var L = state.lesson;
    if (L.recordingState === "recording") { App._stopRec && App._stopRec(); return; }
    L.recordingState = "recording"; L.recErr = null; L.avatarState = "listening"; L.lastScore = null; L.lastFeedback = [];
    renderLesson();
    var found = findSituation(L.unitId, L.situationId);
    var sentence = found.situation.sentences[Math.min(L.sentenceIndex, found.situation.sentences.length - 1)];
    App._stopRec = startRecognition({
      onResult: function (text) {
        L.recordingState = "scoring"; renderLesson();
        setTimeout(function () {
          var score = scoreSentence(sentence, text);
          var feedback = generateFeedback(sentence, score);
          L.recordingState = "result"; L.lastScore = score; L.lastFeedback = feedback; L.avatarState = "idle";
          recordPractice(score.overall);
          renderLesson();
        }, 450);
      },
      onError: function (msg) { L.recordingState = "idle"; L.avatarState = "idle"; L.recErr = msg; renderLesson(); }
    });
  };
  var App_focusPractice = function () { state.lesson.recordingState = "idle"; state.lesson.lastScore = null; state.lesson.lastFeedback = []; renderLesson(); };
  var App_nextSentence = function () {
    var found = findSituation(state.lesson.unitId, state.lesson.situationId);
    if (state.lesson.sentenceIndex + 1 < found.situation.sentences.length) {
      state.lesson.sentenceIndex += 1; state.lesson.recordingState = "idle"; state.lesson.lastScore = null; state.lesson.lastFeedback = [];
      renderLesson();
    }
  };
  function mockChatReply(situation, message) {
    var term = situation.terms.filter(function (t) { return message.indexOf(t.hangul) !== -1; })[0];
    if (term) return "'" + term.hangul + "'는 " + term.glossEn + " 라는 뜻이에요. [" + term.romanization + "]로 발음합니다.";
    if (message.indexOf("예문") !== -1) { var s2 = situation.sentences[1] || situation.sentences[0]; return "다른 표현 예: \"" + s2.textKo + "\" (" + s2.textEn + ")"; }
    if (message.indexOf("역할") !== -1) return "좋아요, 제가 환자 역할을 해볼게요. \"" + situation.descriptionKo + "\" 상황이에요. 편하게 말을 걸어보세요.";
    return "질문 감사합니다! 이 화면은 정적 데모라 미리 정해진 답변만 드려요. 실제 앱에서는 Gemini API가 상황에 맞춰 답합니다.";
  }
  var App_sendChat = function (text) {
    var found = findSituation(state.lesson.unitId, state.lesson.situationId);
    state.lesson.chatMessages.push({ role: "user", content: text });
    state.lesson.chatMessages.push({ role: "assistant", content: mockChatReply(found.situation, text) });
    renderLesson();
  };
  var App_submitChat = function (ev) {
    ev.preventDefault();
    var input = document.getElementById("chatInput");
    var val = input.value.trim();
    if (!val) return;
    App_sendChat(val);
  };
  var App_startRoleplay = function () { App_sendChat("환자 역할을 맡아서 저와 대화를 시작해 주세요."); };

  function barRow(label, value) {
    return '<div style="margin-bottom:6px;"><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-muted);"><span>' + label + "</span><span>" + value + '%</span></div><div class="barTrack"><div class="barFill" style="width:' + value + '%"></div></div></div>';
  }

  /* ============================== XR LIST ============================== */
  function renderXrList() {
    var prog = getXrProgress();
    var cards = XR_MODULES.map(function (m) {
      var done = prog[m.id] && prog[m.id].submitted;
      return '<button class="card modCard" onclick="App.openXr(\'' + m.id + '\')">' +
        '<div class="top"><span class="order">' + String(m.order).padStart(2, "0") + '</span><span style="margin-left:auto;font-size:.72rem;color:var(--text-muted);" class="mono">법정 ' + m.legalHours + "시간</span></div>" +
        "<h3 style=\"font-size:.92rem;\">" + esc(m.titleKo) + "</h3><p style=\"font-size:.72rem;color:var(--text-muted);\">" + esc(m.titleEn) + "</p>" +
        '<p style="font-size:.76rem;color:var(--text-muted);">환자: ' + esc(m.patientNameKo) + "</p>" +
        '<div style="display:flex;gap:6px;margin-top:auto;"><span class="pill" style="background:var(--chip-bg);color:var(--text-muted);">테스트 가능</span>' + (done ? '<span class="pill" style="background:var(--good-bg);color:var(--good-text);">완료 ✓</span>' : "") + "</div></button>";
    }).join("");
    el.innerHTML = topbar("XR실습 · HnaCare XR") +
      '<main><a class="backlink" href="#" onclick="App.nav(\'courses\');return false;">← 코스 목록</a>' +
      '<div class="sectionHead" style="margin-top:10px;"><h2>XR실습 5대 모듈</h2></div>' +
      '<div class="modGrid">' + cards + "</div></main>";
  }

  /* ============================== XR PRACTICE ============================== */
  function renderXrPractice() {
    var X = state.xr, m = XR_MODULES[X.moduleIndex];
    var prev = X.moduleIndex > 0 ? XR_MODULES[X.moduleIndex - 1] : null;
    var next = X.moduleIndex < XR_MODULES.length - 1 ? XR_MODULES[X.moduleIndex + 1] : null;

    var logHtml = m.interactions.filter(function (it) { return X.completed.indexOf(it.id) !== -1; })
      .map(function (it) { return "<div><strong>" + esc(it.labelKo) + "</strong> — " + esc(it.resultKo) + "</div>"; }).join("");

    var interactionBtns = m.interactions.map(function (it) {
      var done = X.completed.indexOf(it.id) !== -1;
      return '<button class="railBtn" ' + (X.started ? "" : "disabled") + ' onclick="App.xrInteract(\'' + it.id + '\')">' + esc(it.labelKo) + (done ? ' <span style="color:var(--good-text);">✓</span>' : "") + "</button>";
    }).join("");

    el.innerHTML =
      '<header class="topbar">' +
        '<a class="mark" href="#" onclick="App.nav(\'xr-list\');return false;">한</a>' +
        '<div class="titles"><h1>' + esc(m.titleKo) + '</h1><p>환자 ' + esc(m.patientNameKo) + "</p></div>" +
        '<span class="chip">모듈 ' + (X.moduleIndex + 1) + " / " + XR_MODULES.length + "</span>" +
        '<button class="iconbtn" ' + (prev ? "" : "disabled") + ' onclick="App.xrGoto(-1)">←</button>' +
        '<button class="iconbtn" ' + (next ? "" : "disabled") + ' onclick="App.xrGoto(1)">→</button>' +
        '<button class="iconbtn" onclick="App.nav(\'xr-list\')">← 목록</button>' +
      "</header>" +
      '<main style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;">' +
        '<div class="viewport">' +
          '<span class="vpLabel">3D VIEWPORT · WIREFRAME PREVIEW</span>' +
          '<svg viewBox="0 0 400 230" fill="none" stroke="#7cffb2" stroke-width="1.4" opacity=".85">' +
            '<rect x="26" y="150" width="230" height="46" rx="6"></rect><line x1="26" y1="168" x2="256" y2="168"></line>' +
            '<rect x="14" y="112" width="16" height="88" rx="3"></rect><rect x="252" y="128" width="14" height="72" rx="3"></rect>' +
            '<line x1="40" y1="196" x2="40" y2="212"></line><line x1="242" y1="196" x2="242" y2="212"></line>' +
            '<ellipse cx="150" cy="150" rx="78" ry="17"></ellipse><rect x="70" y="128" width="46" height="24" rx="10"></rect><circle cx="92" cy="132" r="15"></circle>' +
            '<line x1="320" y1="40" x2="320" y2="150" stroke-dasharray="2 4"></line><circle cx="320" cy="36" r="7"></circle>' +
            '<rect x="340" y="70" width="46" height="34" rx="4"></rect><polyline points="344,90 352,90 356,78 362,100 368,84 372,90 382,90"></polyline>' +
          "</svg>" +
          '<div class="monitorPanel"><div class="lbl">인터랙션 결과 모니터</div><div class="reading">' + esc(X.reading) + '</div>' +
            (logHtml ? '<div class="log">' + logHtml + "</div>" : "") + "</div>" +
          (!X.dialogueDismissed
            ? '<div class="dialogueBubble"><div class="who">' + esc(m.patientNameKo) + '</div><div class="say">' + esc(m.situationKo) + '</div><div class="sayEn">' + esc(m.situationEn) + '</div><button class="btn btn-primary" style="margin-top:8px;padding:6px 12px;font-size:.78rem;" onclick="App.xrDismissDialogue()">다음</button></div>'
            : '<span class="hint">▶ 오른쪽에서 실습시작을 눌러 진행하세요</span>') +
        "</div>" +
        '<div class="rail">' +
          '<button class="railBtn" onclick="App.xrModal(\'환자정보\')">환자정보</button>' +
          '<button class="railBtn" onclick="App.xrModal(\'상황안내\')">상황안내</button>' +
          '<button class="railBtn ' + (X.started ? "started" : "start") + '" ' + (X.started ? "disabled" : "") + ' onclick="App.xrStart()">' + (X.started ? "실습 진행 중" : "실습시작") + "</button>" +
          interactionBtns +
          '<button class="railBtn" onclick="App.xrModal(\'도움말\')">도움말</button>' +
          '<button class="railBtn submit" ' + (X.completed.length === 0 ? "disabled" : "") + ' onclick="App.xrSubmit()">리포트제출</button>' +
          (X.completed.length === 0 ? '<p style="font-size:.7rem;color:var(--text-muted);padding:0 2px;">인터랙션을 1개 이상 완료하면 제출할 수 있어요.</p>' : "") +
        "</div>" +
      "</main>";
  }
  var App_xrGoto = function (dir) {
    var ni = state.xr.moduleIndex + dir;
    if (ni < 0 || ni >= XR_MODULES.length) return;
    navigate("xr-practice", { moduleId: XR_MODULES[ni].id });
  };
  var App_xrDismissDialogue = function () { state.xr.dialogueDismissed = true; renderXrPractice(); };
  var App_xrStart = function () { state.xr.started = true; renderXrPractice(); };
  var App_xrInteract = function (interactionId) {
    var X = state.xr, m = XR_MODULES[X.moduleIndex];
    if (!X.started) return;
    var it = m.interactions.filter(function (i) { return i.id === interactionId; })[0];
    X.reading = it.resultKo;
    if (X.completed.indexOf(it.id) === -1) { X.completed.push(it.id); xrMarkCompleted(m.id, it.id); }
    renderXrPractice();
  };
  var App_xrSubmit = function () {
    var X = state.xr, m = XR_MODULES[X.moduleIndex];
    if (X.completed.length === 0) return;
    xrMarkSubmitted(m.id);
    var items = m.interactions.filter(function (it) { return X.completed.indexOf(it.id) !== -1; })
      .map(function (it) { return '<div style="border-top:1px solid var(--card-border);padding:8px 0;"><strong>' + esc(it.labelKo) + "</strong><div class=\"mono\" style=\"font-size:.76rem;color:var(--text-muted);margin-top:2px;\">" + esc(it.resultKo) + "</div></div>"; }).join("");
    openModal("리포트 — " + m.titleKo, '<p style="font-size:.84rem;color:var(--text-muted);">환자 ' + esc(m.patientNameKo) + " · 완료 " + X.completed.length + "/" + m.interactions.length + "개 인터랙션</p>" + items);
  };
  var App_xrModal = function (which) {
    var m = XR_MODULES[state.xr.moduleIndex];
    if (which === "환자정보") openModal("환자정보", "<p style=\"font-size:.86rem;line-height:1.6;\"><strong>" + esc(m.patientNameKo) + "</strong><br>실습 모듈: " + esc(m.titleKo) + "<br>법정 실습시간: " + m.legalHours + "시간<br>적용 예정 기술: " + esc(m.techNoteKo) + "</p>");
    else if (which === "상황안내") openModal("상황안내", "<p style=\"font-size:.84rem;color:var(--text-muted);\">(실제 서비스에서는 영상이 재생됩니다. 프로토타입은 텍스트로 대체합니다.)</p><p style=\"font-size:.86rem;\">“" + esc(m.situationKo) + "”<br><span style=\"color:var(--text-muted);\">" + esc(m.situationEn) + "</span></p>");
    else openModal("도움말", '<p style="font-size:.84rem;">1. <strong>실습시작</strong>을 눌러 인터랙션 버튼을 활성화하세요.</p><p style="font-size:.84rem;">2. 각 버튼을 눌러 결과를 확인하세요.</p><p style="font-size:.84rem;">3. 하나 이상 완료하면 <strong>리포트제출</strong>로 마무리할 수 있어요.</p>');
  };

  /* ============================== MODAL ============================== */
  var modalMask = document.getElementById("modalMask");
  var modalBody = document.getElementById("modalBody");
  function openModal(title, bodyHtml) {
    modalBody.innerHTML = "<h3 style=\"font-size:1rem;margin-bottom:10px;\">" + esc(title) + "</h3>" + bodyHtml + '<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="App.closeModal()">닫기</button>';
    modalMask.hidden = false;
  }
  modalMask.addEventListener("click", function (e) { if (e.target === modalMask) modalMask.hidden = true; });
  var App_closeModal = function () { modalMask.hidden = true; };

  /* ============================== EXPORT ============================== */
  window.App = {
    login: App_login, quickLogin: App_quickLogin, logout: App_logout, goHome: App_goHome, nav: App_nav,
    openLesson: App_openLesson, openXr: App_openXr,
    setLang: App_setLang, gotoSituation: App_gotoSituation, speakText: App_speakText, speakSentence: App_speakSentence,
    toggleRecording: App_toggleRecording, focusPractice: App_focusPractice, nextSentence: App_nextSentence,
    sendChat: App_sendChat, submitChat: App_submitChat, startRoleplay: App_startRoleplay,
    xrGoto: App_xrGoto, xrDismissDialogue: App_xrDismissDialogue, xrStart: App_xrStart, xrInteract: App_xrInteract, xrSubmit: App_xrSubmit, xrModal: App_xrModal,
    closeModal: App_closeModal
  };

  /* ============================== BOOT ============================== */
  var auth = getAuth();
  if (auth) navigate(auth.role === "admin" ? "admin" : "courses");
  else navigate("login");
})();
</script>
</body>
</html>
